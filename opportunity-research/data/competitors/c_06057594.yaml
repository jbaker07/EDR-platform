    - "How should the conflicting RAM guidance be reconciled - at least 4GB dedicated to most mod packs (apexgamingpcs.com) against at least 16GB DDR4/DDR5 system RAM (grandgoldman.com)? No fetched page distinguishes allocated Java heap from system memory."
    - "The cluster's members split between modded Minecraft hardware, general mod installation, and a third strand about obtaining modded or pirated game copies ('download modded pc games', 'how to get modded pokemon games on pc', 'how to get modded mobile games on pc'). No fetched page addresses that third strand, and it may carry legal and policy constraints that make it unsuitable as an opportunity."
    - "Is windowscentral.com (rank 1 for 'best gaming pc for modded minecraft', categorised unclassified) an editorially independent review or another affiliate shortlist? It was outside the selection rule and was not fetched."
    - "No traffic, audience or revenue figure is known for any site here; none of the fetched pages stated one. The only share figure available is positional - the input file's \"dominant_share\": 0.11 for facebook.com across 18 checked results, the most fragmented of the three clusters."
