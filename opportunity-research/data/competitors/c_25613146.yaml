synthesis:
  pieced_together_answer: "Every fetched page supplies a different fragment and none completes the task. The method - check socket, then chipset, then BIOS - is stated redundantly by four editorial pages (cgdirector.com, xda-developers.com, pcguide.com, apexgamingpcs.com), with xda-developers.com adding TDP and the concrete socket-to-generation mapping. The authority they all defer to is the board maker's own CPU support list, represented here by asrock.com (which returned an empty body). The only CPU-first lookup is Intel's, and it lives on a different domain from the article that describes it, covers Intel only, and is dated 2023. The BIOS step - which pcguide.com and cgdirector.com both say determines whether the PC boots at all - has no lookup anywhere in the checked results: it is left as manual work on the vendor site. The one interactive board-first database that loaded, teamgroupinc.com, checks memory and SSDs rather than CPUs, and the aggregator two pages point to, pcpartpicker.com, blocked fetching."
  single_destination_would_need: "A board-first and CPU-first lookup over a single cross-brand table: enter a motherboard model (or a CPU) and get the compatible parts from both Intel and AMD, each row carrying the minimum BIOS version and its release date, a flag for pairings that need a BIOS flash before install, and the socket/chipset/TDP checks resolved automatically rather than explained. Per the fetched pages that is four things no single checked result offers together: cross-vendor coverage (Intel's tool is Intel-only), board-first direction (Intel's is CPU-first), BIOS-revision data (absent from every fetched page as data rather than advice), and currency (the fetched method articles date from Nov 2022, Jan 2024, Apr 2024 and May 2024, and Intel's from Apr 2023)."
  existing_tools_that_do_this: "Partially: the Intel Product Compatibility Tool at compatibleproducts.intel.com, named and linked by the fetched Intel support page ('use the Intel Product Compatibility Tool', with a motherboard vendor filter) - Intel processors only, and not itself fetched. PCPartPicker is named by a fetched page as an aggregator of 'noted compatibilities' but blocked both fetch attempts, so its coverage and BIOS handling are unverified. TEAMGROUP's Compatibility Check by Motherboard is a working board-first tool but for memory and SSDs, not CPUs. No cross-brand CPU-to-motherboard tool was confirmed in the checked results."
  data_source_and_reproducibility: "inference: the source data is public and structured - every board maker publishes a per-model CPU support list, and three fetched pages instruct readers to use exactly those lists, with pcguide.com stating the rows follow a 'Brand Name, BIOS version, Date' format. That consistent shape, plus Intel's and TEAMGROUP's existing structured lookups, suggests an aggregated database is reproducible from public vendor pages. Two practical obstacles were observed in this task: asrock.com returned an empty body twice and pcpartpicker.com returned 403 twice, so ingestion would have to handle blocking and JavaScript-rendered tables. Specification data (sockets, chipsets, TDP) is stable; BIOS-version data changes with each vendor release and would need continuous refresh, which is also where the fetched articles are most out of date."
  ai_resilience: "inference: split sharply. The conceptual layer - socket, chipset, BIOS and TDP, and what happens if you get it wrong - is fully AI-replaceable and is what four of the six fetched pages sell; a chat assistant answers it in one turn without a click. The lookup layer is highly AI-resistant: which specific CPUs a named board accepts, and at which minimum BIOS revision, is per-model data that changes with firmware releases, and an assistant answering from memory would be wrong in the exact way that, per the fetched pages, stops a PC from booting. This cluster's resilient value therefore sits entirely in the data, not the explanation."
  open_questions:
    - "pcpartpicker.com blocked both fetch attempts, so whether its compatibility filter already covers CPU-to-board pairings with BIOS caveats - the core of the opportunity - is unverified and is the single biggest gap in this analysis"
    - "asrock.com returned an empty body, so the structure of a board maker's CPU support list (fields, BIOS columns, whether it is scrapeable) was not directly observed, only described second-hand by pcguide.com"
    - "no AMD-side equivalent of Intel's compatibility tool appeared in the checked results; whether AMD publishes one is unknown"
    - "the Intel Product Compatibility Tool itself was not fetched (only the support article pointing to it), so its coverage, currency and whether it surfaces BIOS requirements are unknown"
    - "shimetadevice.com appeared on both checked queries (2 of 18) and steamcommunity.com twice more, but fell outside the 8-site selection rule; community threads might reveal whether BIOS-flash failures are the real recurring pain"
    - "en.wikipedia.org ranked 4th on 'cpu motherboard compatibility list' with a generic Hardware compatibility list article - categorised reference and outside the selection rule - suggesting the query returns near-miss results rather than a real list"
