synthesis:
  pieced_together_answer: "No single fetched page answers the cluster. The physical diagnosis-and-fix content lives on a commercial door installer's blog (doorslosangeles.com: an 11-step cause list from hinges to strike plates to warped slabs). The legal/landlord angle - who must fix a door that does not self-close and latch, and how to escalate - lives on nyc.gov and is valid only in New York City. The fire-safety framing sits behind a Canterbury City Council PDF that did not render. Peer experience sits on Bunnings Workshop, Quora and Facebook, none of which returned usable answers in this pass; the one Facebook post that did return shows a question with no answer. Separately, the cluster's second checked query, \"should i close all doors\", pulls in an entirely different meaning - a productivity SaaS essay on facilethings.com - showing the head term is ambiguous across at least three unrelated intents (mechanical repair, fire/building code, life advice)."
  single_destination_would_need: "A symptom-driven diagnostic that takes what the user observes (rubs at the top, does not latch, swings open on its own, new pre-hung door, seasonal) and the door context (interior/exterior, hinge type, hollow or solid, rental or owned) and returns one ranked cause, the specific adjustment, the exact parts and tools, and a decision point for when the frame is racked or the slab is warped and a professional or replacement is the answer. It would also have to resolve the ambiguity in the head term up front (repair vs. fire-door/self-closing obligation vs. should-I-close-interior-doors), and for renters route to the local obligation and complaint path rather than to a DIY fix. None of the fetched pages does more than one of these."
  existing_tools_that_do_this: "none found in the checked results - the cluster's fragmentation record reports tool_hits 0, and every page fetched was an article, an official information page, a PDF or a social/forum post; no calculator, database or diagnostic tool was found."
  data_source_and_reproducibility: "inference: there is no proprietary dataset anywhere in this cluster. The repair content is generic carpentry knowledge, freely reproducible. The one piece of structured data is municipal law (NYC Housing Maintenance Code section 27-2041.1 on nyc.gov, and whatever the Canterbury fire-door sheet contains), which is public and rebuildable, but is jurisdiction-by-jurisdiction and would have to be compiled per locality - that compilation, not the repair advice, is the only defensible data asset visible here."
  ai_resilience: "inference: low for the advice layer. Every fetched page's substance - cause lists, adjustment steps, when to call a pro - is exactly what a chat assistant answers well, and an assistant can condition on the user's symptoms where a static list cannot. Resilience is higher for two things no assistant supplies: a verified local obligation and complaint path for renters (the nyc.gov role), and the physical work itself, which is where every commercial page funnels the reader."
  open_questions:
    - "Four of eight selected pages failed to fetch (canterbury.gov.uk PDF unreadable, ushl.samsung.com DNS failure, Bunnings body truncated twice, Quora 403), so the community and official halves of this cluster are under-evidenced; a second pass with a different fetch path is needed before concluding what the forums actually contain."
    - "The head term is ambiguous across at least three intents. Unknown from the fetched pages: what share of the 21 cluster members mean mechanical repair versus fire-code versus the productivity/metaphor sense - the input file's intent counts (fix 16 of 21) suggest repair dominates, but the checked queries included \"should i close all doors\", which pulled only non-repair results."
    - "Whether a searcher arriving at nyc.gov actually converts to a 311 complaint, and how many jurisdictions publish an equivalent page, is unknown - only NYC and Canterbury appeared in the checked results."
    - "The Samsung refrigerator-door result ranking for a generic \"door won't close\" query suggests appliance doors are part of this demand; how large that slice is, is unknown from the fetched pages."
    - "No page fetched states traffic, users, revenue or market share, so competitive strength in this cluster is unmeasured; dominates_serp counts are the only ranking-presence evidence available."
