synthesis:
  pieced_together_answer: "Four fragments, none co-located. The national range sits on thisoldhouse.com (\"$15–$150 per square foot\"), nerdwallet.com (\"$15 to $150 per square foot\") and sofi.com (\"$15 and $60 per square foot\") - and these three disagree with each other while two of them cite the same upstream source, Angi. The room-level breakdown, which is what \"per square foot\" actually needs, is on blockrenovation.com (nine room types, kitchens \"$150–$400+\" down to bedrooms \"$40–$120\"). The local layer is separate again: brickunderground.com and the 2018 Goodreads post both give NYC bands, and no fetched page gives a second city. The step from a range to a number is on nobody's page - homeadvisor.com says outright that it \"does not calculate individualized costs without professional input\", sofi.com says \"The best way to estimate your renovation costs is to talk to a local contractor\", and thisoldhouse.com converts the reader into a lead for All Star Pros. The reader must therefore combine a national tier, a room mix, a local multiplier they cannot find, and a contingency (\"an extra 10-15% as a cushion\") by hand."
  single_destination_would_need: "It would have to take scope (which rooms, what finish level), size (square footage per room, not per house), and location, and return one defensible number with a stated range - which means (a) room-level rather than whole-house rates, since the fetched spread between a bedroom and a kitchen is roughly three-to-one, (b) real local multipliers beyond NYC, which no fetched page provides, (c) a visible, dated methodology, since four of seven fetched pages state no source and one is eight years old, (d) the contingency and permit/approval steps that only the two NYC pages mention, and (e) no requirement to surrender contact details to see the number. The gap is not more content; it is the arithmetic and the localisation that every page leaves to the reader."
  existing_tools_that_do_this: "Partially: Block Renovation has an on-page renovation cost calculator (\"Get an initial estimate based on your space and project details\"), NerdWallet links out to a \"home improvement cost calculator\", and HomeAdvisor and This Old House offer zip-code quote forms that route to contractors rather than compute. None of the fetched pages returns a computed project number without entering a sales funnel. The input file records six tool hits across 19 results, but one of those \"tool\" results is a 2018 Goodreads author blog post."
  data_source_and_reproducibility: "Largely reproducible, and visibly recycled. sofi.com cites \"Angi.com\" and \"HomeGuide.com\"; thisoldhouse.com cites \"estimates from Angi\" plus \"two nationwide homeowner surveys conducted in 2026\"; brickunderground.com, blockrenovation.com and the Goodreads post state no source at all. The only claimed primary data is HomeAdvisor's - \"We surveyed over 10,000 real customers about their project costs\" - together with public inputs it names including \"the U.S. Bureau of Labor Statistics\". A new entrant could rebuild the national layer from published sources; the genuinely scarce input is actual local bid data, which the marketplaces generate as a by-product and none of them publishes."
  ai_resilience: "inference: low for what these pages currently publish and moderate for what they withhold. A national per-square-foot range restated from two named public sources is precisely what a chat assistant produces, and the assistant will also do the multiplication the reader is currently left to do. What survives is anything grounded in transaction data - real bids in a specific market at a specific date - and the contractor introduction itself. Note also that brickunderground.com openly says the requested metric is weak (\"per-square-foot averages are slightly less predictive\"), which means the durable answer is a scoped estimate, not a rate."
  open_questions:
    - "Angi returned 403 and is cited as the upstream source by two other fetched pages; how its numbers are produced, and how many downstream pages depend on them, is unknown."
    - "No fetched page states local multipliers outside NYC, so whether city-level per-square-foot data exists at scale anywhere is unknown."
    - "HomeAdvisor states a survey of \"over 10,000 real customers\" but not the sample per project type or region, so the precision of its ranges is unknown."
    - "Block Renovation and HomeAdvisor both broker actual jobs; whether their published ranges are derived from their own bid data is not stated on the fetched pages."
    - "The cluster's members span UK, India, Canada, Toronto, Calgary and London, but the checked results are US/NYC-centric; non-US supply is unknown from this task."
    - "No fetched page states how far a per-square-foot estimate typically lands from the final bid, so the accuracy ceiling of any calculator is unknown."
