synthesis:
  pieced_together_answer: "The task splits into four parts and each fetched page holds at most one. Which job could take me abroad is answered by William Russell (ten sectors, named countries, salary figures), Preply (eleven jobs with salary ranges by country), AFAR (eight travel careers with the exact credentials each demands) and A Way Abroad (eleven jobs with required certifications, from lived experience). What are the steps is answered only by GoAbroad, which covers visas, housing, insurance, banking and money in ten generic steps and then tells the reader to ask an embassy. Should I go at all is answered by One Journey Away, on emotional readiness, and by the archived Yale essay from 2006 on career framing. Am I eligible, what will it cost, and what does my target country actually require is answered by none of the fetched pages - every one of them defers it to the reader (do your research, check with a local embassy, do your due diligence on understanding visas, you have the right visa and work permit). The cluster's own member queries ask for costs and a calculator; nothing fetched supplies either."
  single_destination_would_need: "A destination would have to turn the deferral into the product: take nationality, occupation, qualifications, income and household (including pets, which appear in the member queries), then return the visa routes the person actually qualifies for, with current requirements, timelines and fees; the money answer - upfront cost of the move plus cost of living and tax exposure in each candidate country; job routes that match the qualifications rather than a generic top-ten list; and a document checklist that tracks progress. The four fetched job lists would collapse into one filtered result set, and the step-by-step guide would become a per-country plan instead of a caveat."
  existing_tools_that_do_this: "none found in the checked results - the input file records tool_hits 0 and vendor_share 0.0 across 18 checked results, and all seven fetched pages are articles. One caveat: expatsi.com ranks sixth for the head term with the title Support for Americans Moving Abroad, but its category in the input file is unclassified so it was not selected under the selection rule and was not fetched; what it offers, whether it is a tool, and what it charges are all unknown. Two money-transfer guides (wise.com, 2 of 18 results) were also below the selection cut and are unassessed."
  data_source_and_reproducibility: "inference: the data is public but heavy. Visa routes, eligibility criteria, fees and processing times are published by governments; cost-of-living and salary figures come from public statistical and job-board sources; tax treatment is published by revenue authorities. Nothing is proprietary, which is why none of these pages has a moat - but the same facts are spread across dozens of jurisdictions, are written in legal language, and change often, so the build is a sustained data-maintenance operation rather than a scrape. Note also that the salary figures stated on William Russell and Preply carry no source on the page, so their provenance is unknown."
  ai_resilience: "inference: split. Everything the fetched pages actually contain - generic steps, job lists, decision framing - is fully replaceable by a chat assistant, which can additionally filter by the reader's background, something no static list does. What resists is the part none of the pages attempt: current, jurisdiction-specific visa eligibility, fees and timelines, where a confident wrong answer has real consequences and the user needs a citation to an authority. A product whose value is advice is not defensible here; one whose value is verified current requirements plus progress tracking is."
  open_questions:
    - "Go Overseas ranks second for the head term and could not be fetched (403), so the strongest general guide in the checked set is unassessed."
    - "What expatsi.com actually is - it ranks sixth for the head term with a title suggesting a service for Americans moving abroad, but it fell outside the selection rule and is unfetched; it may already be the tool this cluster lacks."
    - "Whether willingness to pay exists at all - the visible monetisation across fetched pages is insurance, language tutoring, affiliate commissions, magazine subscriptions and one mentorship offer, i.e. everyone monetises adjacent to the task rather than the task itself."
    - "Which direction of travel the demand is - the member queries mix moving from the USA, from the UK and from India, and visa eligibility differs entirely by passport, so the addressable problem may be several separate products."
    - "Whether the calculate intent (10 of 56 member queries, including move abroad calculator and how much money to move abroad) is about upfront moving cost, ongoing cost of living, or income required for a visa - these need different data and no fetched page addresses any of them."
    - "Liability and accuracy standards for stating immigration eligibility, and whether a non-advisory framing is sufficient - unaddressed by every fetched page."
