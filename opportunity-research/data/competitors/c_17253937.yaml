synthesis:
  pieced_together_answer: "The answer is split three ways and no fetched page holds more than one part. Phrase banks by competency live on HR-software blogs (Quantum Workplace 171, Rippling 88, PerformYard 200+ with role cuts, Factorial 1000+ across ~22 categories, Profit.co 50, BetterUp 31 for problem solving alone). Rating-anchored wording - comments matched to a Poor-to-Outstanding scale - appears only on the university HR page (southeastern.edu), which is also the only fetched page with no commercial motive. Process and preparation guidance, how to run the conversation at all, sits on hr.mit.edu and is tied to one employer's cycle. The personalisation step is on none of them: every fetched page explicitly hands it back to the reader (Southeastern: tailored to the individual employee; Quantum Workplace: inspiration, not a script; PerformYard: what you actually know about this specific person)."
  single_destination_would_need: "One site would have to take the manager's raw inputs - employee role, rating scale in use, the employer's competency list, goals set last cycle, and a few sentences of observed evidence - and emit finished, rating-consistent review text in the employer's own section structure, with a strengths/improvement balance, a defensible-language check for HR risk, and a self-review variant for employees. In other words the destination has to own the two steps the phrase banks refuse: matching wording to a rating level, and grounding it in specific evidence about one person."
  existing_tools_that_do_this: "none found in the checked results - the input file records tool_hits 0 and vendor_share 0.0 across 18 checked results, and all eight fetched pages are articles or guides. The only generation capability visible is a vendor feature referenced inside an article (PerformYard's AI review assist), not a page a searcher can use; whether it is usable without a paid account is unknown. Note that the cluster's member queries explicitly ask for one (performance review comments generator, ai performance review generator for employees, free ai performance review generator for employees)."
  data_source_and_reproducibility: "inference: fully reproducible. Every fetched page is authored prose with no underlying dataset, no licensing and no proprietary corpus; the largest bank in the cluster (1000+ phrases) is a volume claim, not an asset. A competitor could regenerate an equivalent or larger bank, organised by competency, rating level and role, in a day. That means the phrase bank itself cannot be the business - the defensible layer would be the employer-specific context (rating scale, competency framework, form structure) and the evidence a manager supplies."
  ai_resilience: "inference: low for the content, higher for the workflow. A chat assistant answers the head term better than any fetched page - it emits phrases for any competency and then writes the personalised paragraph, which is precisely the gap every page leaves open. What an assistant does not have by default is the employer's rating scale and competency framework, the manager's notes in a structured place, the review form to write into, and any record-keeping or consistency check across a team. Any durable product here lives in that integration and compliance layer, not in the wording."
  open_questions:
    - "Whether the searchers are managers writing about others or employees writing self-reviews - the cluster's member queries contain both (performance review manager comments, performance review tips for employees), and the two need different products."
    - "Whether HRIS vendors already ship review generators behind a login: PerformYard's article references an AI review-assist feature, but nothing about its scope, price or quality is visible on the fetched pages."
    - "Whether output format matters enough to monetise - none of the fetched pages exports into an employer's review form, and it is unknown whether that friction is real for searchers."
    - "Whether HR-risk wording review (defensible, evidence-linked language) is something buyers would pay for; no fetched page addresses it."
    - "Why two official/university pages rank at all for a commercial query - unknown whether that signals unmet demand for neutral, non-vendor phrasing or is just an artefact of this US-only search proxy."
