synthesis:
  pieced_together_answer: "The cluster's answer is split three ways and no fetched page holds more than one part. (a) What integrations exist - only partial, hand-picked lists were retrievable (livesession.io: 11 apps in 6 categories; cloudtalk.io: 10 apps), both on vendor blogs that lead with their own product; the authoritative catalogue lives on zapier.com/apps, which ranked 5th-7th on 'list of zapier integrations' in the input file but fell outside the selection rule and was not fetched. (b) How to build an integration against your own API - docs.zapier.com gives the official concept-by-concept path (auth, triggers, actions, testing, versions, public vs private). (c) What it actually looks like against a real API - only vendor-specific walkthroughs (help.dealmaker.tech, commonroom.io), each tied to one product's tokens and endpoints. The head term 'zapier excel integration' was not answered by any fetched page: no page fetched named Excel or Office 365."
  single_destination_would_need: "A searchable, current app-pair index (does app X connect to app Y, on which trigger/action, on which Zapier plan, and what breaks) joined to a per-pair setup walkthrough and to a build path for apps with no existing connector. Concretely it would need: live coverage of the catalogue the pages size at 7,000-9,000 apps rather than a ten-item editorial pick; per-pair trigger/action detail; plan and cost implications, since commonroom.io warns the Zapier route is 'a costly experience'; and an escape hatch to the developer-platform route when no connector exists."
  existing_tools_that_do_this: "None found among the fetched pages. The only non-article result selected was a Fiverr gig listing (fetch failed), which sells human labour rather than an answer. Zapier's own app directory (zapier.com/apps) appears in the input file's SERP but was outside the selection rule and unverified here."
  data_source_and_reproducibility: "inference: the connector catalogue itself is public and machine-readable in principle (Zapier's public app directory plus each vendor's own integration docs, e.g. the Common Room and DealMaker pages fetched here), so a third-party index of app pairs and their triggers/actions looks reproducible; what is not reproducible is anything behind a Zapier account, and the editorial rankings are opinion rather than data. Practical obstacle observed in this task: 3 of 8 selected pages (help.followupboss.com, help.letsdeel.com, fiverr.com) returned HTTP 403 to an automated fetch, so bulk scraping of vendor help centres is likely to be blocked."
  ai_resilience: "inference: low for the conceptual half of the cluster - 'what is zapier integration', 'how does a Zap work' and 'name some popular integrations' are answered as well by a chat assistant as by the editorial pages fetched. Resilience is higher for the volatile half: whether a specific app pair is supported today, on which plan, and with which triggers, is a live fact that an assistant would answer from stale memory, and it is exactly the half none of the fetched pages covers."
  open_questions:
    - "zapier.com's own pages (developer-platform, homepage, /apps) held ranks 5, 6 and 7 on 'list of zapier integrations' and rank 6 on the tutorial query - 4 of 18 results - but were categorised editorial in the input file and fell outside the selection rule; whether zapier.com/apps already is the single destination is unverified"
    - "the head term is 'zapier excel integration' yet neither checked query mentions Excel or Office, and no fetched page named Excel; whether the Excel/Office 365 side of the cluster is equally fragmented is untested"
    - "three vendor pages returned 403, so their monetisation, currency and coverage are unknown; a browser-based check could confirm whether they are richer than the SERP titles suggest"
    - "commonroom.io states the Zapier route is 'a costly experience' - whether per-task Zapier pricing is a recurring complaint across the cluster is unknown from the fetched pages"
    - "the community result (medium.com, rank 3) and four further editorial results were not fetched under the 8-site rule, so first-person accounts of building an integration are unobserved"
