synthesis:
  pieced_together_answer: "No fetched page answers the cluster as posed, partly because the cluster is two different games under one name. Disambiguation is on nobody - the searcher must work out whether they mean Marvel Rivals or Roblox RIVALS before any page helps. Marvel Rivals PC graphics with measured performance data is on pcgamesn.com; the performance-first options rationale is on prosettings.net; Windows and GPU-level FPS work plus controller settings is on scufgaming.com. For Roblox RIVALS, a copyable value list is on robloxden.com, multi-device coverage (desktop, phone, tablet, Xbox, PS5) is on pixeltwelve.com, and the only per-player calibration method is on rivals.wiki. Sensitivity is the gap every page admits to - robloxden says it is \"purely based on your comfort, desk setup, and mouse\", rivals.wiki says \"There is no universal best sensitivity\". Nothing fetched offers a settings code, per-hero settings, or a way to verify that the applied settings worked."
  single_destination_would_need: "First, a game disambiguation step (Marvel Rivals vs Roblox RIVALS) before any values are shown. Then: device- and platform-branched settings (PC, PS5, Xbox, iPad/mobile, controller) rather than a PC-only table; a version stamp tied to the current patch or update number, since members ask for 'update 17' and 'new update'; a sensitivity output derived from the player's own input (mouse DPI, monitor, stick or touch) instead of a fixed number; an exportable or pasteable config for the games that support an import box, which pixeltwelve.com states its values are not; and an after-the-fact check so a player can tell whether the change worked. Every fetched page stops at 'now go type these in by hand'."
  existing_tools_that_do_this: "none found in the checked results. The input file records \"tool_hits\": 0 for this cluster and categorises zero results as tool, vendor or official. All six pages that fetched successfully are static articles; even prosettings.net, whose brand implies a pro-settings database, served a static guide with no database or calculator on this URL. Two candidates were outside the selection rule and were not fetched: rivalwiki.com/settings (rank 4, categorised reference) and esportsinsider.com (rank 6, unclassified)."
  data_source_and_reproducibility: "inference: the underlying data is fully reproducible from public sources - every recommended value is readable from the games' own settings menus by anyone who owns them, and the games are free to play. The two inputs that are not free to copy are first-party FPS benchmarks on named hardware (pcgamesn.com is the only fetched page showing measured performance data) and owning the five device types pixeltwelve.com claims to cover. There is no licensed or proprietary dataset anywhere in this cluster, so the barrier to entry is editorial upkeep per patch, not data access."
  ai_resilience: "inference: low to moderate. The dominant artifact is a list of menu values with a short rationale, which is close to the ideal shape for a chat answer, and several pages concede there is no universal correct value anyway. Three things resist an assistant: currency against the live patch (scufgaming.com carries April 2026 and pixeltwelve.com September 2026 dates precisely because the values drift), measured hardware benchmarks, and the risk of fabricating a settings code that does not exist - pixeltwelve.com had to explicitly correct that expectation. A tool that read the player's device and current game version, rather than recited values, would be materially harder to replace than any of these pages."
