    - "What share of this cluster's 35 members means Marvel Rivals versus Roblox RIVALS? The sample members contain both explicitly, and the split determines whether this is one opportunity or two."
    - "Whether the TikTok topic feed and ggwtb.com contain tool-like functionality is unknown - both fetches failed (empty feed, HTTP 403)."
