synthesis:
  pieced_together_answer: "No fetched page covers more than one slice. Species shortlisting sits on kaytee.com (six named species) and, contested, in the Instagram comment thread ('Conures ARE NOT for Beginners'). Handling technique sits on petmd.com and chewy.com, which agree on the same rule ('the only areas you should pet your bird' - head and neck) and on zupreem.com as a five-step procedure. Health and zoonosis risk sits on cdc.gov. Supplies sit on the two brand sites, attached to their own products. Cost, local availability, and legality appear on none of the pages fetched, although the cluster's member queries repeatedly ask for price ('pet bird cost', 'pet birds price in india') and the input records four 'calculate' intents."
  single_destination_would_need: "A species-matching decision tool that takes the household's constraints (noise tolerance, hours away, children, space, budget, country) and returns a ranked species shortlist with a total cost of ownership - purchase price, cage, food, and avian vet - plus a first-90-days handling and taming plan and a local avian-vet and rescue lookup. It would have to reconcile the disagreement the Instagram thread shows between marketing shortlists and owner experience, and cover the non-US demand visible in the member queries."
  existing_tools_that_do_this: "None found in the checked results - the input file records tool_hits 0 and vendor_share 0.0, and every page fetched was an article, a brand care page, a government advisory or a social post; no quiz, selector, cost calculator or database was found. Member queries explicitly ask for artefacts that do not appear ('pet bird checklist', 'pet bird template', 'random pet bird generator')."
  data_source_and_reproducibility: "inference: highly reproducible. The core dataset is a species table - size, lifespan, noise, talking ability, handling tolerance, space and cost - and the fetched pages already expose fragments of it (kaytee.com states 'Finches have a short 5-year lifespan'). Avian-vet and zoonosis guidance is public-domain government material (cdc.gov). The two genuinely non-reproducible assets are the named-DVM review on petmd.com and the owner community whose dissent appears in the Instagram comments; price and local availability would require ongoing first-party collection, and no fetched page supplies them."
  ai_resilience: "inference: low for the informational half, higher for the situated half. 'Where do I pet a bird' and 'which species suits a beginner' are stable, low-stakes explainers that a chat assistant answers at least as well as any page fetched, and better where the user's constraints matter. What survives is anything requiring live local data (breeder and rescue availability, current prices, an avian vet nearby), anything requiring trust signatures (vet-reviewed, CDC), and the community dissent that tells a buyer which published shortlist is wrong."
  open_questions:
    - "The CDFA PDF is one of the two official results and could not be parsed; whether it contains a structured care or disease reference is unknown."
    - "The Fishlore thread returned 403 twice, so the community half of this SERP - which the Instagram comments suggest disagrees with the brand pages - is only partially evidenced."
    - "Many member queries are India-specific ('pet birds price in india', 'best pet birds for home in india') but the checked results are US sites; whether a separate competitor set serves that market is unknown, since the evidence basis is a US-only search tool."
    - "Cost appears in the member queries but on none of the pages fetched; where users currently get price data is unknown."
    - "Several member queries are off-intent ('what do pet birds do in minecraft'); how much of the cluster's volume is genuine pet-ownership demand is unknown."
