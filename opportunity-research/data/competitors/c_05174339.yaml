synthesis:
  pieced_together_answer: "No fetched page answers the cluster end to end. The platform rules and file requirements live on kdp.amazon.com ('Download and install Kindle Create.', the 6x9 default, 'convert your interior manuscript file to a PDF'). The claim that publishing is free lives on the third-party blogs ('Signing up and uploading a book to Amazon KDP costs nothing' - BookBeam; 'publishing a book on Amazon through their Kindle Direct Publishing program is free' - Reedsy). The actual fee mechanics live on Reedsy ('$0.15 per megabyte on each ebook sold'; '$1.00 [fixed cost] + (300 x $0.012) [per page cost] = $4.60'). Price ranges for the work the author must outsource live on BookBeam ('Proofreading: $200 to $500'), ZonGuru ('$2.50 and $5 for a page') and their summary tables. Royalty context lives on Wikipedia ('Amazon keeps 65% of the revenue'). Someone to do the formatting instead of the author lives on dribbble.com. A reader wanting one number for their own book must visit at least three of these and do the arithmetic themselves."
  single_destination_would_need: "One page that takes the book's inputs - trim size, page count, ink and paper, target marketplaces, file size, list price - and returns the printing cost, delivery fee, royalty at 35% and 70%, and break-even price, with each fee traced to a dated Amazon source; then, in the same place, a manuscript checker that ingests the author's DOCX or PDF and reports the specific margin, bleed, trim and embedded-font problems that would fail KDP review, and emits a compliant file. The cost side and the file side are currently on different sites, and neither side is interactive anywhere in the checked results."
  existing_tools_that_do_this: "None found in the checked results does both. Partial tools named on the fetched pages: Kindle Create (Amazon's own formatting app, requires download and install), BookBeam's 'free tools' and Chrome extension, ZonGuru's subscription toolkit ('starts from $24/month'), Reedsy Studio plus the Reedsy freelancer marketplace, and a freelance formatting service on Dribbble. No interactive KDP cost calculator appeared in the 18 checked results, despite 'kdp publishing price calculator' being a cluster member."
  data_source_and_reproducibility: "The load-bearing numbers - print cost formula, per-megabyte delivery fee, royalty tiers, trim sizes, margin and bleed specs - are published by Amazon and are already being restated verbatim by every third-party page checked, so the data is fully reproducible from public sources; the cost is keeping it current per marketplace, which is exactly where the fetched pages are weak (kdp.amazon.com showed no date at all, BookBeam showed none, Wikipedia's figures are dated 2009-2019). Service price ranges are self-reported market estimates and cannot be verified from the pages."
  ai_resilience: "Low to moderate for the explanatory half: a chat assistant states the formula, computes the example and lists the cost ranges at least as well as these articles, and the Wikipedia and blog layers are largely displaced. Resilience comes from the two things an assistant cannot do from the chat window - inspecting the author's actual manuscript file against KDP's review rules, and guaranteeing a dated, per-marketplace fee table that is correct today. A destination built on file validation plus current fee data is defensible; one built on restating the formula is not."
  open_questions:
    - "Whether Amazon's printing-cost and delivery-fee tables differ enough by marketplace to make the India and Nigeria queries in this cluster a distinct, unserved need - the fetched pages state only that rates vary by country without giving them."
    - "What the two unreadable pages (Quora 403, BookBaby empty) contain, and whether the community answer on Quora is where the real per-title numbers are being traded."
    - "How often KDP changes the fee tables and specs, which determines whether a cached calculator can stay correct - unknown, since the KDP help page carries no date."
    - "Whether the KDP manuscript review failure modes are documented publicly in enough detail to build a pre-flight checker, or whether they can only be learned by submitting and failing."
    - "Whether searchers for 'how to format' want instructions or want the job done for them - the presence of a freelance formatting portfolio at rank 9 suggests some demand for the latter, but volume is unknown."
