synthesis:
  pieced_together_answer: "The generic numbers - H.264 in MP4, AAC audio, 1080p/4K frame sizes, a bitrate band - are repeated on every fetched page (adobe.com, help.pic-time.com, sfxengine.com, pixflow.net, animotica.com, makeuseof.com), so that part is commodity. Everything version- and editor-specific is split: Premiere click paths on adobe.com, pixflow.net and makeuseof.com; DaVinci Resolve on alliandwill.com; Final Cut Pro only inside sfxengine.com's three-editor guide; the H.264-versus-H.265 decision on pixflow.net; wider codec and surround-audio detail on help.pic-time.com; Shorts/vertical specs only on sfxengine.com and pixflow.net. Currency is scattered across 2021 (makeuseof.com), 2023 (animotica.com), 2026 (sfxengine.com, pixflow.net, help.pic-time.com) and no date at all (adobe.com), which is itself a reason to read several pages. The cluster's fix- and speed-shaped members (\"export settings youtube not working\", \"why is export settings youtube slow\") are not answered by any fetched page; the only results pointed at them are forum threads, and the Blackmagic thread returned 403."
  single_destination_would_need: "One place that takes the editor and its version, the delivery target (long-form, Shorts, 4K60), and the source clip's resolution, frame rate, length and colour space, then returns the exact field-by-field values for that editor's export dialog, a computed bitrate rather than a band, a downloadable preset file, an explanation of what YouTube re-encodes after upload and why processing looks soft or slow at first, and a symptom-driven path for exports that fail, stall or produce oversized files - all visibly dated and tied to a named editor build."
  existing_tools_that_do_this: "None found in the checked results. The input file records tool_hits: 0 for this cluster, and all seven fetched pages were articles, vendor guides or help-centre documents; no calculator, preset generator or settings database appeared."
  data_source_and_reproducibility: "inference: fully reproducible from public sources - the recommended values restate YouTube's published upload encoding guidance (help.pic-time.com and animotica.com both point back at it), and the per-editor field names and menu paths are observable in the shipping editors, including Resolve's free Windows version named on alliandwill.com. The recurring cost is maintenance: screenshots and menu paths have to be re-verified per editor release, which is precisely where the fetched pages decay (makeuseof.com 2021, animotica.com 2023, adobe.com undated)."
  ai_resilience: "inference: low for the head question. A chat assistant already answers \"what codec, container and bitrate for YouTube\" as well as these pages do, and does it without ads. Resilience only appears where the answer depends on state the assistant does not have - the user's actual project and source footage, the exact dialog of the installed editor version, a downloadable preset artifact, and diagnosis of an export that failed or an upload that looks wrong, which needs logs or the file itself."
  open_questions:
    - "Unknown: search volume, traffic or revenue for any of these sites, and whether this cluster's traffic is shifting to assistants - no fetched page states any such figure."
    - "The fix/slow subset of the cluster (the input file records organic_problem_members: 4 of 21 members) had no fetchable destination; whether real demand sits behind \"export settings youtube not working\" and \"why is export settings youtube slow\" is unresolved."
    - "forum.blackmagicdesign.com blocks automated fetching with 403, so both its content and whether Resolve users' troubleshooting is well served there remain unknown."
    - "Whether a downloadable preset or a bitrate calculator would be used, or whether creators simply want a dated table, is untested."
    - "Whether editors' export dialogs change often enough to make per-version maintenance a real moat or merely a cost is unknown from these pages."
