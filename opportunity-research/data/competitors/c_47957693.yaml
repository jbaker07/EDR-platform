synthesis:
  pieced_together_answer: "The answer is split across at least four page types. Timing by species sits on libguides.nybg.org (tables by pruning time, scoped to 'Zone 6 and higher') and, for one region only, on swansonsnursery.com ('Here in the Maritime Northwest...'). The decision rule that makes timing portable ('When does it bloom? Then prune it within a month or two after it finishes blooming') sits on swansonsnursery.com. Tool categories and cut-diameter thresholds sit on gardendesign.com ('Best for: Cutting branches up to 1/2 inch in diameter'). Specific products to buy sit on affiliate roundups such as gardeningknowhow.com ('I tested six of the most popular pruners available'). southernlivingplants.com only routes to seasonal sub-articles. Nothing fetched combines plant identity, the user's climate, the current date, technique and tool into one place."
  single_destination_would_need: "A plant-keyed pruning planner - the user enters their plants (or identifies them from a photo) and their location, and gets a dated task list for the year, each task naming the cut to make, how much to remove, and which tool handles that branch diameter, with a warning for plants where mistiming costs the next season's flowers. It would need to generalise past the two regional anchors found here (Zone 6+, Maritime Northwest) and to cover the unnamed-plant case that nybg.org explicitly defers ('It's important to get to know your shrubs.')."
  existing_tools_that_do_this: "None found in the checked results - the input file records tool_hits 0 and vendor_share 0.0 for this cluster, and every page fetched was an article, a library guide or a blog calendar; no calculator, database or interactive scheduler was found."
  data_source_and_reproducibility: "inference: highly reproducible. The core dataset is a species-to-pruning-window mapping derived from bloom wood (old vs new), which is public extension-service and botanic-garden horticulture - nybg.org publishes it as plain tables and swansonsnursery.com as a seasonal list. Climate adjustment would need a public frost-date/hardiness-zone source. The only non-reproducible material found was first-party product testing on gardeningknowhow.com, which is a commerce layer rather than the core data."
  ai_resilience: "inference: weak for the explainer half, moderate for the planner half. Tool taxonomy (gardendesign.com) and single-plant timing questions are fully answerable by a chat assistant. What resists substitution is the stateful part - a persistent list of the user's own plants, a calendar that fires at the right week for their location, and photo identification of a shrub the owner cannot name. A product-purchase layer also resists, since assistants cannot supply live prices or a tested ranking."
  open_questions:
    - "What does the Camden council PDF (the only official result) actually contain? The fetch returned 503 twice, so its role in this SERP is unknown."
    - "Homes & Gardens is the cluster's dominant site (2 of 18 checked results) but never returned page text; its actual depth and business model are unverified."
    - "Do any of the unfetched pages (garden.org, gardenersworld.com, almanac.com) provide the plant-by-plant, region-aware schedule that the fetched pages lack?"
    - "The cluster label mentions tomatoes and many member queries are tomato-specific, but neither checked query surfaced tomato pruning; whether a separate set of competitors owns that sub-intent is unknown."
    - "No page fetched stated any traffic, revenue or audience figure, so the commercial size of the affiliate tool-roundup segment is unknown."
