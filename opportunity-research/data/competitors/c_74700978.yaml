synthesis:
  pieced_together_answer: "Three separate needs sit behind one head term and no fetched page serves more than one. (1) What the code means: the fullest coverage is a $0.99 iOS app claiming \"more than 18546 error descriptions for almost 50 car manufacturers\", and the freest is a GitHub CSV of \"3071 lines\" with no search interface; the two top-ranked editorial results for \"obd2 codes list\" are not lists at all - calamp.com names four codes and autopi.io eleven. (2) How to get the code out of the car: autopi.io explains the format but ties the procedure to its own EUR 599 / EUR 129-plus-EUR 6-a-month hardware; greatwater360autocare.com says \"you'll need a code reader\"; carhop.com openly hands the reader onward to \"refer to the manufacturer-specific code list or use an online database\". (3) What to actually do about it: nobody. Every fetched page stops at the definition and routes to a mechanic, a demo, or an appointment. The cluster's own member queries show the same seam - \"obd2 codes meaning\" sits next to \"fix obd2 codes\" and \"how to clear obd2 codes\"."
  single_destination_would_need: "It would have to run the chain the searcher is actually on: read the code (or accept one typed in), resolve it against a table that covers manufacturer-specific ranges and not just the generic P0 set, then narrow it for the specific year/make/model, rank likely causes with a stated basis, indicate severity - is it safe to drive, must it be fixed before an emissions test - give the diagnostic sequence to confirm which cause it is, estimate parts and labour, and say when the code can be cleared and what happens if it returns. Of those steps, the fetched pages collectively deliver only the second. A single destination also needs to be free and instantly readable, since the cluster's members are saturated with \"free\", \"pdf\", \"download\" phrasing, and it needs a visible update date, which four of the six successfully fetched pages do not have."
  existing_tools_that_do_this: "In the checked results the input file records \"tool_hits\": 0, and of the eight sites selected here only two are data assets rather than articles - the \"Obd2 Codes List\" iOS app at $0.99 (install required, \"No Internet connection needed\") and the mytrile/obd-trouble-codes CSV on GitHub (free, no interface). Note that four lookup-style destinations appear in the cluster's results but were not selected by the sampling rule because they are categorised unclassified: klavkarr.com, edmunds.com, innova.com and repairpal.com; they were not fetched and nothing is claimed about them here."
  data_source_and_reproducibility: "The generic layer is demonstrably reproducible: a public GitHub repository holds \"3071 lines (3071 loc) · 164 KB\" of code-to-description rows, downloadable with no account and no stated license, and the same standardised definitions recur verbatim across every page fetched. The scarce layer is manufacturer-specific - the iOS app claims \"more than 13500 additional manufacturer specific codes\" against \"almost 5000 generic OBDII codes\", so roughly three-quarters of its value is the non-generic tier, which is compiled from service literature rather than a single download. Beyond definitions, the genuinely unavailable dataset is empirical: which cause actually fixed which code on which vehicle. No fetched page publishes that."
  ai_resilience: "inference: low for definitions, high for the diagnostic step. Reciting what P0420 or P0300 means is the most AI-replaceable content in all three clusters - carhop.com literally tells readers to go find a database elsewhere, which is the substitution an assistant performs. What resists is anything needing vehicle-specific grounding and real outcomes: which of five plausible causes is likely on a 2014 model with this mileage, what the confirming test is, and what it costs. An assistant that answers confidently but wrongly here sends someone to buy the wrong part, so verified, vehicle-scoped data retains value that a generic table does not."
