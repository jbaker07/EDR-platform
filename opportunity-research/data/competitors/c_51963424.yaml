synthesis:
  pieced_together_answer: "This cluster is really two unrelated jobs, and the checked queries land on different sites for each. For applying stain to a door, the procedure is duplicated across four manufacturer and retailer blogs (rustica.com, realcraft.com, zar.com, krosswood.com) that each hold one missing piece: rustica.com supplies the finish-system framing and the dry-to-touch warning, realcraft.com supplies a photographed worked example with a 24-hour between-sides wait but only for one wood and one product, zar.com supplies the only concrete cure times and the broadest coverage of stain types, and krosswood.com supplies the pre-stain conditioner rule for pine and fir while deferring drying times back to the product label. Not one of the six fetched pages states how much stain a door needs, and none gives a method for choosing a colour for a given species. For removing stains, the checked query \"ways to remove oil stains best\" returns laundry content (grove.co, whirlpool.com) and a carpet/fabric flipbook (issuu.com) - none of which mentions wood at all - and the one vendor-category result is a patent for staining fiberglass doors. The cluster's own wood-stain-removal members (\"best stain remover for wood\", \"how to remove old stain\", \"wood stain remover not working\") are served by none of the pages fetched."
  single_destination_would_need: "One destination would have to (a) disambiguate at the door: applying stain versus stripping old stain versus removing a spill stain from wood versus removing an oil stain from fabric - the checked queries show searchers in all four buckets landing on the same results; (b) compute quantity from door or deck dimensions and the product's stated coverage rate, which no fetched page does and which several cluster members ask for directly (\"how much wood stain for a door\", \"how much wood stain for a deck\", \"wood deck stain calculator\"); (c) branch on wood species, telling the user whether their wood needs a conditioner and how a given colour reads on it, with visual evidence - realcraft.com shows this is possible but only for one species; (d) give the real timeline - recoat, cure, rehang, weather exposure - in one place instead of deferring to a label as krosswood.com does; and (e) for removal, branch by finish type and stain type on wood, which is absent from every page fetched."
  existing_tools_that_do_this: "none found in the checked results - the cluster's fragmentation record reports tool_hits 0, and all eight selected results were blog articles, a patent document or a hosted flipbook. In particular no stain quantity calculator appeared, despite \"wood deck stain calculator\" being an explicit cluster member and 7 calculate-intent members in the cluster."
  data_source_and_reproducibility: "inference: the procedural content is commodity and fully reproducible - four fetched pages describe the same sequence. Two genuine data assets are visible but unbuilt in the checked results: (1) coverage rate and cure/recoat times per product, which exist on manufacturers' public technical data sheets and labels and could be compiled across brands - zar.com shows one brand's version of this, and krosswood.com's deferral to the label shows the gap; and (2) how a given stain colour reads on a given species, which realcraft.com demonstrates photographically for sapele mahogany but which would have to be produced, not scraped, since it requires physical samples. Neither is protected by anything but the work of assembling it."
  ai_resilience: "inference: low for the how-to layer - four of six readable pages are near-identical procedures, which is the strongest available evidence that this content is commodity and an assistant can generate it while also adapting to the user's wood and product. Resilience is higher for three things: product-specific cure times and coverage rates, which an assistant should not invent and which zar.com and krosswood.com both point to as label data; visual colour-on-species evidence, which is photographic; and a quantity calculation tied to real measurements and a real product's coverage rate, which is a computation over data rather than a recall task."
  open_questions:
    - "Two of eight selected pages failed with HTTP 503 (patents.google.com, whirlpool.com), so the vendor-category coverage in this cluster is thin; a second pass is needed to confirm whether Google Patents offers anything of use to a homeowner here, which on the title alone looks unlikely."
    - "The cluster label is \"stain wood apply furniture\" and the head term is \"wood stain remover\", but neither checked query targets removal from wood. The removal half of the cluster - members such as \"best stain remover for wood\", \"how to remove old stain\", \"wood stain remover not working\", \"fix wood water stain\" - has no competitor evidence at all in this pass and should be its own SERP check."
    - "\"wood deck stain calculator\" is an explicit cluster member and decks appear repeatedly in the member list, but the checked query was about doors, so deck-specific competition and any existing deck stain calculators are unexamined."
    - "It is unknown from the fetched pages what coverage rates manufacturers publish and whether they are consistent enough across brands to power a quantity calculator; this needs a direct check of technical data sheets rather than blog pages."
    - "The tie-break between krosswood.com and tomsguide.com (both rank 6, on different checked queries) was resolved in favour of the first-listed query, so tomsguide.com was not fetched; its laundry-side coverage is unassessed."
    - "No page fetched states traffic, users, revenue or market share, so the relative strength of these manufacturer and retailer blogs is unmeasured; dominates_serp is 1 of 18 for every site here, which is the most fragmented of the three clusters analysed."
