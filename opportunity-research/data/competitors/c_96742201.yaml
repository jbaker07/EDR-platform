synthesis:
  pieced_together_answer: "The pieces sit on different sites and in different formats. Conceptual setup - camera, lights, render node, IPR preview, 'If you don't have lights in the scene the render will come out black.' - is on sidefx.com, pinned to 'Houdini 22.0' and written for Mantra. Speed tuning with actual menu paths ('Rendering > Mantra > Sampling steps', 'Set Your Cache Limit') is on vagon.io, last updated December 2023 and ending in a pitch for cloud machines. Renderer-specific settings for Arnold and RenderMan are supposedly on help.autodesk.com and rmanwiki-26.pixar.com, but the first returned a 404 and the second returned an unrendered index. The demonstrations users evidently prefer are on YouTube - five of the twenty checked results - and could not be read. Paid one-off import assets sit on three separate Gumroad seller subdomains. The one community thread that loaded answers a different question than it ranked for. A user therefore assembles concept from the docs, current settings from a blog, and the actual click path from video."
  single_destination_would_need: "A goal-indexed, version-aware reference that starts from what the user is trying to produce - a still, a sequence, a fire sim, hair, an imported FBX character with its animation intact - and gives the node path, the parameter values and the current-version screenshot for the renderer they actually use (Karma and Karma XPU first, since that is what the cluster asks for, then Arnold, Redshift, RenderMan), together with a diagnostic path for the common failure states (black frame, missing skeleton on FBX import, sequence rendering only one frame). It would also have to state which Houdini version each instruction was verified against, because the vendor docs are version-pinned and the blog advice is not dated to a version at all."
  existing_tools_that_do_this: "None found in the checked results. There is no calculator, database or interactive settings tool anywhere in the twenty checked results - the input file records tool_hits of 0. The closest things to tooling are paid Houdini Digital Assets sold on Gumroad seller subdomains (an Alembic quick-import HDA, and two further Gumroad listings not fetched) and Vagon's cloud-rendering service, which changes where the render runs rather than what the settings should be."
  data_source_and_reproducibility: "The underlying facts are the behaviour of proprietary software - Houdini and its render engines - so nothing here can be rebuilt from an open dataset; it can only be re-derived by running the software and recording what each parameter does, version by version. That makes the content expensive to produce but also means the vendor is not the only possible source: the docs page carries no date, the third-party pages carry dates but no version label, and the version-to-behaviour mapping that users actually need is not published as data anywhere in the checked results."
  ai_resilience: "Moderate. A chat assistant handles the conceptual questions - what a render node is, why a frame is black, what sampling trades against - at least as well as these pages. It is weaker exactly where this cluster hurts: naming the parameter in the version the user has installed, and showing where it is on screen, which is why five of twenty checked results are video. An assistant also cannot deliver a working HDA. A destination built on verified, version-stamped parameter paths plus failure diagnosis is resilient; one built on explaining rendering concepts is not."
  open_questions:
    - "Whether the Karma and Karma XPU settings the cluster keeps asking about are documented anywhere that ranks - the top-ranked vendor page fetched covers Mantra, and the one Karma video could not be read."
    - "What is actually inside the three Gumroad listings (two of which failed to load) and whether paid assets are substituting for missing free documentation on FBX and Alembic import."
    - "Why a 404 page holds rank 2 for 'how to render in houdini' - whether the Autodesk documentation moved or the search proxy's index is stale."
    - "How often Houdini version changes invalidate published instructions, which determines whether a version-stamped reference could be maintained at reasonable cost."
    - "What the FBX-import failure modes actually are in practice (skeletons, animation, materials, scale), since no fetched page that loaded addressed FBX import at all."
