synthesis:
  pieced_together_answer: "No fetched page answers the cluster end to end, and the pieces are split by function. The narrative explanation of what changed and how to start sits on Wargamer, which is also the most recently updated fetched page and the one that states the full rules are downloadable. The running change tracker, including detachment counts, stratagem and terrain changes and whether an existing codex is still valid, sits on Spikey Bits, but mixed with rumour. The transactional part - build a legal army under the new detachment-points system - sits only on GrimSlate, which validates budgets and slot limits live but sends readers elsewhere for the rules and current points. Opinion on whether the changes are good sits on the retailer blog, written before release. The community thread, the one place a beginner asks what do I actually need, is a year stale and names the wrong current edition. The two pages that could not be fetched (Bell of Lost Souls, and Tabletop Battles which is the cluster's dominant site at 4 of 18 results) leave a real hole in this picture."
  single_destination_would_need: "A maintained, dated, per-rule reference rather than an article: a 10th-versus-11th diff a reader can search by rule name, a per-faction status row saying whether that faction has an 11th edition codex or is still using 10th edition rules, current points with a change date, the mission and terrain rules a game actually needs, a clear confirmed-versus-rumoured flag on everything, and a list builder that validates against those same numbers. Every one of those parts exists somewhere in the checked results; nothing holds two of them except GrimSlate, which holds the builder and the explanation but not the rules."
  existing_tools_that_do_this: "GrimSlate - a free web roster builder that validates detachment-point budgets, unique-tag conflicts and leader/support slots while building (verified on its own page). Two further tools are referenced by the fetched pages but were not fetched and are therefore unverified here: the publisher's official Warhammer 40,000 app, described by Spikey Bits as free and used for list building and points, and the online field manual GrimSlate points to for current points. The input file records tool_hits 1 across the 18 checked results."
  data_source_and_reproducibility: "inference: the underlying facts are public but the rights are not. Core rules are published free by the game's publisher (two fetched pages say so), points are published digitally and change, and release dates and previews are announcements anyone can track - so a diff-and-status dataset is rebuildable by a diligent maintainer. Two constraints bite: reproducing rules or points text verbatim is a copyright exposure against a litigious rights holder, and the data decays continuously, so the cost is ongoing maintenance rather than one-off collection. GrimSlate's existence shows the build is feasible; its silence on funding leaves the economics unknown."
  ai_resilience: "inference: this is the most AI-resistant of the three clusters, for two reasons visible in the evidence. First, currency - the edition post-dates any fixed training cutoff, and the failure mode is concrete: the fetched community thread confidently states the current edition is 10th. Second, arithmetic against live data - validating a roster against detachment-point budgets and slot limits is not something a chat assistant does reliably without the current numbers. An assistant with live retrieval would handle the explanatory half well; the tracking and validation half needs maintained data."
  open_questions:
    - "Tabletop Battles could not be fetched yet supplies 4 of 18 checked results, and Bell of Lost Souls supplies 2 - together a third of the cluster is unassessed, so the competitive picture may be materially different from what is described here."
    - "Whether the publisher's own free app and community site already deliver the rules, points and list-building functions well enough to make a third-party destination redundant; the fetched pages describe the app only in passing."
    - "How much of the rules and points data can legally be restated by a third party, and whether GrimSlate's approach has been tested."
    - "Whether the edition is fully released at the analyst date - the fetched pages span pre-release commentary (rulebook about eighty days away, dated March 2026) and post-release guidance (full rules now available, updated August 2026), so demand may be at a transient peak."
    - "How GrimSlate is funded and whether an account is required to use the builder - unknown from its page - which determines whether it is a durable competitor or a hobby project."
    - "Whether the cluster's audience is beginners (how to play), returning players (what changed), or competitive listbuilders - the member queries contain all three and they want different products."
