# Phase 1 taxonomy of human search/problem domains. Breadth over depth: the point is not to
# miss a category. Each subdomain carries seed terms for autocomplete expansion (Phase 2).
# Seeds are neutral nouns, not pre-judged "opportunities". Domains are ids; nothing here is a
# conclusion. Counts: see `python -m pipeline.cli taxonomy-stats` (or the README).
