# Curated site classes for SERP fragmentation analysis (authored 2026-09-21 from the sites that appeared
# in the pass-1 web-search results). A site not listed here falls back to URL-pattern rules, then to
# "unclassified" — never to "fragmented". Classes:
#   community   user-generated answers: forums, Q&A, video, social, code hosts
#   editorial   media/blog/listicle/tutorial publishers (piecing-together content, no tool)
#   aggregator  document/pin aggregators
#   reference   encyclopaedic reference
#   vendor      the product's own maker, docs, support, store (the vendor owns the answer)
#   tool        a third-party destination whose product is the answer (calculator, database, generator, planner, course)
#   official    government, health services, transit operators, standards bodies
#   marketplace retail and app stores
