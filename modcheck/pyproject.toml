[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "modcheck"
version = "0.1.0"
description = "Game-specific mod development and compatibility platform"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0", "jsonschema>=4.20"]

[project.optional-dependencies]
# BG3 .pak file lists are stored as an LZ4 block. Optional for the core: without
# it, BG3 package inspection reports the file list as NOT read and says how to
# install it -- it never reports an empty package. Pinned to the version the
# test suite exercises.
# python-lz4 is BSD 3-Clause ("License :: OSI Approved :: BSD License" in its
# published metadata); it wraps the upstream LZ4 library.
bg3 = ["lz4==4.4.4"]
dev = ["pytest>=8.0", "lz4==4.4.4"]

[project.scripts]
modcheck = "modcheck.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
