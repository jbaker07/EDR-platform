id: subscribe_event.redscript_wrap_method
game: cyberpunk2077
capability: subscribe_event
title: Extend a game method from redscript with @wrapMethod instead of replacing it
summary: A creator ends up with a .reds source file under r6/scripts/ that adds behaviour
  to an existing game method while leaving the original behaviour intact, so that
  several mods can modify the same method and still all work - which is not true of
  the replace annotation.
applies_to:
  game_versions: not established; redscript compiles against the scripts shipped with
    whatever build is installed, and the wiki does not pin a game version for the
    annotations
  loader: redscript
  loader_versions: any redscript version that supports the hook annotations; the wiki
    page does not state a minimum
  toolchain:
  - redscript
  platforms:
  - windows
  - macos
mechanism:
- kind: method
  id: <Class>.<Method>
  container: r6/scripts/<yourmod>/<yourmod>.reds
  signature: must match the name AND the parameters of the method being hooked
  label: The base-game method you are wrapping. Annotations cannot be applied to modded
    or native methods.
- kind: method
  id: wrappedMethod
  container: r6/scripts/<yourmod>/<yourmod>.reds
  label: The identifier that calls the next function in the wrap chain - the previous
    wrapper, or the original method if yours is first.
- kind: file_path
  id: r6/scripts/<yourmod>/<yourmod>.reds
  label: The install path your mod claims. Give it its own subfolder so it cannot
    collide with another mod's file.
recipes:
- redscript-wrap-method
references:
- source: cp_wiki_redscript_hook_annotations
  evidence_class: declared
  locator: '@wrapMethod(class)'
  quote: Furthermore, this annotation can be applied multiple times to chain multiple
    functions that modify the same method. Each function in the chain wraps around
    the previous one. This helps to keep mods compatible even if they alter the same
    methods.
- source: cp_wiki_redscript_hook_annotations
  evidence_class: declared
  locator: '@replaceMethod(class)'
  quote: You can only use one `@replaceMethod` for each method. If you define more
    than one, only one of them will work. If you want to combine multiple changes
    to the same method, you should use the `@wrapMethod` annotation instead.
- source: cp_wiki_redscript_hook_annotations
  evidence_class: declared
  locator: warning hint near the top of the page
  quote: Annotations **can't** be used on modded methods or classes and native functions
    (those are marked as native and defined outside of scripts).
- source: redscript_repo_readme
  evidence_class: declared
  locator: Installation > Windows
  quote: When you start the game, successful setup can be confirmed with logs appearing
    in `Cyberpunk 2077/r6/logs/redscript_rCURRENT.log`.
- source: redscript_repo_readme
  evidence_class: declared
  locator: header
  quote: REDscript is a statically-typed, object-oriented programming language designed
    for developing scripts for the REDengine, CD Projekt's game engine used in Cyberpunk
    2077.
evidence_state: documented
evidence_note: Derived from recipe redscript-wrap-method, which is the record that
  was actually verified. This capability record restates that recipe's extension points
  under the shared taxonomy; it adds no evidence of its own.
provenance:
  added: '2026-09-20'
  last_verified: '2026-09-20'
  verified_against:
  - redscript-wrap-method
requirements:
- The class and method you want to extend, with its exact name and parameter list
- The behaviour you want to add before or after the original
interactions:
- '@replaceMethod and @wrapMethod are compatible with each other: the wiki states
  replace "will always overwrite the original method and it will not affect the functions
  that wrap around it". So a replace by another mod does not remove your wrapper,
  but it does discard whatever the original method did.'
- 'A compile error anywhere in r6/scripts is a whole-tree failure, not a your-mod
  failure: every script mod goes through the same compiler at startup.'
- This is source-level composition and it is invisible to modcheck. Our inspector
  lists the .reds files an artifact ships; it does not parse them, so it cannot tell
  you that two mods wrap or replace the same method.
build:
  produces: One or more .reds source files; redscript compiles them in place at game
    startup.
  requires_network: false
  requires_game_install: true
validation:
- method: Confirm the packaged artifact ships its scripts under its own folder in
    r6/scripts and nothing else.
  command: .venv/bin/modcheck inspect dist/<yourmod>.zip --game cyberpunk2077 --json
  modcheck_check: modcheck.inspect.cyberpunk.inspect:redscript_files
  limits: Layout only. It lists .reds paths and will show you if you are about to
    ship a file directly in r6/scripts where collisions happen. It does NOT parse
    redscript, so it cannot see your annotations, cannot tell wrap from replace, and
    cannot detect that another mod targets the same method.
- method: Compile the scripts with the redscript CLI before shipping.
  command: redscript-cli compile -s r6/scripts
  limits: 'Not run here: redscript is a Rust CLI we did not obtain, and compiling
    needs the game''s own script sources as input, which ship inside the game install.
    Even a clean compile proves only that your code is well-formed against that build''s
    scripts - it does not prove the hook does what you intended, and it says nothing
    about the next game patch.'
- method: Read redscript's startup log after launching the game.
  command: type "Cyberpunk 2077\\r6\\logs\\redscript_rCURRENT.log"
  limits: Requires the retail game. Shows compilation success or failure, not behavioural
    correctness.
