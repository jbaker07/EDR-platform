    evidence_class: declared
    locator: "How do I use it?"
    quote: "By placing `.yaml` or `.tweak` files in Cyberpunk `2077/r6/tweaks`, or .xl files in `Cyberpunk 2077/archive/pc/mod`."
  - source: cp_wiki_tweakxl
