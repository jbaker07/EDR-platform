id: tweakxl-record-tweak
game: cyberpunk2077
title: Change an existing TweakDB record with a TweakXL YAML tweak
category: modify_data_record
intent: >-
  A creator ends up with a single text file, shipped under r6/tweaks/, that changes properties of an
  existing game database record - an item's stats, an NPC's archetype, a vendor's inventory - without
  touching or replacing any game resource file, and therefore without colliding on install with any
  other mod.
applies_to:
  game_versions: "TweakXL's README declares Cyberpunk 2077 2.3 at the revision we fetched; not verified against a game install"
  loader: tweakxl
  loader_versions: "TweakXL requiring RED4ext 1.28.0+ and redscript 0.5.27+, per its README at the revision fetched"
  toolchain:
    - tweakxl
  platforms:
    - windows
inputs:
  - The TweakDB record id you intend to change (for example a weapon's Items.* record)
  - The property names on that record and the values you want them to have
dependencies:
  - id: tweakxl
    kind: framework
    required: true
  - id: red4ext
    kind: loader
    versions: ">=1.28.0 per TweakXL's README at the revision fetched"
    required: true
  - id: redscript
    kind: framework
    versions: ">=0.5.27 per TweakXL's README at the revision fetched"
    required: true
extension_points:
  - kind: record
    id: "<TweakDB record id>"
    container: r6/tweaks/<yourmod>.yaml
    label: The TweakDB entry whose properties you are changing.
  - kind: field
    id: "<TweakDB record id>.<property>"
    container: r6/tweaks/<yourmod>.yaml
    field: "<property>"
    label: One property on that record. Setting it to None deletes the property.
  - kind: file_path
    id: r6/tweaks/<yourmod>.yaml
    label: >-
      The install path your mod claims. TweakXL reads every file here, so two mods can coexist in this
      folder - but only if they do not use the same filename.
steps:
  - step: Decide where the file goes
    detail: >-
      The wiki states the loader contract exactly: TweakXL is used "By placing `.yaml` or `.tweak` files
      in Cyberpunk `2077/r6/tweaks`, or .xl files in `Cyberpunk 2077/archive/pc/mod`". Pick r6/tweaks for
      a plain record tweak.
    file: r6/tweaks/<yourmod>.yaml
  - step: Give the file a name nobody else will use
    detail: >-
      The file name is the only thing separating your tweak file from another mod's. Prefix it with your
      handle or the mod name. A generic name such as weapons.yaml is how two unrelated mods end up
      overwriting each other at install time.
  - step: Write the tweak in YAML syntax
    detail: >-
      The wiki warns that the extension does not decide the syntax: "No matter the file extension, the
      file `contents` must be in `.yaml` or `.json` syntax." Key the document by the record id you are
      changing and list the properties you want to set underneath it. We did not retrieve TweakXL's own
      field-by-field syntax reference (it lives on a github.com wiki, which is HTTP 403 here), so write
      against TweakXL's documentation rather than against this recipe for the exact spelling of
      operations such as appending to an array.
    file: r6/tweaks/<yourmod>.yaml
  - step: Change only the properties you actually mean to change
    detail: >-
      Every property you restate is a property you are now competing for with every other tweak mod.
      Listing one property makes you conflict with mods that touch that one property; copying a whole
      record makes you conflict with all of them.
  - step: Delete a property by setting it to None, never by omitting it
    detail: >-
      The wiki is explicit: "If you want to **safely delete** a record property, set its value to
      **None**." Omitting a property leaves it at its previous value, which is not the same thing.
  - step: Ship the file at its install path
    detail: >-
      Package the mod so that extracting it into the Cyberpunk 2077 directory puts your file at
      r6/tweaks/<yourmod>.yaml and nothing else. Do not ship other mods' framework files with it.
interactions:
  - >-
    TweakDB is a database of static values, so two mods that set the same property on the same record
    conflict by definition. The wiki says so directly and adds that "There currently is no tool to check
    tweak conflicts" - including this one: modcheck lists your tweak files but does not parse them.
  - >-
    Choosing TweakXL over REDmod tweaks or CET is itself a compatibility decision. The wiki's advice is
    "If possible, you should stick to TweakXL for editing tweaks", and psiberx's quoted reasons include
    proper record creation and cloning and a hot reload that rolls back to the initial state instead of
    reapplying changes on top of the previous run.
  - >-
    This recipe changes data only. It cannot add behaviour; if you need behaviour, you need redscript or
    CET, and those have their own compatibility rules.
build:
  produces: A single YAML/tweak text file plus whatever archive shape you distribute it in.
  requires_network: false
  requires_game_install: true
validation:
  - method: Confirm the packaged artifact ships the tweak at the right install path and ships nothing else.
    command: .venv/bin/modcheck inspect dist/<yourmod>.zip --game cyberpunk2077 --json
    modcheck_check: modcheck.inspect.cyberpunk.inspect:tweak_files
    limits: >-
      This reads the archive layout only. It confirms the path is under r6/tweaks/ and lists the file; it
      does NOT open the file, does not check that it is valid YAML, does not know which TweakDB record it
      targets, and therefore cannot tell you whether another installed mod edits the same record.
  - method: Parse the file as YAML locally before shipping it.
    command: python -c "import sys,yaml;yaml.safe_load(open(sys.argv[1]))" r6/tweaks/<yourmod>.yaml
    limits: >-
      Establishes only that the bytes are well-formed YAML. It says nothing about whether the record id
      exists in TweakDB, whether the property names are real, or whether the values are of the right type -
      all three are only discoverable in a running game, which we do not have.
  - method: Read the framework log after a game launch.
    command: type "Cyberpunk 2077\\r6\\logs\\redscript_rCURRENT.log"
    limits: >-
      Requires the retail game, which we do not have. redscript's README names this log as where its own
      startup result appears; we did not retrieve documentation of TweakXL's log file, so treat the
      specific file name for TweakXL as unverified.
acceptance:
  - The packaged artifact contains exactly one file, at r6/tweaks/<yourmod>.yaml, under a name unique to this mod.
  - The file parses as YAML.
  - Every property in the file is one the mod intends to change; nothing was copied in wholesale.
  - Any property being removed is set to None rather than omitted.
  - The mod page states which TweakDB records it changes, because no tool can work that out for a player.
