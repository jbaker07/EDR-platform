    - cp_wiki_archive_load_order
    - cp_wiki_tweakxl
    - cp_wiki_archivexl
    - tweakxl_repo_readme
    - archivexl_repo_readme
    - redscript_repo_readme
    - wolvenkit_repo_license
    - cet_repo_readme
