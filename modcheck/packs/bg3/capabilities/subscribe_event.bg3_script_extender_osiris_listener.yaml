id: subscribe_event.bg3_script_extender_osiris_listener
game: bg3
capability: subscribe_event
title: React to an Osiris event from Lua with the BG3 Script Extender
summary: A creator ends up with a module that runs its own Lua on the server side
  and reacts to an Osiris game event - turn ended, status applied, and so on - without
  touching or overriding any game data file, so the mod adds behaviour instead of
  competing for ownership of a record.
applies_to:
  game_versions: not established; the extender pins itself to its own API version,
    not to a game version
  loader: bg3se
  loader_versions: the API document we fetched is 'BG3SE Lua API v30' and its example
    Config.json uses RequiredVersion 29
  toolchain:
  - bg3se
  platforms:
  - windows
  - linux
mechanism:
- kind: config_key
  id: RequiredVersion
  container: Mods/<YourMod>/ScriptExtender/Config.json
  field: RequiredVersion
  label: The extender version your mod is written against.
- kind: config_key
  id: ModTable
  container: Mods/<YourMod>/ScriptExtender/Config.json
  field: ModTable
  label: '"Name of the mod in the global mod table (`Mods`) when using Lua. This name
    is required to use Lua scripting, and must be unique." It is NOT the Folder value
    from meta.lsx.'
- kind: config_key
  id: FeatureFlags
  container: Mods/<YourMod>/ScriptExtender/Config.json
  field: FeatureFlags
  label: The feature list; ["Lua"] enables Lua scripting.
- kind: file_path
  id: Mods/<YourMod>/ScriptExtender/Lua/BootstrapServer.lua
  label: The server-side entry point the extender loads automatically.
- kind: event
  id: <Osiris call/event/database name>
  label: What you subscribe to via Ext.Osiris.RegisterListener, with its arity and
    before/after phase.
- kind: method
  id: Ext.Osiris.RegisterListener
  signature: (name, arity, event, handler)
  label: The subscription API itself.
recipes:
- bg3-script-extender-osiris-listener
