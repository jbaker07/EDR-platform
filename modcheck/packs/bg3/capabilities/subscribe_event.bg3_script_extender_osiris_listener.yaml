evidence_state: documented
evidence_note: Derived from recipe bg3-script-extender-osiris-listener, which is the
  record that was actually verified. This capability record restates that recipe's
  extension points under the shared taxonomy; it adds no evidence of its own.
provenance:
  added: '2026-09-20'
  last_verified: '2026-09-20'
  verified_against:
  - bg3-script-extender-osiris-listener
requirements:
- The Osiris call, event or database you want to listen to, and its arity
- A globally unique mod table name for your mod
interactions:
- Listeners are additive - several mods can listen to the same Osiris event - so this
  is the compatible way to change behaviour, in contrast to overriding a stats entry
  or a root template where only one mod can win.
- Events are synchronous. The documentation notes an Osiris event "is triggered synchronously,
  i.e. the function call returns when every Osiris rule that handles the event has
  finished", so slow handlers are felt by every other handler.
- Nothing in a shipped artifact reveals which events a mod listens to. modcheck can
  read the module's declared identity; it cannot read the .pak that contains the Lua,
  so cross-mod listener behaviour is outside what we can analyse.
- 'Using the extender changes the achievement situation: the community wiki states
  modding disables all achievements and that "They are automatically re-enabled when
  using Script Extender."'
build:
  produces: Config.json plus Lua scripts inside the module, packed into the mod's
    .pak.
  requires_network: false
  requires_game_install: true
validation:
- method: Validate Config.json as JSON before packing.
  command: python -m json.tool Mods/<YourMod>/ScriptExtender/Config.json
  limits: Well-formedness only. It does not check that ModTable is unique across the
    player's installed mods, that RequiredVersion matches an extender you actually
    tested against, or that FeatureFlags is minimal.
- method: Inspect the shipped artifact for its declared module identity.
  command: .venv/bin/modcheck inspect dist/<YourMod>.zip --game bg3 --json
  modcheck_check: modcheck.inspect.bg3.inspect:dependencies
  limits: Reads info.json or meta.lsx only. It cannot see Config.json or any Lua at
    all, because those live inside the .pak whose LZ4-compressed file list we do not
    read here. A clean inspection says nothing whatsoever about your scripts.
- method: Exercise the listener from the extender console in a running game.
  command: <in the SE console, select the server context and call the Osiris function
    your listener subscribes to>
  limits: Requires the retail game and the extender installed, neither of which exists
    here, so this was never run. The console "has full access to the underlying Lua
    state", which makes it the right place to test - but a console call proves the
    handler fires, not that it behaves correctly during real play.
