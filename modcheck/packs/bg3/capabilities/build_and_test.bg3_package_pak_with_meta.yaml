id: build_and_test.bg3_package_pak_with_meta
game: bg3
capability: build_and_test
title: Package a BG3 mod as a .pak with a correct meta.lsx identity
summary: A creator ends up with a single .pak whose meta.lsx declares a unique UUID,
  a Folder that matches the module's own folder, a name and an Int64 version - the
  four values every mod manager and the game itself use to tell this mod apart from
  every other one and to place it in the load order.
applies_to:
  game_versions: not established; meta.lsx attributes have been stable across the
    patches the sources describe, but no version floor was retrieved
  loader: bg3_module
  toolchain:
  - bg3_toolkit
  - lslib
  - bg3_multitool
  platforms:
  - windows
mechanism:
- kind: config_key
  id: UUID
  container: Mods/<YourMod>/meta.lsx
  field: UUID
  label: FixedString. "This is how Mod Manager tells mods apart, so this UUID must
    be unique, unless you want it to override another mod."
- kind: config_key
  id: Folder
  container: Mods/<YourMod>/meta.lsx
  field: Folder
  label: LSString. "This needs to match the name of the new folder ... If you don't
    enter this correctly, stuff in your mod will break."
- kind: config_key
  id: Name
  container: Mods/<YourMod>/meta.lsx
  field: Name
  label: LSString shown by mod managers.
- kind: config_key
  id: Version64
  container: Mods/<YourMod>/meta.lsx
  field: Version64
  label: int64. The version encoded as an Int64; 36028797018963968 reads as 1.0.0.0.
- kind: config_key
  id: Dependencies
  container: Mods/<YourMod>/meta.lsx
  field: Dependencies
  label: The ModuleShortDesc entries naming modules that must load before this one.
- kind: file_path
  id: <YourMod>.pak
  label: The distributed artifact; it goes into the player's Mods folder as a bare
    .pak.
