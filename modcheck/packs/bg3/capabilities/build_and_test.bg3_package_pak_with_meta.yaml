  - bg3-package-pak-with-meta
requirements:
- The mod's content, laid out under Mods/<YourMod> and Public/<YourMod>
- A freshly generated UUID
- A version number to encode as Int64
interactions:
- A duplicated UUID is an override, not an error. The wiki states the UUID "must be
  unique, unless you want it to override another mod", so a copy-pasted template UUID
  silently takes another mod's place.
- Load order is declared in modsettings.lsx, which a mod manager writes. BG3 Mod Manager's
  README warns that if a mod errors, "the game is clearing the load order" - one broken
  module can discard everyone's ordering.
- A bare .pak hides everything from us. Our inspector reads the LSPK header and stops,
  because the file list is LZ4-compressed and the optional lz4 dependency is absent
  here. That is exactly why shipping a zip containing info.json or meta.lsx beside
  the .pak makes a mod far more inspectable.
build:
  produces: One .pak file, optionally distributed inside a zip alongside its meta/info
    metadata.
  requires_network: false
  requires_game_install: true
validation:
- method: Inspect the distributed artifact and read back the identity it declares.
  command: .venv/bin/modcheck inspect dist/<YourMod>.zip --game bg3 --json
  modcheck_check: modcheck.inspect.bg3.inspect:mod_id
  limits: 'This works only if the distributed artifact exposes info.json or meta.lsx
    outside the .pak. Against a bare .pak it reports the LSPK format version, priority
    and part count and warns that "module UUID and dependencies live inside it and
    were not read". Even when identity is read, it is `declared` evidence: we do not
    verify that the meta.lsx inside the .pak agrees with the one beside it, and we
    do not check the declared MD5 against the shipped .pak.'
- method: Confirm meta.lsx is well-formed XML and carries the four identity attributes.
  command: python -c "import sys,xml.etree.ElementTree as E;r=E.parse(sys.argv[1]).getroot();print(sorted(a.get('id')
    for n in r.iter('node') if n.get('id')=='ModuleInfo' for a in n.findall('attribute')))"
    Mods/<YourMod>/meta.lsx
  limits: Checks structure and attribute presence, not correctness. It cannot tell
    you the UUID is unique across the player's installed mods, cannot tell you Folder
    matches your real folder name, and cannot decode Version64 into the version you
    meant.
- method: Load the mod through BG3 Mod Manager and confirm it appears with the right
    name and version.
  command: <run BG3ModManager.exe, refresh, and check the mod's row>
  limits: Requires Windows, .NET 8.0 and the retail game - none of which exist here,
    so this was never run. It confirms the manager can read your identity; it does
    not confirm the mod's content works.
