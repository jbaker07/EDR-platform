id: register_content.bg3_stats_entry_weapon
game: bg3
capability: register_content
title: Change a game stats entry by shipping a stats .txt in your own module
summary: A creator ends up with a stats text file inside their own module that changes
  a game stats entry - for example the starting equipment a class spawns with - and
  understands exactly how much of the base game they have just taken ownership of
  by doing it.
applies_to:
  game_versions: not established; stats entry ids and fields change between patches
    and we retrieved no version-tagged reference
  loader: bg3_module
  toolchain:
  - bg3_multitool
  - lslib
  platforms:
  - windows
mechanism:
- kind: record
  id: <stats entry name>
  container: Public/<YourMod>/Stats/Generated/<StatsFile>.txt
  label: One entry inside a stats file, introduced by a `new <type> "<name>"` line
    and continued by the `add ...` lines beneath it.
- kind: field
  id: <stats entry name>.<add line>
  container: Public/<YourMod>/Stats/Generated/<StatsFile>.txt
  field: add equipment entry / add equipmentgroup / add initialweaponset
  label: One statement within the entry.
- kind: file_path
  id: Public/Shared/Stats/Generated/Equipment.txt
  label: The base-game path a whole-file override claims. Claiming this path puts
    you in direct competition with every other mod that overrides the same file.
- kind: file_path
  id: Public/<YourMod>/Stats/Generated/
  label: The path inside your own module, which is where Larian's documentation says
    stats files live.
recipes:
- bg3-stats-entry-weapon
references:
- source: bg3_wiki_editing_equipment_txt
  evidence_class: declared
  locator: Extracting and Placing Equipment.txt
  quote: 'Now, in your Baldur''s Gate 3 Data folder, create this file path: Data\Public\Shared\Stats\Generated

    Copy the Equipment.txt from the first Generated folder to this newly created one.
    This new Equipment.txt will overwrite the base game settings for equipment.'
- source: bg3_wiki_editing_equipment_txt
  evidence_class: declared
  locator: Editing Equipment.txt - Removing equipment
  quote: Before making any changes, we recommend making a copy of the Equipment.txt
    and naming it something like "Equipment - OG Copy.txt". This is so you can easily
    revert back to the default later if you so choose.
- source: larian_docs_creating_a_new_mod
  evidence_class: declared
  locator: Understanding the Mod Folders > 4. Data/Public/<YourMod>
  quote: "Mod data that will be packed. \nExamples: stats files, root templates, UUID\
    \ tables, any created Resources (VisualResources, AnimationResource, etc.) and\
    \ their corresponding assets, texture atlases."
- source: larian_docs_publishing_a_mod
  evidence_class: declared
  locator: Conflicts
  quote: Because both mods override the same spell, only one of them will work.
- source: lslib_repo_readme
  evidence_class: declared
  locator: LSLib
  quote: "This package provides utilities for manipulating Divinity Original Sin 1,\
    \ Enhanced Edition, Original Sin 2 and Baldur's Gate 3 EA files:\n\n - Extracting/creating\
    \ PAK packages"
- source: bg3_multitool_readme_unreachable
  evidence_class: unresolved
  locator: repository README
  quote: ''
evidence_state: documented
evidence_note: Derived from recipe bg3-stats-entry-weapon, which is the record that
  was actually verified. This capability record restates that recipe's extension points
  under the shared taxonomy; it adds no evidence of its own.
provenance:
  added: '2026-09-20'
  last_verified: '2026-09-20'
  verified_against:
  - bg3-stats-entry-weapon
requirements:
- The stats file that holds the entry you want to change, extracted from the game's
  own .pak files
- The entry name inside that file (for example EQP_CC_Barbarian)
interactions:
- A whole-file override is the least compatible form of this change. Two mods that
  both ship Public/Shared/Stats/Generated/Equipment.txt are asserting different contents
  for the same game file, and by Larian's own statement about overriding the same
  thing, only one of them will work.
- Because subclasses carry their own entries, changing one class entry is often not
  the whole job - the tutorial notes "some classes have subclasses that each have
  their own unique equipment set, such as Sorcerer and Paladin".
- We retrieved no authoritative reference for which stats entry types exist and which
  fields each accepts. This recipe describes the mechanism and the location, not a
  validated field vocabulary; that gap is recorded in pack.yaml.
build:
  produces: A stats .txt inside the module's Public/<YourMod>/Stats/Generated folder,
    to be packed into the mod's .pak.
  requires_network: false
  requires_game_install: true
validation:
- method: Inspect the shipped artifact to confirm the module's declared identity before
    looking at its contents.
  command: .venv/bin/modcheck inspect dist/<YourMod>.zip --game bg3 --json
  modcheck_check: modcheck.inspect.bg3.inspect:mod_id
  limits: This reads info.json or meta.lsx for identity and lists the .pak files shipped.
    It does NOT open the .pak - the LSPK file list is LZ4-compressed and the optional
    lz4 dependency is absent here - so it cannot see your stats file at all, cannot
    tell you which entries you changed, and cannot detect that another mod ships the
    same stats path.
- method: Diff your stats file against the pristine copy you kept.
  command: diff -u "Equipment - OG Copy.txt" Public/<YourMod>/Stats/Generated/Equipment.txt
  limits: Shows exactly what you changed relative to the build you extracted from,
    which is the only reliable way to review a whole-file override. It says nothing
    about whether the entry names still exist in the current game patch, and nothing
    about interaction with other mods.
- method: Load the mod and check the entry in game.
  command: <launch Baldur's Gate 3 with the mod enabled and start a new character
    of the affected class>
  limits: Requires the retail game, which we do not have, so this was never run. It
    is nevertheless the only check that establishes the edit took effect, because
    nothing in the artifact proves it.
