    quote: "This package provides utilities for manipulating Divinity Original Sin 1, Enhanced Edition, Original Sin 2 and Baldur's Gate 3 EA files:\n\n - Extracting/creating PAK packages\n - Extracting/creating LSV savegame packages\n - Converting LSB, LSF, LSX, LSJ resource files"
  - source: lslib_repo_license
    evidence_class: extracted
    locator: first two lines
    quote: "The MIT License (MIT)\n\nCopyright (c) 2015 Norbyte"
