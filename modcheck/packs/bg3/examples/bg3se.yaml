    evidence_class: extracted
    locator: intro
    quote: "The Script Extender adds Lua/Osiris scripting support to the game."
  - source: bg3se_api_docs
    evidence_class: extracted
    locator: title
    quote: "# BG3SE Lua API v30 Documentation"
  - source: bg3se_api_docs
    evidence_class: extracted
    locator: "Capturing Events/Calls"
    quote: "Ext.Osiris.RegisterListener(\"TurnEnded\", 1, \"after\", function (characterGuid)\n    _P(\"TurnEnded- \" .. characterGuid)\nend)"
  - source: bg3se_repo_license
    evidence_class: extracted
    locator: header
    quote: "## “Commons Clause” License Condition v1.0"
  - source: bg3_wiki_mod_types
    evidence_class: declared
