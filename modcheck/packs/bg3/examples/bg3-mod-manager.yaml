id: bg3-mod-manager
game: bg3
title: BG3 Mod Manager - orders modules and writes the game's modsettings.lsx
url: https://github.com/LaughingLeader/BG3ModManager
kind: tool
demonstrates:
  - Where BG3's load order actually lives - a single modsettings.lsx the game reads, written by the manager rather than derived from filenames.
  - The two documented ways that file gets wiped, which is the mechanism behind our modsettings-load-order-cleared failure record.
  - Reading a module's identity and declared dependencies out of the artifact, which is the same job our BG3 inspector does and a useful cross-check on it.
  - Exporting a load order to a shareable file, which is the closest thing BG3 has to a reproducible configuration.
license: MIT
reuse:
  integration: reference_only
  constraints: >-
    Licence verified by fetching the repository LICENSE file, which reads "MIT License" / "Copyright (c)
    2019 LaughingLeader". Permissive, but it is a Windows .NET 8.0 desktop application, so there is nothing
    runnable here; we cite it for the facts it documents about modsettings.lsx. Its README also states it
    is the only official source for the tool - worth repeating to players, since mod managers are a common
    malware vector.
