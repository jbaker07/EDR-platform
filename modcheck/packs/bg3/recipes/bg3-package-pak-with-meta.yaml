    quote: "Currently, files related to your mod project are stored in five different folders inside the Baldur's Gate 3 /Data/ folder, depending on what kind of file they are."
  - source: larian_docs_publishing_a_mod
    evidence_class: declared
    locator: "Publishing Locally"
    quote: "The Publish Local button will create a .pak file for you, without uploading it to mod.io. It requires no authentication."
  - source: larian_docs_publishing_a_mod
    evidence_class: declared
    locator: Dependencies
    quote: "The game will ensure that MyClass is loaded before MySubclass when players start a new game session with the MySubclass mod enabled."
  - source: larian_docs_publishing_a_mod
    evidence_class: declared
    locator: Conflicts
    quote: "Defining conflicts for your mod allows the game to automatically disable your mod when one of the listed conflicts is detected."
  - source: bg3mm_repo_readme
    evidence_class: declared
    locator: "Important Tips"
    quote: "Make sure you don't have any subfolders in your mods folder (`%LOCALAPPDATA%\\Larian Studios\\Baldur's Gate 3\\Mods`). This causes the game to reset your `modsettings.lsx`!"
  - source: lslib_repo_readme
    evidence_class: declared
    locator: feature list
    quote: " - Extracting/creating PAK packages"
