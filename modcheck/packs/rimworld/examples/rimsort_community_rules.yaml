id: rw-example-rimsort-community-rules
game: rimworld
title: RimSort Community Rules Database (communityRules.json)
url: https://raw.githubusercontent.com/RimSort/Community-Rules-Database/main/communityRules.json
kind: schema
demonstrates:
- a machine-readable load-order ruleset keyed by RimWorld packageId, independent of any one mod manager's internals
- 'the record shape {packageId: {loadAfter: {otherId: {name: [display names]}}}}, carrying a human-readable name alongside each id'
- a crowd-maintained layer of ordering knowledge that About.xml's own loadAfter/loadBefore fields do not capture
- an explicit freshness signal - a top-level Unix "timestamp" field
