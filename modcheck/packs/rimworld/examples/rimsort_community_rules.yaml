  integration: reference_only
  constraints: >-
    There is NO LICENSE file at the root of the repository on branch main - the probe
    returned HTTP 404 and is recorded in this pack as the gap source
    rimsort_rules_db_license_probe. Redistribution, commercial use and derivative terms are
    therefore unknown, not permissive. We read it; we do not vendor, republish or derive a
    ruleset from it. The RimSort application itself is separately licensed GPL-3.0, which
    says nothing about this data repository.
