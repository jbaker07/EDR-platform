id: rw-example-harmony
game: rimworld
title: Harmony (pardeike/Harmony, NuGet Lib.Harmony)
url: https://raw.githubusercontent.com/pardeike/Harmony/master/README.md
kind: library
demonstrates:
- runtime patching of .NET and Mono methods as prefixes, postfixes, transpilers, finalizers and reverse patches
- the annotation model - a class carrying at least one [HarmonyPatch] attribute, with static patch methods found by name or attribute
- altering a method's return value by taking __result by ref
- why a destructive prefix (returning false) is the main source of mod-vs-mod breakage in RimWorld
- the documented failure mode where an inlined method simply cannot be patched
license: MIT
reuse:
  integration: reference_only
  constraints: >-
    LICENSE is the MIT licence, "Copyright (c) 2017 Andreas Pardeike", so reuse requires
    only that the notice be retained. In RimWorld it is consumed as a mod dependency on
    packageId brrainz.harmony rather than vendored - the wiki explicitly warns against
    shipping 0Harmony.dll inside a mod's Assemblies folder. Nothing from it is copied into
    this repository.
