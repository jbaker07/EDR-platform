id: esplugin_analyzer
game: falloutnv
title: esplugin - Rust library that parses Fallout New Vegas plugins past the header
url: https://raw.githubusercontent.com/Ortham/esplugin/master/README.md
kind: analyzer
demonstrates:
  - Reading .esp/.esm content for Fallout New Vegas beyond the TES4 header our own inspector stops at
  - The parser LOOT and libloadorder depend on, rather than another re-implementation of the format
  - Defensive parsing of malformed plugins - errors instead of panics, masters past 256 ignored
license: GPL-3.0
reuse:
  integration: subprocess
  constraints: >-
    GPL-3.0, verified from the repository LICENSE. Linking it would make the result copyleft, so a
    subprocess boundary is the realistic integration. Rust 1.94.1 is present here and the stated
    minimum is 1.81, but no build was run for this pack.
maintenance:
  state: maintained
  last_release: '[6.1.4] - 2025-09-29, the newest entry in the CHANGELOG we fetched'
  checked_at: '2026-09-19'
  supported_versions: >-
    Parses Morrowind, Oblivion (incl. Remastered), Skyrim (incl. SE/AE/VR), Fallout 3,
    Fallout: New Vegas, Fallout 4 (incl. VR) and Starfield
evidence:
  - source: esplugin_readme
    evidence_class: declared
    locator: supported games list
    quote: >-
      Fallout: New Vegas
  - source: esplugin_readme
    evidence_class: declared
    quote: >-
      esplugin is a rewrite of [libespm](https://github.com/Ortham/libespm) and focuses on providing a
      useful API to [libloadorder](https://github.com/Ortham/libloadorder) and
      [LOOT](https://github.com/loot/loot), rather than a general-purpose plugin parser.
  - source: esplugin_changelog
    evidence_class: extracted
    locator: newest release heading
    quote: '## [6.1.4] - 2025-09-29'
  - source: esplugin_license
    evidence_class: extracted
    quote: GNU GENERAL PUBLIC LICENSE
provenance:
  added: '2026-09-19'
  last_verified: '2026-09-19'
  verified_against:
    - esplugin_readme
    - esplugin_changelog
    - esplugin_license
