id: skse_plugin_commonlibsse_ng
game: skyrimse
title: Build an SKSE plugin DLL with CommonLibSSE-NG
category: extend_system
intent: >-
  A creator ends up with a single SKSE plugin DLL under Data/SKSE/Plugins that loads under Skyrim
  SE, AE and VR runtimes, built from a CMake project that pulls CommonLibSSE-NG through vcpkg.
applies_to:
  game_versions: >-
    Skyrim SE/AE runtimes supported by the SKSE build you target; skse.silverlock.org lists AE build
    2.3.1 for game version 1.7.104, and the readme we fetched documents 2.2.6 beta for 1.6.1170
  loader: skse64
  toolchain:
    - CMake
    - vcpkg
    - MSVC (Windows)
inputs:
  - Windows with MSVC and CMake
  - vcpkg, with the colorglass registry added for the commonlibsse-ng port
  - The matching SKSE64 build installed in the game folder for testing
extension_points:
  - kind: file_path
    id: PluginAPI.h
    container: the SKSE64 source archive
    label: >-
      the header SKSE's readme names as the instructions for the plugin interface; we did not fetch
      it, so the entry-point signature must be read there, not assumed
  - kind: file_path
    id: Data/SKSE/Plugins/<yourplugin>.dll
    label: where the script extender loads plugin DLLs from
  - kind: config_key
    id: add_commonlibsse_plugin
    container: CMakeLists.txt
    label: CMake function that generates the plugin declaration
dependencies:
  - id: skse64
    kind: loader
    required: true
  - id: commonlibsse_ng
    kind: library
    required: true
steps:
  - step: Register the vcpkg registry that carries CommonLibSSE-NG
    detail: >-
      Create vcpkg-configuration.json next to vcpkg.json declaring the git registry
      https://gitlab.com/colorglass/vcpkg-colorglass with the commonlibsse-ng packages, as the
      project README shows, and pin its baseline commit.
    file: vcpkg-configuration.json
  - step: Declare the plugin target in CMake
    detail: >-
      In CMakeLists.txt call find_package(CommonLibSSE REQUIRED) and declare the target with
      add_commonlibsse_plugin() instead of add_library(). CommonLibSSE-NG then generates the SKSE
      plugin declaration for you, which is what makes one DLL work across runtimes.
    file: CMakeLists.txt
    code: |
      find_package(CommonLibSSE REQUIRED)

      add_commonlibsse_plugin(${PROJECT_NAME}
          SOURCES ${headers} ${sources})
  - step: Write the plugin entry point
    detail: >-
      Implement your load function and do your hooking there. SKSE's own readme points plugin
      authors at PluginAPI.h and the example plugin project shipped with the SKSE source; consult
      those for the interface contract your build must satisfy.
  - step: Install the built DLL where the script extender looks
    detail: >-
      Copy the DLL to Data/SKSE/Plugins. The SKSE site's troubleshooting advice - remove the files
      from Data/SKSE/Plugins after a game patch - is the confirmation that this is the load path,
      and the reason plugins break on every runtime update.
  - step: Launch through the loader, not the game executable
    detail: >-
      The game must be started with skse64_loader.exe, by hand or by the mod manager, or nothing
      SKSE-side loads at all.
    command: skse64_loader.exe
interactions:
  - >-
    An SKSE plugin is bound to the game runtime version it was built for. When the game updates, the
    plugin and usually SKSE itself must be rebuilt; that is the single most common cause of
    startup crashes after a patch.
  - >-
    SKSE may not be redistributed with your mod. Its readme requires linking to
    https://skse.silverlock.org/ instead, so your release must not bundle it.
  - >-
    If you include SKSE source code in your plugin, the readme requires you to make your own source
    available; CommonLibSSE-NG is MIT, which is a different and more permissive obligation.
build:
  produces: A Windows DLL for Data/SKSE/Plugins
  requires_network: true
  requires_game_install: true
validation:
  - method: Confirm the artifact you ship is the DLL and not a plugin file the game would try to load as a record container
    command: modcheck inspect dist/YourPlugin.dll --game skyrimse
    limits: >-
      Our inspector only identifies Bethesda plugin files by their TES4 header; for a DLL it reports
      identity (path, size, sha256) and nothing about its exports, its SKSE version requirements or
      whether it loads. It cannot tell you the plugin works.
  - method: Check the runtime version you targeted against the SKSE build table before release
    command: modcheck sources verify --game skyrimse
    limits: >-
      This only re-fetches our recorded copy of skse.silverlock.org and reports whether it changed
      since we hashed it. It does not check your DLL, and a changed page means "re-read it", not
      "your plugin is broken".
acceptance:
  - The project builds one DLL that loads under each runtime you claim to support.
  - The release links to skse.silverlock.org rather than bundling SKSE.
  - The readme states the exact game runtime versions the DLL was built against.
references:
  - source: commonlibsse_ng_readme
    evidence_class: declared
    locator: Simplified Plugin Declaration
    quote: >-
      Just replace `add_library` with `add_commonlibsse_plugin` in `CMakeLists.txt` and CMake will
      create your shared library target, configure CommonLibSSE linkage, and auto-generate this
      content and inject it into the plugin.
  - source: commonlibsse_ng_readme
    evidence_class: declared
    locator: Multiple Runtime Targets
    quote: >-
      CommonLibSSE NG has support for Skyrim SE, AE, and VR, and is able to create builds for any
      combination of these runtimes, including all three.
  - source: skse64_readme
    evidence_class: declared
    locator: Troubleshooting / FAQ
    quote: >-
      See PluginAPI.h for instructions, as well as the example plugin project included with the rest
      of the source code. If you include any of the SKSE source code, you are required to make your
      source code available.
  - source: skse64_readme
    evidence_class: declared
    locator: Installation, step 4
    quote: >-
      Run skse64_loader.exe to launch the game. You or your mod manager must continue to use the
      loader for SKSE64 to work.
  - source: skse_home
    evidence_class: declared
    locator: Contact the SKSE Team
    quote: >-
      Having crashes on startup after a game patch? Remove the files from Data/SKSE/Plugins and try
      again. Mods using plugins probably need to be updated.
  - source: commonlibsse_ng_license
    evidence_class: extracted
    quote: MIT License
verification_state: documented
verification_note: >-
  Written from fetched documentation only. Nothing was built: this environment has no MSVC, no
  vcpkg and no Windows runtime, and we do not run builds. We deliberately state no entry-point
  signature: SKSE's readme names PluginAPI.h as the instructions, we did not fetch that header, so
  we do not know the signature and will not guess it.
provenance:
  added: '2026-09-19'
  last_verified: '2026-09-19'
  verified_against:
    - commonlibsse_ng_readme
    - commonlibsse_ng_license
    - skse64_readme
    - skse_home
