id: synthesis_patcher
game: skyrimse
title: Write a Synthesis patcher that rewrites winning overrides at patch time
category: compatibility_patch
intent: >-
  A creator ends up with a C# patcher that Synthesis runs against the player's own load order and
  that emits a patch plugin tailored to it, instead of a hand-built patch that only fits one
  specific mod list.
applies_to:
  game_versions: Skyrim SE via GameRelease.SkyrimSE as shown in the Synthesis documentation
  loader: bethesda_plugin
  toolchain:
    - Synthesis
    - Mutagen
    - .NET SDK
inputs:
  - An IDE for C# (Visual Studio Community or Rider) and the DotNet SDK
  - Synthesis, used once to bootstrap a Local Solution patcher
extension_points:
  - kind: method
    id: RunPatch
    signature: public static void RunPatch(IPatcherState<ISkyrimMod, ISkyrimModGetter> state)
    container: Program.cs
    label: callback Synthesis invokes with the pipeline state
  - kind: method
    id: SynthesisPipeline.Instance.AddPatch<ISkyrimMod, ISkyrimModGetter>
    container: Program.cs
    label: registers the patch entry point for this game type
  - kind: record
    id: state.PatchMod
    label: the output mod object; every change must be applied here
dependencies:
  - id: synthesis
    kind: framework
    required: true
  - id: mutagen
    kind: library
    required: true
steps:
  - step: Bootstrap a Local Solution patcher
    detail: >-
      Use Synthesis to create a new Local Solution patcher. It creates the solution and project with
      Synthesis and Mutagen imported, a default main method hooked into the pipeline, nullability
      enabled and a default gitignore. After that, work in the IDE rather than the Synthesis UI.
  - step: Keep the generated entry point
    detail: >-
      The generated Program.cs registers your patch for the game type and names the output plugin.
      Editing this is how you change which game or output file the patcher targets.
    file: Program.cs
    code: |
      public static async Task<int> Main(string[] args)
      {
          return await SynthesisPipeline.Instance
              .AddPatch<ISkyrimMod, ISkyrimModGetter>(RunPatch)
              .SetTypicalOpen(GameRelease.SkyrimSE, "YourPatcher.esp")
              .Run(args);
      }
  - step: Iterate winning overrides, not raw plugins
    detail: >-
      Inside RunPatch, walk state.LoadOrder.PriorityOrder for the record type you care about and
      take WinningOverrides(). That gives you the version of each record that the game would
      actually apply, which is the only sensible base for a patch.
    code: |
      foreach (var npcGetter in state.LoadOrder.PriorityOrder.Npc().WinningOverrides())
      {
          if (!npcGetter.EditorID?.Contains("Goblin", StringComparison.OrdinalIgnoreCase) ?? true) continue;
          var npc = state.PatchMod.Npcs.GetOrAddAsOverride(npcGetter);
          npc.Height /= 2;
      }
  - step: Do not emit records you did not change
    detail: >-
      Delay GetOrAddAsOverride until you know you are making a real modification. A record copied
      into the patch unchanged is an ITPO - the same defect xEdit's cleaning chapter calls an
      identical-to-master edit - and it silently cancels other mods' intentional changes.
  - step: Ship the patcher, not the patch
    detail: >-
      What you distribute is the patcher project; the plugin is generated on the player's machine
      against their load order. That is the property that makes this approach survive mod-list
      changes that a static patch plugin would not.
interactions:
  - >-
    The generated patch plugin takes the plugins it draws records from as masters, so it inherits
    their presence requirements and must load after them.
  - >-
    A patcher that touches the same records as another patcher in the pipeline still resolves by
    order: the later output wins, exactly as with hand-made plugins.
  - >-
    Mutagen and Synthesis are GPL-3.0. A patcher built on them is a derivative work and inherits
    that obligation, which matters if you intended to ship it under other terms.
build:
  produces: A .NET project whose output Synthesis runs to generate a patch plugin
  requires_network: true
  requires_game_install: true
validation:
  - method: Inspect the generated patch plugin's header for unexpected masters
    command: modcheck inspect Data/YourPatcher.esp --game skyrimse
    limits: >-
      Reads the TES4 header only: it shows which plugins became masters of the generated patch and
      the record counts, but says nothing about whether the patched records are correct, and cannot
      detect ITPOs - those live below the header.
  - method: Run the LOOT-backed analysis over the resulting load order
    command: modcheck analyze --game skyrimse --config loadorder.json
    limits: >-
      Reports only LOOT-recorded requirements, incompatibilities, load-order rules and CRC-matched
      dirty records. A freshly generated patch has no masterlist entry, so it will produce no
      findings of its own; that is not evidence it is sound.
acceptance:
  - The patcher runs to completion in the Synthesis pipeline and produces a plugin.
  - The generated plugin contains only records the patcher meant to change, with no unchanged copies.
  - The patcher's licence statement is compatible with the GPL-3.0 of Mutagen and Synthesis.
references:
  - source: synthesis_create_a_patcher
    evidence_class: declared
    locator: Solution Patcher
    quote: >-
      Synthesis provides bootstrapping functionality to get new Mutagen patchers off the ground
      fairly easily.
  - source: synthesis_coding_a_patcher
    evidence_class: declared
    locator: Run Patch Method
    quote: Whatever changes you want to be made should be applied to the state.PatchMod object.
  - source: synthesis_coding_a_patcher
    evidence_class: declared
    locator: Typical Simple Code
    quote: >-
      Typical code for a Synthesis patcher consists of locating Winning Overrides for a record type,
      and adding them to the output patch mod with some changes.
  - source: mutagen_itpo_avoidance
    evidence_class: declared
    locator: What is an ITPO
    quote: >-
      A very typical thing that can happen during processing mods is exporting a record that doesn't
      have any changes compared to the original. This is known as an ITPO (Identical to Previous
      Override), or sometimes ITM (Idential to Master).
  - source: mutagen_winning_overrides
    evidence_class: declared
    quote: >-
      You can also iterate over Mod Context objects, which give more information and have more
      features that just looping the raw records.
  - source: mutagen_license
    evidence_class: extracted
    quote: GNU GENERAL PUBLIC LICENSE
verification_state: documented
verification_note: >-
  Written from fetched documentation only. Nothing was compiled or run: dotnet is absent from this
  environment and we do not install packages. The code blocks are the documentation's own snippets,
  reproduced for orientation, not code we executed.
provenance:
  added: '2026-09-19'
  last_verified: '2026-09-19'
  verified_against:
    - synthesis_create_a_patcher
    - synthesis_coding_a_patcher
