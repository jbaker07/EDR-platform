  bytes: 58325
  content_sha256: a75c5e99e642873856b71ce086e3ed5a7d8787b5e1439328ff388eba46d51c11
  content_type: text/html
  evidence_path: 03/036b7e5db0c39fd445bf13efd7b7bd1ab54cb5c30570eda58749245de8325641.html
  games:
  - skyrimse
  publisher: Bethesda Game Studios (creationkit.com)
  license: unknown
  notes: 'Fetched with HTTP 200 but the body is not documentation: creationkit.com serves ''This wiki
    is currently down for backend maintenance. Any news will be posted in the official Bethesda Game Studios
    discord , in the #modding-news channel.'' Every Creation Kit wiki URL we tried returned this same
    page, so we hold NO Creation Kit documentation for Skyrim: no Papyrus reference, no Form ID page,
    no editor workflow. Treat as a gap despite the 200. Re-verification note: the raw bytes differ on
    every fetch because the markup carries a randomly generated XWiki element id (xwiki-select-<random>);
    the maintenance notice itself is unchanged. The record therefore carries a content_sha256, and `modcheck
    sources verify` reports it as volatile rather than changed.'
