id: synthesis_local_solution_template
game: skyrimse
title: Synthesis Local Solution patcher - generated project template
url: https://mutagen-modding.github.io/Synthesis/devs/Create-a-Patcher/
kind: template
demonstrates:
  - A ready-made C# project wired into the Synthesis pipeline, with Mutagen referenced and nullability enabled
  - The Program.cs entry point that registers a patch for a game type and names the output plugin
  - Generating a patch against the player's own load order rather than shipping a fixed patch plugin
license: GPL-3.0-only
reuse:
  integration: vendored
  constraints: >-
    The template is generated into your own solution, so what you ship is a derivative of Synthesis
    and Mutagen - both GPL-3.0-only per the NuGet package metadata and the repository LICENSE files.
    Building it needs the .NET SDK, which is absent here, so we generated nothing.
