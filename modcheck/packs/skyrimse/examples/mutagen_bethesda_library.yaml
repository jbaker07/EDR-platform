id: mutagen_bethesda_library
game: skyrimse
title: Mutagen.Bethesda - C# library for reading and writing Skyrim plugins
url: https://mutagen-modding.github.io/Mutagen/
kind: library
demonstrates:
  - Strongly typed access to plugin records instead of hand-rolled binary parsing
  - Resolving the record the game would actually apply, via LoadOrder.PriorityOrder and WinningOverrides()
  - Avoiding identical-to-previous-override output by delaying GetOrAddAsOverride until a real change is made
license: GPL-3.0-only
reuse:
  integration: library_import
  constraints: >-
    GPL-3.0-only, declared both by the repository LICENSE.txt and by the licenseExpression in the
    NuGet package metadata we fetched. Linking it into ModCheck would make the result copyleft, so
    it is recorded here as a creator's tool rather than something we plan to import. It also needs
    the .NET SDK, which is absent here.
maintenance:
  state: active
  last_release: 0.55.0-alpha.54, published 2026-09-19T13:52:44.46+00:00 (newest listed version in the NuGet registration page we fetched)
  checked_at: '2026-09-19'
  supported_versions: >-
    Documentation shows Oblivion, Skyrim and Fallout 4 record suites; Skyrim SE is selected with
    GameRelease.SkyrimSE
