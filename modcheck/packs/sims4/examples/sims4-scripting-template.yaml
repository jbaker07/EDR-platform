id: sims4-scripting-template
game: sims4
title: Sims4ScriptingTemplate - project template for building a .ts4script
url: https://github.com/mycroftjr/Sims4ScriptingTemplate
kind: template
demonstrates:
  - The full script-mod build shape - a src tree, a compile step, a build output, and installation to Mods/CreatorName_ProjectName/CreatorName_ProjectName.ts4script.
  - Generating run-time Python type stubs from the game's decompiled sources, which is what makes an editor able to check calls into game code at all.
  - A distribution convention that avoids a real player-side failure - nesting build artifacts in one self-contained folder, so unzipping into the Mods folder cannot scatter files.
  - A reversal worth reading before shipping - the template dropped its compiled-only build variant because shipping only .pyc is discouraged.
license: Apache-2.0
reuse:
  integration: reference_only
  constraints: >-
    Licence verified by fetching the repository LICENSE file, which is the Apache License, Version 2.0
    verbatim - permissive with attribution and a patent grant, and it requires that changes be marked if
    the work is redistributed modified. We do not vendor or run it: its decompile step needs an installed
    game, and its compile step needs the CPython version the game expects, which this environment does not
    have. It is a fork of junebug12851/Sims4ScriptingBPProj, which its own README credits.
