  quote: ResourceType
- source: simswiki_ts4_general_modding
  evidence_class: declared
  locator: File Formats
  quote: 'April 2015 : Binary Tuning / Sim Data resources (0x545ac67a and 0x62e94d38)'
- source: mts_sims4_game_mod_guidelines
  evidence_class: declared
  locator: Information > Mod Type
  quote: State clearly what kinda mod your mod is. Is it a resource override (aka
    default replacement), recategorizer or hider, slider, XML tuning, or a full script
