- source: mts_sims4_game_mod_guidelines
  evidence_class: declared
  locator: Information > Overrides - Overriden Resources
  quote: If you have overriden (default replaced) an item, make sure to clearly state
    what you've overriden.
- source: mts_sims4_game_mod_guidelines
  evidence_class: declared
  locator: Quality > Tuning Mods - Versions
  quote: Whenever possible, tuning mods should be done in different flavours. For
    example, don't just double a value, but offer it half, tripled, and none.
- source: s4tk_models_readme
