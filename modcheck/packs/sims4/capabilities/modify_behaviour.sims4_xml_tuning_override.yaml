id: modify_behaviour.sims4_xml_tuning_override
game: sims4
capability: modify_behaviour
title: Override a game XML tuning resource in your own .package
summary: A creator ends up with a .package containing one resource stored under the
  same Type/Group/Instance key the game already uses for a tuning resource, so the
  game's value is replaced by theirs - and with a written record of exactly which
  keys they have taken over, because nothing in the artifact will tell a player that
  later.
applies_to:
  game_versions: must be stated per release; Mod The Sims requires uploaders to state
    the base game version the mod was built with
  loader: sims4_package
  toolchain:
  - sims4studio
  - s4pe
  - s4tk_models
  platforms:
  - windows
  - macos
mechanism:
- kind: tuning
  id: <Type>:<Group>:<Instance>
  container: <YourMod>.package
  label: The resource key you are claiming. This is the whole identity of the override
    - a DBPF package has no filenames, only keys.
- kind: field
  id: <tuning element you are changing>
  container: <YourMod>.package
  field: <XML element or attribute>
  label: One value inside the tuning document.
- kind: registry_key
  id: ResourceType
  label: The numeric type half of the key. SimsWiki records "Binary Tuning / Sim Data
    resources (0x545ac67a and 0x62e94d38)"; we retrieved no complete Sims 4 type table,
    so verify the type of the resource you are actually editing rather than trusting
    a remembered constant.
- kind: file_path
  id: Mods/<YourMod>.package
  label: Where the finished package is installed.
recipes:
- sims4-xml-tuning-override
references:
- source: simswiki_dbpf_general
  evidence_class: declared
  locator: Format > Overview
  quote: Header first, individual files following with no filenames and a small file
    header area at the beginning of each followed by an index of all the files in
