  locator: sims4studio.com
  quote: ''
evidence_state: documented
evidence_note: Derived from recipe sims4-xml-tuning-override, which is the record
  that was actually verified. This capability record restates that recipe's extension
  points under the shared taxonomy; it adds no evidence of its own.
provenance:
  added: '2026-09-20'
  last_verified: '2026-09-20'
  verified_against:
  - sims4-xml-tuning-override
requirements:
- The tuning resource you want to change, extracted from the game's own packages
- Its resource key - ResourceType, ResourceGroup and the 64-bit Instance
interactions:
- 'Two packages shipping the same resource key are the canonical Sims 4 conflict:
  both claim the same game resource. We retrieved no source stating which one the
  running game resolves to, so this pack records the collision and deliberately does
  not name a winner.'
- A tuning override and a Python script mod can both change the same behaviour by
  different routes. The package override is visible in the artifact as a resource
  key; the script route is not visible at all.
- A game patch that changes the overridden tuning leaves your copy in place, silently
  reverting whatever the patch changed for players who have your mod installed.
build:
  produces: A single .package file.
  requires_network: false
  requires_game_install: true
validation:
- method: Read back the exact resource keys your finished package claims.
  command: .venv/bin/modcheck inspect dist/<YourMod>.package --game sims4 --json
  modcheck_check: modcheck.inspect.sims4.inspect_package:resource_keys
  limits: This parses the DBPF header and resource index and gives you every Type:Group:Instance
    key plus a count per type. It does NOT decode the payloads, so it cannot show
    you the tuning XML, cannot tell you which game tuning an instance corresponds
    to, and cannot tell you whether your edit is correct. It also does not know about
    any other mod - to find a collision you must inspect the other package too and
    intersect the key lists yourself.
- method: Compare the key list against the keys you intended to override.
  command: .venv/bin/modcheck inspect dist/<YourMod>.package --game sims4 --json >
    keys.json
  limits: Catches the common accident of a package carrying extra resources you did
    not mean to ship. It cannot catch the opposite error - a key that is present and
    intended but simply wrong.
- method: Load the game with only this mod installed and confirm the changed behaviour.
  command: <start The Sims 4 with a Mods folder containing only this package>
  limits: Requires the retail game, which we do not have, so this was never run. It
    is the only check that establishes the override took effect, and even then only
    against that one game patch.
