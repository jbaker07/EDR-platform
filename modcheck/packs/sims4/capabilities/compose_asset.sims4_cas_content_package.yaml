evidence_state: documented
evidence_note: Derived from recipe sims4-cas-content-package, which is the record
  that was actually verified. This capability record restates that recipe's extension
  points under the shared taxonomy; it adds no evidence of its own.
provenance:
  added: '2026-09-20'
  last_verified: '2026-09-20'
  verified_against:
  - sims4-cas-content-package
requirements:
- The mesh and textures for the item
- A base game item to clone as the starting point for the resource set
interactions:
- Additive content and override content behave completely differently under collision.
  Two additive packages are independent unless they happen to share a generated key;
  two overrides of the same key are a direct conflict.
- A key collision between two "new" items is possible when generated instance ids
  are not truly unique, and it is invisible in game - both items exist in the catalogue,
  but one resource is shadowed. A key listing of both packages is the only way to
  see it.
- This recipe is the least well-sourced of the three in this pack. We hold the container
  format, the community's tooling landscape and the ecosystem's declaration rules;
  we do NOT hold a resource-type table for Sims 4, so we cannot tell you which type
  ids a CAS part or a catalogue entry actually uses. That gap is recorded in pack.yaml.
build:
  produces: A single .package file containing the new item's resources.
  requires_network: false
  requires_game_install: true
validation:
- method: List the resource keys the package claims and check none belongs to the
    base game.
  command: .venv/bin/modcheck inspect dist/<YourMod>.package --game sims4 --json
  modcheck_check: modcheck.inspect.sims4.inspect_package:resource_keys
  limits: Gives you every Type:Group:Instance key and a count per type, which is exactly
    what this check needs - but it does not know which keys the base game uses, so
    you must compare against a key list you obtain yourself. It does not decode payloads,
    so it cannot confirm the mesh or textures are valid, and it cannot confirm the
    item will appear in the right catalogue category.
- method: Check the package's resource type distribution against a known-good clone
    of the same item kind.
  command: .venv/bin/modcheck inspect reference/<KnownGoodItem>.package --game sims4
    --json
  limits: Comparing type counts catches a missing resource class (for instance a package
    with geometry but no catalogue entry). It proves nothing about content, and a
    matching distribution can still be wrong.
- method: Install the package alone and find the item in game.
  command: <start The Sims 4 with a Mods folder containing only this package and look
    for the item in CAS or build mode>
  limits: Requires the retail game, which we do not have, so this was never run. It
    is the only check that establishes the item exists, is categorised correctly and
    renders.
