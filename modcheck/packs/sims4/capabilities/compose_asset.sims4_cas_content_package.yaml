id: compose_asset.sims4_cas_content_package
game: sims4
capability: compose_asset
title: Ship new CAS or build/buy content as an additive .package
summary: A creator ends up with a .package that ADDS a new Create-A-Sim or build/buy
  item under resource keys nobody else owns, rather than replacing an existing one
  - so the content appears alongside the game's own items and cannot silently collide
  with another creator's work.
applies_to:
  game_versions: must be stated per release; Mod The Sims requires uploaders to state
    the base game version the mod was built with
  loader: sims4_package
  toolchain:
  - sims4studio
  - s4pe
  - s4tk_models
  platforms:
  - windows
  - macos
mechanism:
- kind: asset
  id: <mesh resource key>
  container: <YourMod>.package
  label: The geometry resource for the new item.
- kind: asset
  id: <texture resource key>
  container: <YourMod>.package
  label: The DDS texture resource(s).
- kind: tuning
  id: <catalogue/CAS part resource key>
  container: <YourMod>.package
  label: The resource that makes the item appear in the catalogue or in CAS. Whether
    this is additive or an override is decided entirely by whether its key is new.
- kind: file_path
  id: Mods/<YourMod>.package
  label: Where the finished package is installed.
recipes:
- sims4-cas-content-package
