  notes: SimsWiki page (simswiki.info), also mirrored under modthesims.info. The page footer states 'Game
    content and materials copyright Electronic Arts Inc. and its licensors' and the wiki itself carries
    no reuse licence we retrieved, so reuse terms are unknown; we quote short passages for audit only.
    Mod The Sims' upload rules. Load-bearing because they are the ecosystem's own statement that a mod
    must declare its Mod Type ('resource override (aka default replacement) ... XML tuning, or a full
    script mod'), must 'list out any known conflicts', must 'clearly state what you've overriden', and
    must state the 'Built with Game Version'. That is community practice, not an engine rule.
