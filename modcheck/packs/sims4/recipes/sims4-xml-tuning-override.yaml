    evidence_class: unresolved
    locator: sims4studio.com
    quote: ""
verification_state: documented
verification_note: >-
  Written from sources only. No package was authored: Sims 4 Studio and s4pe are Windows desktop
  applications and there is no game install here to extract tuning from.
