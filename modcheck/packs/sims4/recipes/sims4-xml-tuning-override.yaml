id: sims4-xml-tuning-override
game: sims4
title: Override a game XML tuning resource in your own .package
category: modify_data_record
intent: >-
  A creator ends up with a .package containing one resource stored under the same Type/Group/Instance key
  the game already uses for a tuning resource, so the game's value is replaced by theirs - and with a
  written record of exactly which keys they have taken over, because nothing in the artifact will tell a
  player that later.
applies_to:
  game_versions: "must be stated per release; Mod The Sims requires uploaders to state the base game version the mod was built with"
  loader: sims4_package
  toolchain:
    - sims4studio
    - s4pe
    - s4tk_models
  platforms:
    - windows
    - macos
inputs:
  - The tuning resource you want to change, extracted from the game's own packages
  - Its resource key - ResourceType, ResourceGroup and the 64-bit Instance
dependencies:
  - id: sims4_package
    kind: loader
    required: true
extension_points:
  - kind: tuning
    id: "<Type>:<Group>:<Instance>"
    container: <YourMod>.package
    label: >-
      The resource key you are claiming. This is the whole identity of the override - a DBPF package has
      no filenames, only keys.
  - kind: field
    id: "<tuning element you are changing>"
    container: <YourMod>.package
    field: "<XML element or attribute>"
    label: One value inside the tuning document.
  - kind: registry_key
    id: ResourceType
    label: >-
      The numeric type half of the key. SimsWiki records "Binary Tuning / Sim Data resources (0x545ac67a
      and 0x62e94d38)"; we retrieved no complete Sims 4 type table, so verify the type of the resource you
      are actually editing rather than trusting a remembered constant.
  - kind: file_path
    id: Mods/<YourMod>.package
    label: Where the finished package is installed.
steps:
  - step: Understand what an override is in this format
    detail: >-
      A .package is a DBPF archive: "Header first, individual files following with no filenames and a
      small file header area at the beginning of each followed by an index of all the files in the
      archive." Each index entry carries a ResourceType, ResourceGroup, InstanceHi and InstanceLo. There
      is no name, no manifest and no priority. An override is therefore nothing more than shipping a
      resource under a key the game already uses.
  - step: Extract the tuning you intend to change
    detail: >-
      Pull the resource out of the game's own packages with a package editor. Sims 4 Studio is the tool the
      community's tuning tutorials are written around - SimsWiki's XML Tuning list is almost entirely "...
      using Sims 4 Studio" entries. We could not retrieve sims4studio.com at all (HTTP 406 to our fetcher),
      so we describe its role at second hand only. s4pe is the open-source alternative we did retrieve, and
      @s4tk/models is an MIT-licensed library for "reading and writing Sims 4 package files and the
      resources they contain" if you want to script the work.
  - step: Record the exact key before you change anything
    detail: >-
      Write the Type:Group:Instance triple down. It is the only durable identifier of what your mod
      overrides, it is what another creator needs in order to check compatibility with you, and it is what
      our inspector will report back from your finished package.
  - step: Change the minimum number of values
    detail: >-
      An override replaces the whole resource, not the one value you cared about - so every other value in
      that tuning is now yours to keep in step with the game. The fewer resources you override, the smaller
      your exposure to the next patch and to other mods.
  - step: Save the edited resource into a new package under the same key
    detail: >-
      Build a package containing your edited resource, keyed identically to the game's. Give the package
      file a name that identifies you and the mod; the filename does nothing mechanically but it is the only
      thing a player sees in their Mods folder.
    file: Mods/<YourMod>.package
  - step: Write down what you overrode, on the mod page
    detail: >-
      Mod The Sims requires exactly this of uploaders: state the Mod Type - "Is it a resource override (aka
      default replacement), recategorizer or hider, slider, XML tuning, or a full script mod?" - and for
      overrides, "make sure to clearly state what you've overriden", plus "list out any known conflicts" and
      the "Built with Game Version". That text is the only conflict-detection mechanism a player has.
  - step: Prefer flavours over a single opinionated value
    detail: >-
      MTS's guidance for tuning mods is to ship variants - "don't just double a value, but offer it half,
      tripled, and none" - which also reduces how often a player must pick between your mod and someone
      else's.
interactions:
  - >-
    Two packages shipping the same resource key are the canonical Sims 4 conflict: both claim the same game
    resource. We retrieved no source stating which one the running game resolves to, so this pack records
    the collision and deliberately does not name a winner.
  - >-
    A tuning override and a Python script mod can both change the same behaviour by different routes. The
    package override is visible in the artifact as a resource key; the script route is not visible at all.
  - >-
    A game patch that changes the overridden tuning leaves your copy in place, silently reverting whatever
    the patch changed for players who have your mod installed.
build:
  produces: A single .package file.
  requires_network: false
  requires_game_install: true
validation:
  - method: Read back the exact resource keys your finished package claims.
    command: .venv/bin/modcheck inspect dist/<YourMod>.package --game sims4 --json
    modcheck_check: modcheck.inspect.sims4.inspect_package:resource_keys
    limits: >-
      This parses the DBPF header and resource index and gives you every Type:Group:Instance key plus a count
      per type. It does NOT decode the payloads, so it cannot show you the tuning XML, cannot tell you which
      game tuning an instance corresponds to, and cannot tell you whether your edit is correct. It also does
      not know about any other mod - to find a collision you must inspect the other package too and intersect
      the key lists yourself.
  - method: Compare the key list against the keys you intended to override.
    command: .venv/bin/modcheck inspect dist/<YourMod>.package --game sims4 --json > keys.json
    limits: >-
      Catches the common accident of a package carrying extra resources you did not mean to ship. It cannot
      catch the opposite error - a key that is present and intended but simply wrong.
  - method: Load the game with only this mod installed and confirm the changed behaviour.
    command: "<start The Sims 4 with a Mods folder containing only this package>"
    limits: >-
      Requires the retail game, which we do not have, so this was never run. It is the only check that
      establishes the override took effect, and even then only against that one game patch.
acceptance:
  - The package contains only the resources the mod intends to override; a key listing confirms it.
  - Every overridden Type:Group:Instance key is written down and published on the mod page.
  - The mod page states the base game version the mod was built with.
  - Known conflicting mod types are listed, because no tool computes them for a player.
  - Where the change is a single tuned value, variants are offered rather than one imposed value.
