id: sims4-cas-content-package
game: sims4
title: Ship new CAS or build/buy content as an additive .package
category: add_content
intent: >-
  A creator ends up with a .package that ADDS a new Create-A-Sim or build/buy item under resource keys
  nobody else owns, rather than replacing an existing one - so the content appears alongside the game's
  own items and cannot silently collide with another creator's work.
applies_to:
  game_versions: "must be stated per release; Mod The Sims requires uploaders to state the base game version the mod was built with"
  loader: sims4_package
  toolchain:
    - sims4studio
    - s4pe
    - s4tk_models
  platforms:
    - windows
    - macos
inputs:
  - The mesh and textures for the item
  - A base game item to clone as the starting point for the resource set
extension_points:
  - kind: asset
    id: "<mesh resource key>"
    container: <YourMod>.package
    label: The geometry resource for the new item.
  - kind: asset
    id: "<texture resource key>"
    container: <YourMod>.package
    label: The DDS texture resource(s).
  - kind: tuning
    id: "<catalogue/CAS part resource key>"
    container: <YourMod>.package
    label: >-
      The resource that makes the item appear in the catalogue or in CAS. Whether this is additive or an
      override is decided entirely by whether its key is new.
  - kind: file_path
    id: Mods/<YourMod>.package
    label: Where the finished package is installed.
steps:
  - step: Decide additive versus override before you start
    detail: >-
      There is no flag for this. In a DBPF package the only difference between "new content" and "a default
      replacement" is whether the resource keys you ship are keys the game already uses. Mod The Sims makes
      creators declare which one they built: "Is it a resource override (aka default replacement),
      recategorizer or hider, slider, XML tuning, or a full script mod?"
  - step: Clone an existing item rather than authoring a resource set from scratch
    detail: >-
      The community CAS and object workflows are built around cloning a base-game item in a package editor
      and then replacing its mesh and textures, which is why SimsWiki's CAS section is a list of mesh and
      texture tooling (Blender, Milkshape, paint programs and DDS plug-ins) rather than a file-format
      reference. The cloning step is what gives you a consistent, complete set of resources; the tool then
      assigns new keys for them.
  - step: Confirm the clone produced NEW keys
    detail: >-
      This is the step that decides whether your mod is additive. After building the package, list its
      resource keys and check that none of them is a key the base game already uses. A clone that kept the
      original instance ids is a default replacement, whatever you meant it to be.
  - step: Prepare the mesh and textures
    detail: >-
      Blender is the editor SimsWiki describes as "a free 3D editor that is well supported within the Sims
      community ... the most commonly used editor for making things for Sims 4". Textures are DDS, which is
      why the same page spends its space on DDS plug-ins and converters for GIMP, Photoshop and Paint.NET.
  - step: Build the package
    detail: >-
      Save the resource set into one .package. Sims 4 Studio is the tool the community tutorials assume;
      s4pe is the open-source editor we did retrieve (it states .NET 4.0 and Visual Studio are required);
      and @s4tk/models is an MIT-licensed library if you would rather generate packages programmatically.
    file: Mods/<YourMod>.package
  - step: Name the file for humans
    detail: >-
      The filename has no mechanical meaning - a DBPF archive stores "individual files following with no
      filenames" - but it is all a player sees in their Mods folder when they are trying to work out which
      mod to remove.
  - step: Publish the key list and the game version
    detail: >-
      State the base game version you built against, and, if any resource key you ship is an existing game
      key, say so explicitly and list it, per MTS's override rule.
interactions:
  - >-
    Additive content and override content behave completely differently under collision. Two additive
    packages are independent unless they happen to share a generated key; two overrides of the same key are
    a direct conflict.
  - >-
    A key collision between two "new" items is possible when generated instance ids are not truly unique,
    and it is invisible in game - both items exist in the catalogue, but one resource is shadowed. A key
    listing of both packages is the only way to see it.
  - >-
    This recipe is the least well-sourced of the three in this pack. We hold the container format, the
    community's tooling landscape and the ecosystem's declaration rules; we do NOT hold a resource-type
    table for Sims 4, so we cannot tell you which type ids a CAS part or a catalogue entry actually uses.
    That gap is recorded in pack.yaml.
build:
  produces: A single .package file containing the new item's resources.
  requires_network: false
  requires_game_install: true
validation:
  - method: List the resource keys the package claims and check none belongs to the base game.
    command: .venv/bin/modcheck inspect dist/<YourMod>.package --game sims4 --json
    modcheck_check: modcheck.inspect.sims4.inspect_package:resource_keys
    limits: >-
      Gives you every Type:Group:Instance key and a count per type, which is exactly what this check needs -
      but it does not know which keys the base game uses, so you must compare against a key list you obtain
      yourself. It does not decode payloads, so it cannot confirm the mesh or textures are valid, and it
      cannot confirm the item will appear in the right catalogue category.
  - method: Check the package's resource type distribution against a known-good clone of the same item kind.
    command: .venv/bin/modcheck inspect reference/<KnownGoodItem>.package --game sims4 --json
    limits: >-
      Comparing type counts catches a missing resource class (for instance a package with geometry but no
      catalogue entry). It proves nothing about content, and a matching distribution can still be wrong.
  - method: Install the package alone and find the item in game.
    command: "<start The Sims 4 with a Mods folder containing only this package and look for the item in CAS or build mode>"
    limits: >-
      Requires the retail game, which we do not have, so this was never run. It is the only check that
      establishes the item exists, is categorised correctly and renders.
acceptance:
  - A key listing of the finished package shows only keys the mod owns, and none that belong to the base game - or, if it does override, the mod page says so and lists them.
  - The package's resource type distribution matches that of a known-good item of the same kind.
  - Textures are DDS and the mesh was exported from a tool the ecosystem supports.
  - The mod page states the base game version the item was built against.
references:
  - source: simswiki_ts4_cas_tutorials
    evidence_class: declared
    locator: "3D Modeling Programs"
    quote: "Blender 3D is a free 3D editor that is well supported within the Sims community. It is extremely powerful and is the most commonly used editor for making things for Sims 4."
  - source: simswiki_ts4_cas_tutorials
    evidence_class: declared
    locator: "DDS Plug-Ins and Converters"
    quote: "In order to get your textures to open in your paint program, you will need to install the proper DDS plugin for it or convert them."
  - source: simswiki_dbpf_general
    evidence_class: declared
    locator: "Format > Overview"
    quote: "Header first, individual files following with no filenames and a small file header area at the beginning of each followed by an index of all the files in the archive."
  - source: mts_sims4_game_mod_guidelines
    evidence_class: declared
    locator: "Information > Mod Type"
    quote: "State clearly what kinda mod your mod is. Is it a resource override (aka default replacement), recategorizer or hider, slider, XML tuning, or a full script mod?"
  - source: mts_sims4_game_mod_guidelines
    evidence_class: declared
    locator: "Information > Built with Game Version"
    quote: "Please state the related base game version you built your mod with in your upload post! People need to know if they can run your mod in their game."
  - source: s4pe_repo_readme
    evidence_class: declared
    locator: header
    quote: "s4pe, based on the s4pi interface library, is an editing tool for the .package format used with [The Sims 4]."
  - source: s4tk_models_readme
    evidence_class: declared
    locator: Overview
    quote: "This project contains the models, enums, and other structures required for reading and writing Sims 4 package files and the resources they contain."
  - source: s4studio_python_scripting_tutorial
    evidence_class: unresolved
    locator: sims4studio.com
    quote: ""
verification_state: documented
verification_note: >-
  Written from sources only, and more thinly sourced than the other two Sims 4 recipes: we hold the
  container format and the tooling landscape but no Sims 4 resource-type table, so this recipe describes
  the additive-versus-override decision and how to check it, not the specific resources a CAS part needs.
