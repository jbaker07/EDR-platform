    CC0 1.0, verified by fetching the repository's LICENSE file, so reuse is
    unrestricted. ModCheck reads this repository's gradle.properties and
    build.gradle at scaffold time to resolve versions and build style rather
    than copying the template, so generated projects track upstream.
