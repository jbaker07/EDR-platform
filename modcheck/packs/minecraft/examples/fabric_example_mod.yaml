id: fabric_example_mod
game: minecraft
title: FabricMC/fabric-example-mod
url: https://github.com/FabricMC/fabric-example-mod
kind: template
demonstrates:
  - the minimal file layout of a Fabric mod project
  - which toolchain versions go together for a given Minecraft version
  - how the build script changes between obfuscated and non-obfuscated Minecraft
license: CC0-1.0
reuse:
