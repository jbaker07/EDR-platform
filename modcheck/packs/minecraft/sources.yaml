  notes: 'Resolved locally at /root/.gradle/caches/modules-2/files-2.1/net.fabricmc.fabric-api/fabric-game-rule-api-v1/4.0.10+3434d6d95d/3f73b9e94995f6f8a0d38955b98b67ac8d6bb089/fabric-game-rule-api-v1-4.0.10+3434d6d95d.jar.
    Read to settle a named missing fact: which Fabric mechanism lets a server operator change a value
    without editing the mod. The answer is a custom gamerule, built with GameRuleBuilder and registered
    by buildAndRegister(Identifier). Notably, the GameRuleRegistry and GameRuleFactory classes that published
    tutorials use DO NOT EXIST in this version -- the jar contains only FabricGameRuleTypeVisitor, GameRuleBuilder
    and GameRuleEvents in its api package. Code written from those tutorials would not compile.'
