  notes: 'Resolved locally at /root/.gradle/caches/fabric-loom/26.3/minecraft-merged.jar (version 26.3).
    The artifact our Fabric builds compile against. Read ONLY for exact type and method signatures via
    javap, which is the JDK''s own class reader. Minecraft 26.3 ships non-obfuscated, so signatures are
