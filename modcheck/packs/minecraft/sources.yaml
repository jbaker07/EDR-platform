  notes: 'Resolved locally at /root/.gradle/caches/modules-2/files-2.1/net.fabricmc.fabric-api/fabric-networking-api-v1/6.3.8+fcdff87f5d/1487018aa4c0cc74d0e32b89c5b2da9b1c00ebb8/fabric-networking-api-v1-6.3.8+fcdff87f5d.jar.
    Read to settle the missing fact the composition check named: what carries a server-side value to the
    client. The answer is a CustomPacketPayload registered with PayloadTypeRegistry.playS2C() and sent
    with ServerPlayNetworking.send(ServerPlayer, CustomPacketPayload), with PlayerLookup.tracking() to
    choose recipients. This is the modern payload API; the older PacketByteBuf-and-Identifier send() overloads
    are not what this version exposes.'
