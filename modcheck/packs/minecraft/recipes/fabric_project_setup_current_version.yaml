id: fabric_project_setup_current_version
game: minecraft
title: Start a Fabric mod project for the current Minecraft release
category: tooling
intent: >-
  A creator ends up with a Fabric mod project that compiles and packages a jar
  against the current Minecraft release, with every toolchain version taken from
  upstream rather than from memory.
applies_to:
  game_versions: ">=26.1"
  loader: fabric
  loader_versions: ">=0.19.5"
  toolchain: ["Gradle 9.5.1", "JDK 25", "Fabric Loom 1.17-SNAPSHOT"]
  platforms: [Linux, macOS, Windows]
inputs:
  - a mod id matching ^[a-z][a-z0-9-_]{1,63}$
  - a Java package name
dependencies:
  - id: fabric-loader
    kind: loader
    versions: ">=0.19.5"
  - id: jdk
    kind: runtime
    versions: ">=25"
    required: true
template:
  name: FabricMC/fabric-example-mod
  url: https://github.com/FabricMC/fabric-example-mod
  license: CC0-1.0
  local_generator: fabric
extension_points:
  - kind: file_path
    id: src/main/resources/fabric.mod.json
    label: loader manifest
  - kind: method
    id: onInitialize
    signature: "void onInitialize()"
    container: net.fabricmc.api.ModInitializer
    label: main entrypoint
steps:
  - step: Generate the project
    detail: >-
      Versions are resolved at generation time from the upstream example mod's
      gradle.properties for the target Minecraft version, so the combination is
      one upstream actually publishes.
    command: modcheck scaffold <modid> --game minecraft --loader fabric
  - step: Check the generated build script matches the era
    detail: >-
      Minecraft stopped shipping obfuscated during the 26.x line. For those
      versions the build declares no mappings and uses plain `implementation`
      for mod dependencies. A build script copied from a 1.21.x project fails
      with "Cannot use Mojang mappings in a non-obfuscated environment".
    file: build.gradle
  - step: Build
    detail: Runs the project's own Gradle build; requires explicit authorisation
      because a build script is untrusted code.
    command: modcheck build <project> --allow-execute
build:
  commands: ["gradle build"]
  produces: build/libs/<modid>-<version>.jar
  requires_network: true
  requires_game_install: false
validation:
  - method: The project's own Gradle build
    command: gradle build --no-daemon --console=plain
    limits: >-
      Establishes that the project compiles and packages. Establishes nothing
      about whether the mod loads, behaves correctly, or is compatible with any
      other mod.
  - method: Read the built jar back with ModCheck
    modcheck_check: inspect
    limits: >-
      Confirms the jar declares the mod id, version and dependencies expected.
      Does not analyse bytecode.
acceptance:
  - gradle build exits 0
  - a jar appears in build/libs
  - "`modcheck inspect` reports the intended mod id and the dependency set from
    fabric.mod.json"
references:
  - source: fabric_example_mod_versions_26_3
    evidence_class: extracted
    locator: gradle.properties
    quote: "minecraft_version=26.3"
  - source: fabric_example_mod_build_26_3
    evidence_class: extracted
    locator: dependencies block
    quote: 'implementation "net.fabricmc:fabric-loader:${project.loader_version}"'
  - source: fabric_example_mod_build_1_21
    evidence_class: extracted
    locator: dependencies block
    quote: "mappings loom.officialMojangMappings()"
  - source: mojang_version_manifest
    evidence_class: extracted
    locator: latest.release
  - source: fabric_mod_json_spec
    evidence_class: declared
    locator: Mandatory fields
    quote: "id : Contains the mod identifier - a string value matching the ^[a-z][a-z0-9-_]{1,63}$ pattern."
verification_state: build_tested
verification_note: >-
  Generated and built in this environment on 2026-09-19 with Gradle 9.5.1 and
  JDK 25 against Minecraft 26.3. See attestations/fabric_project_setup_current_version.json
  for the toolchain and the artifact hashes.
provenance:
  added: '2026-09-19'
  last_verified: '2026-09-19'
  verified_against: [fabric_example_mod_versions_26_3, mojang_version_manifest]
