id: fabric_extend_behaviour_with_mixin
game: minecraft
title: Extend an existing game behaviour with a mixin instead of replacing it
category: extend_system
intent: >-
  A creator adds behaviour to an existing Minecraft method in a way that still
  allows other mods to add theirs to the same method, rather than taking the
  method over.
applies_to:
  game_versions: ">=26.1"
  loader: fabric
  loader_versions: ">=0.19.5"
  toolchain: ["Gradle 9.5.1", "JDK 25"]
inputs:
  - an existing Fabric project with a mixin config registered in fabric.mod.json
  - the fully qualified name of the class to mix into
  - the name of the method to inject at
dependencies:
  - id: fabric-loader
    kind: loader
    versions: ">=0.19.5"
extension_points:
  - kind: method
    id: "<target method>"
    container: "<target class>"
    label: injection point
  - kind: config_key
    id: mixins
    container: "<modid>.mixins.json"
    label: registered mixin class list
steps:
  - step: Generate the mixin and its registration
    detail: >-
      Produces a diff adding the mixin class and registering it in the mixin
      config. The registered class list is exactly what ModCheck later reads
      back out of the built jar, so this is the mod's declared interaction
      surface.
    command: modcheck apply fabric.add_mixin <project> --set target_class=<fqcn>
  - step: Name the real target method
    detail: >-
      The generated @Inject carries a placeholder method name. Mixin resolves
      targets at load time, and the build fails while the name does not match a
      real method, which is the check working rather than a problem.
  - step: Choose the operation deliberately
    detail: >-
      An @Inject at HEAD or TAIL without cancelling is additive - several mods
      can inject into the same method and all run. A cancelling injection or an
      @Overwrite replaces behaviour, and two mods doing that to the same method
      do genuinely conflict. Prefer the additive form unless replacement is the
      point.
  - step: Build
    detail: >-
      Mixin resolves its targets during the build, so a build that succeeds has
      confirmed the target class and method exist for this game version.
    command: modcheck build <project> --allow-execute
interactions:
  - Two mods injecting additively into the same method is an overlap, not a
    conflict; both run, in an order the loader decides.
  - Two mods with @Overwrite or a cancelling injection on the same method is a
    real conflict, because only one result survives.
  - ModCheck extracts the registered mixin class list from a jar but does not
    read bytecode, so it cannot tell which of these two cases a jar is in.
build:
  commands: ["gradle build"]
  produces: build/libs/<modid>-<version>.jar
  requires_network: true
  requires_game_install: false
validation:
  - method: The project's own Gradle build
    command: gradle build --no-daemon --console=plain
    limits: >-
      A mixin that names a method which does not exist fails the build, so a
      successful build establishes the target resolves. It establishes nothing
      about whether the injected behaviour is correct, nor about interaction
      with other mods mixing into the same method.
  - method: Read the registered mixin classes back out of the jar
    modcheck_check: inspect
    limits: >-
      Reports which classes the jar registers as mixins. Does not report which
      methods they rewrite or with what operation, because bytecode is not
      analysed.
acceptance:
  - gradle build exits 0
  - "`modcheck inspect` lists the new mixin class under mixin_classes"
  - the injection is additive unless replacement was the deliberate intent
references:
  - source: fabric_mod_json_spec
    evidence_class: declared
    locator: mixins
  - source: fabric_docs_home
    evidence_class: declared
    locator: developer documentation index
verification_state: documented
verification_note: >-
  The generator and its registration are covered by tests, but no build of a
  mixin against a real Minecraft class was run here: that needs a target method
  name for a specific game version, which we have not verified. Treated as
  documented, not build-tested.
provenance:
  added: '2026-09-19'
  last_verified: '2026-09-19'
  verified_against: [fabric_mod_json_spec]
