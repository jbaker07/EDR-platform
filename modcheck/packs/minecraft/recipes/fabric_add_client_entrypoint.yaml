id: fabric_add_client_entrypoint
game: minecraft
title: Add client-only behaviour with a client entrypoint
category: event_behavior
intent: >-
  A creator adds behaviour that runs only on the game client, wired through a
  second entrypoint, without making the whole mod client-only.
applies_to:
  game_versions: ">=26.1"
  loader: fabric
  loader_versions: ">=0.19.5"
  toolchain: ["Gradle 9.5.1", "JDK 25"]
inputs:
  - an existing Fabric project with a declared main entrypoint
extension_points:
  - kind: config_key
    id: entrypoints.client
    container: fabric.mod.json
    label: client entrypoint list
  - kind: method
    id: onInitializeClient
    signature: "void onInitializeClient()"
    container: net.fabricmc.api.ClientModInitializer
steps:
  - step: Generate the change
    detail: >-
      Produces a unified diff adding the entrypoint class and registering it in
      fabric.mod.json. Nothing is written until --write is passed, so the change
      is reviewed first.
    command: modcheck apply fabric.add_entrypoint <project> --set class_name=<Name> --set kind=client
  - step: Review the diff, then apply it
    detail: "The diff touches exactly two files: the new class and the manifest."
    command: modcheck apply fabric.add_entrypoint <project> --set class_name=<Name> --set kind=client --write
  - step: Build
    detail: Confirms the new class compiles against the loader API.
    command: modcheck build <project> --allow-execute
  - step: Consider the environment declaration
    detail: >-
      A client entrypoint runs only on the client, but the mod's `environment`
      field still governs where the mod is loaded at all. Leave it as "*" unless
      the mod genuinely cannot load on a server.
    file: src/main/resources/fabric.mod.json
interactions:
  - Adding an entrypoint does not change any other mod's behaviour; entrypoints
    are additive and the loader calls each mod's own.
  - Assumes the project declares a main entrypoint, which is how the package is
    inferred.
build:
  commands: ["gradle build"]
  produces: build/libs/<modid>-<version>.jar
  requires_network: true
  requires_game_install: false
validation:
  - method: The project's own Gradle build
    command: gradle build --no-daemon --console=plain
    limits: >-
      Establishes the class compiles and the jar packages. Does not establish
      that the entrypoint runs, since that needs the game.
  - method: Read the entrypoint back out of the built jar
    modcheck_check: inspect
    limits: >-
      Confirms the manifest registers the client entrypoint. Does not establish
      what the entrypoint does.
acceptance:
  - the diff touches only the new class and fabric.mod.json
  - gradle build exits 0
  - "`modcheck inspect` reports a `client` key in entrypoints"
references:
  - source: fabric_mod_json_spec
    evidence_class: declared
    locator: entrypoints
  - source: fabric_docs_home
    evidence_class: declared
    locator: developer documentation index
verification_state: build_tested
verification_note: >-
  Applied to a generated project and built in this environment on 2026-09-19
  with Gradle 9.5.1 and JDK 25 against Minecraft 26.3. See
  attestations/fabric_add_client_entrypoint.json.
provenance:
  added: '2026-09-19'
  last_verified: '2026-09-19'
  verified_against: [fabric_mod_json_spec]
