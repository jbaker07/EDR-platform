  content_sha256: 73d4b3f2a964bc69b93c2c8b88a35728b7ce265e3c8753e84a95061d4f0231ea
  content_type: text/plain
  upstream_revision: W/"5f853d83a10eaeace21dfa2a0a62326c3b9a74f1c722bc7ac1dd2be93538eb84
  evidence_path: c0/c0e5beff2fd31d174baa0d290e61e63c323d432ca334d10d13bff2724019a673.cs
  publisher: Pathoschild
  license: LGPL-3.0
  notes: 'UseCaseInsensitivePaths defaults to true on Android and Linux only; elsewhere SMAPI uses MinimalFileLookup.
    Read to settle a real question about the pinned Bear Mounts pack: its ConfigSchema declares WhichBear
    values in lower case (brown, black, panda, polar, skeleton) while the shipped assets are capitalised
    (BearMount_Brown.png), so {{WhichBear}} expands to a FromFile whose case does not match any file.
    That is NOT a defect on any supported platform: Windows (NTFS) and macOS (APFS, case-insensitive by
    default) resolve it in the filesystem, and on Linux and Android SMAPI resolves it itself. Recorded
    so nobody ''fixes'' the published pack''s filenames while assembling a runtime install and then tests
    something the author never shipped.'
