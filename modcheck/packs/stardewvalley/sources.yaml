  license: LGPL-3.0
  notes: 'The lookup SMAPI uses when UseCaseInsensitivePaths is on: it caches every relative path under
    the content pack root in both path and asset-name form and matches case-insensitively. This is what
    makes a content pack''s FromFile resolve despite a case mismatch, and it is why a static check for
    ''missing FromFile'' must be case-insensitive rather than reporting a problem that does not occur.'
