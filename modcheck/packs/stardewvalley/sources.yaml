  notes: 'ApplyPatchesToAsset is the code that actually resolves competing Load patches. It confirmed
    two things our analyzer asserts: several Exclusive loaders cause the selected loader to be discarded
    entirely, so NEITHER applies, and the exact error text a player is shown. Edits are not discarded
    with it, which is why a suppressed Load still leaves the other pack''s edits composing onto the game''s
    original asset.'
