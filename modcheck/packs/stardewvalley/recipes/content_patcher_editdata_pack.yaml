id: sdv-content-patcher-editdata-pack
game: stardewvalley
title: Add or change data entries with a Content Patcher EditData pack
category: content_pack
intent: >-
  A JSON-only mod folder that SMAPI loads as a Content Patcher content pack and that
  adds or edits entries in a data asset (for example Data/Objects) without replacing
  the asset, so that any number of other packs can edit the same asset alongside it.
applies_to:
  game_versions: '>=1.6.14'
  loader: content_patcher
  loader_versions: 'content.json Format 2.9.0 (Content Patcher 2.9.x, which requires SMAPI >=4.4.0)'
  toolchain:
  - smapi_json_schemas
  platforms:
  - windows
  - linux
  - macos
inputs:
- a unique mod id in the form Username.ModName
- the exact asset name to edit, without the "Content" prefix, without a language code and without a file extension
- any images or other files the pack loads, conventionally under assets/
dependencies:
- id: Pathoschild.ContentPatcher
  kind: framework
  versions: '>=2.9.0'
  required: true
- id: SMAPI
  kind: loader
  versions: '>=4.4.0'
  required: true
template:
  name: Content Patcher author guide starter content pack
  url: https://raw.githubusercontent.com/Pathoschild/StardewMods/develop/ContentPatcher/docs/author-guide.md
  license: MIT
extension_points:
- kind: file_path
  id: manifest.json
  label: SMAPI manifest; ContentPackFor makes this a Content Patcher pack rather than a code mod
- kind: file_path
  id: content.json
  label: the Changes list Content Patcher reads
- kind: asset
  id: Data/Objects
  container: content.json
  label: example data asset edited by the EditData action
- kind: config_key
  id: Changes[].Action
  container: content.json
  field: EditData
steps:
- step: Create the mod folder
  detail: >-
    Create an empty folder under Mods/ named "[CP] YourModName". The author guide's
    getting-started section uses exactly this naming convention and shows the folder
    holding content.json, manifest.json and an assets/ subfolder.
  file: Mods/[CP] YourModName/
- step: Write manifest.json with ContentPackFor
  detail: >-
    Name, Author, Version, Description, UniqueID and UpdateKeys are the fields the
    author guide's starter manifest sets. ContentPackFor with UniqueID
    "Pathoschild.ContentPatcher" is what makes SMAPI hand the folder to Content Patcher;
    the manifest schema records that ContentPackFor is mutually exclusive with EntryDll.
    UniqueID must be your own id, not the one under ContentPackFor.
  file: manifest.json
  code: |
    {
        "Name": "Your Mod Name",
        "Author": "Your Name",
        "Version": "1.0.0",
        "Description": "One or two sentences about the mod.",
        "UniqueID": "YourName.YourModName",
        "UpdateKeys": [],
        "ContentPackFor": {
            "UniqueID": "Pathoschild.ContentPatcher",
            "MinimumVersion": "2.9.0"
        }
    }
- step: Write content.json with a Format and a Changes list
  detail: >-
    Format is the Content Patcher version the pack is written for; the author guide says
    to always use the latest format version, which it gives as 2.9.0. Each entry in
    Changes is one patch.
  file: content.json
- step: Use EditData rather than Load for data assets
  detail: >-
    EditData changes the data read from a data asset and supports adding, editing or
    deleting entries, reordering list entries, and editing individual fields. The author
    guide states that any number of content packs can edit the same asset with EditData,
    which is why it is the composable choice; Load replaces the whole asset and each
    asset can only be replaced by one patch.
  file: content.json
  code: |
    {
        "Format": "2.9.0",
        "Changes": [
            {
                "Action": "EditData",
                "Target": "Data/Objects",
                "Entries": {
                    "YourName.YourModName_ExampleItem": { }
                },
                "LogName": "add example item"
            }
        ]
    }
- step: Add conditions only where the change must be conditional
  detail: >-
    An optional "When" object restricts a patch to matching conditions; the author guide
    documents tokens and conditions as a separate feature and its example summary output
    shows patches reported as not applied because "conditions don't match". Every token
    value is resolved at runtime, so a condition cannot be checked before the game runs.
  file: content.json
- step: Validate the JSON files against the published schemas
  detail: >-
    The troubleshooting guide describes validating content.json and manifest.json at
    smapi.io/json, or against the schema files directly in an editor that supports JSON
    Schema. It states explicitly that the validator will not detect all issues.
interactions:
- Any number of packs may EditData the same asset; each patch sees the result of the previous one, so a later pack can silently undo an earlier pack's field edit without either pack being wrong.
- Across content packs the apply order is SMAPI's load order. To be applied after a specific other pack, declare that pack as a manifest dependency.
- Action Load is resolved before every Edit* action for the same asset, regardless of pack order.
- Entry keys are a shared namespace; prefixing new keys with your UniqueID is what keeps two packs from colliding on the same key.
build:
  produces: the mod folder itself; a Content Patcher content pack has no compile step
  requires_network: false
  requires_game_install: false
validation:
- method: Validate manifest.json and content.json against the SMAPI-published JSON Schemas
  command: 'python -c "import json,sys; json.load(open(sys.argv[1]))" content.json'
  limits: >-
    Parsing only proves the file is well-formed JSON. It does not check the file against
    the schema, does not prove the Target names an asset that exists in the installed
    game version, does not resolve tokens, and the Content Patcher troubleshooting guide
    itself warns that even full schema validation "won't detect all issues".
- method: Inspect the packaged pack with ModCheck and read back the extracted targets
  command: .venv/bin/modcheck inspect "Mods/[CP] YourModName" --json
  limits: >-
    This reports the declared manifest fields and the extracted Action/Target/When list
    for each patch. It does not evaluate conditions, does not compare your targets
    against other installed packs, does not read Load Priority, and says nothing about
    whether the game will render the result correctly.
- method: In-game "patch summary" console command
  limits: >-
    Only possible inside a running game with Content Patcher loaded. It was NOT run for
    this recipe; the recipe's verification_state is documented for that reason.
acceptance:
- SMAPI's console lists the pack as loaded with your UniqueID and no manifest errors.
- '"patch summary" shows the patch with loaded, conditions and applied all set, and lists the target asset under "Current changes".'
- 'modcheck inspect reports mod_type content_pack, a dependency edge on Pathoschild.ContentPatcher declared by ContentPackFor, and your asset in the extracted targets list.'
references:
- source: content_patcher_author_guide
  evidence_class: declared
  locator: 'sections "What does a content pack look like?", "Create the content pack", "Format version", "Actions"'
  quote: >-
    A content pack is just a folder with two text files in it: `manifest.json` (which has info like
    your mod name) and `content.json` (which tells Content Patcher what you want to change).
- source: content_patcher_author_guide
  evidence_class: declared
  locator: 'section "Actions", EditData row'
  quote: >-
    `EditData` changes the data read from a data asset. This supports simple lookup assets like
    `Data/Achievements`, or full data model assets like `Data/Objects`. Any number of content packs
    can edit the same asset.
- source: content_patcher_author_guide
  evidence_class: declared
  locator: 'FAQ "How do multiple patches interact?"'
  quote: >-
    Any number of patches can be applied to the same asset. `Action: Load` always happens before other
    action types, but otherwise each patch is applied sequentially.
- source: content_patcher_load
  evidence_class: declared
  locator: section "Caveats"
  quote: >-
    `Load` is very simple, but each asset can only be replaced by one patch, so your content pack won't
    be compatible with other content packs that `Load` the same one.
- source: smapi_manifest_json_schema
  evidence_class: extracted
  locator: properties.EntryDll.description and properties.ContentPackFor
  quote: 'The DLL filename SMAPI should load for this mod. Mutually exclusive with ContentPackFor.'
- source: content_patcher_json_schema
  evidence_class: extracted
  locator: root schema for content.json
- source: content_patcher_troubleshooting
  evidence_class: declared
  locator: section "Schema validator"
  quote: >-
    You can validate your `content.json` and `manifest.json` automatically to detect some common issues.
    (You should still test your content pack in-game before releasing it, since the validator won't
    detect all issues.)
- source: content_patcher_release_notes
  evidence_class: declared
  locator: heading "## 2.9.1"
  quote: Released 14 March 2026 for SMAPI 4.4.0 or later.
verification_state: documented
verification_note: >-
  Written from the fetched Content Patcher author guide, its Load-action page, the two
  SMAPI-published JSON Schemas and the Content Patcher release notes. No pack was built,
  no game was launched, and "patch summary" was never run. The example Entries object is
  deliberately empty: no source in this pack documents the field layout of a Data/Objects
  entry for any specific game version, so filling it in would be invention.
provenance:
  added: '2026-09-19'
  last_verified: '2026-09-19'
  verified_against:
  - content_patcher_author_guide
  - content_patcher_load
  - content_patcher_json_schema
  - smapi_manifest_json_schema
