id: sdv-example-modbuildconfig
game: stardewvalley
title: Pathoschild.Stardew.ModBuildConfig (SMAPI mod build package)
url: https://www.nuget.org/packages/Pathoschild.Stardew.ModBuildConfig
kind: tool
demonstrates:
- the canonical C# project setup for a SMAPI mod, replacing hand-written assembly references
- automatic game-path detection, with a stardewvalley.targets override when it fails
- install-on-build into the game's Mods folder and a release zip written to bin/
- '%ProjectVersion% manifest token substitution so the version is set once in the .csproj'
- bundling content packs with a main C# mod through a ContentPacks item group
license: MIT
reuse:
  integration: subprocess
  constraints: >-
    The NuGet registration entry gives licenseExpression "MIT". It would be consumed as an
    MSBuild dependency of a generated project, not vendored into this repository. We have
    NOT executed it: there is no .NET SDK and no Stardew Valley installation here, and
    ModBuildConfig requires a game installation to resolve references.
