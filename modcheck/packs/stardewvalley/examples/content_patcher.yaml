id: sdv-example-content-patcher
game: stardewvalley
title: Content Patcher (Pathoschild/StardewMods)
url: https://raw.githubusercontent.com/Pathoschild/StardewMods/develop/ContentPatcher/docs/author-guide.md
kind: library
demonstrates:
- the content-pack contract almost every JSON-only Stardew mod targets (manifest.json with ContentPackFor plus content.json)
- asset-level actions - Load, EditData, EditImage, EditMap - and the composition rules between them
- a token and condition language whose values only resolve at runtime
- Priority as the explicit tie-break for two patches loading the same asset
- an in-game troubleshooting surface (patch summary, update, reload, export, parse, dump, invalidate)
license: MIT
reuse:
  integration: reference_only
  constraints: >-
    The repository LICENSE is the MIT licence, "Copyright 2016-2025 Jesse
    Plamondon-Willard (Pathoschild)", so the documentation and code may be reused with the
    copyright and permission notice retained. We use it as a reference only: nothing from
    it is vendored into this repository, and the mod binary itself was never fetched.
