game: fallout4
name: Fallout 4
pack_version: 0.1.0
summary: >-
  Bethesda plugin ecosystem pack. What runs here: TES4-header inspection of .esp/.esm/.esl
  plugins, and LOOT-masterlist interaction analysis applied to a specific configuration.
  Creation Kit, FO4Edit, F4SE plugin builds and anything needing the retail game are documented
  only - none of them exist in this environment.

ecosystem:
  languages:
    - Papyrus (game scripting; .psc sources compiled to .pex)
    - C++ (F4SE plugin DLLs)
    - C# (Mutagen / Synthesis patchers)
  loaders:
    - id: bethesda_plugin
      name: Game plugin loading via plugins.txt
      manifest: plugins.txt
      source: libloadorder_load_order_mechanisms
    - id: f4se
      name: Fallout 4 Script Extender (f4se_loader.exe)
      manifest: f4se_1_11_240.dll beside Fallout4.exe
      versions: >-
        f4se.silverlock.org lists build 0.7.9 for runtime 1.11.240, 0.7.2 for 1.10.984, 0.6.23 for
        1.10.163 and 0.6.21 for Fallout 4 VR 1.2.72
      source: f4se_home
  artifact_formats:
    - .esm / .esp / .esl plugin files (TES4 header record followed by record groups)
    - .ba2 archives (Mutagen documents Bsa/Ba2 archive handling)
    - Papyrus .pex compiled scripts and .psc sources
    - F4SE plugin DLLs loaded by f4se_loader.exe
  composition: >-
    Rule of one, resolved by load order. libloadorder states: "The game can only apply one version
    of any one entry (this is known as the rule of one). Therefore, when more than one plugin
    changes the same entry, the load order is used to decide which plugin's changes are applied.
    Put simply, the last loaded plugin's changes are applied." - the exception being cell contents,
    which several plugins may add to. Load order is the order of plugins in plugins.txt; official
    Bethesda plugins (Fallout4.esm, DLC and Creation Club plugins) are hardcoded first, masters
    load before non-masters, and light plugins are moved to the FE slot at the end without that
    movement affecting conflict resolution. Up to 255 plugins may be active, plus up to 4096 active
    light plugins. Overriding a record is normal and usually benign: per xEdit, "To get a conflict
    you need to have the same FormID defined in at least 3 modules, a master, and 2 overrides",
    and a chain of overrides that carries earlier changes forward is not a conflict.
  platforms:
    - Windows (Steam and GOG; F4SE states the MS Store/Gamepass and Epic releases are not supported)

capabilities:
  docs_guidance:
    status: documented_only
    note: >-
      We hold fetched, hashed documentation for load order and plugin types (libloadorder),
      conflict detection and cleaning (xEdit), F4SE, Mutagen/Synthesis, Wrye Bash and a community
      setup guide including its light-plugin reference. We hold NO Fallout 4 Creation Kit
      documentation - creationkit.com serves a maintenance notice - and no record/field format
      specification, because UESP answers 403.
  project_setup:
    status: unsupported
    note: >-
      No scaffold generator exists for this game; modcheck scaffold covers other ecosystems only.
      Creators start from the upstream templates recorded in examples/.
  source_edit:
    status: documented_only
    note: >-
      Record edits happen in FO4Edit or the Creation Kit, neither of which runs here. We hold the
      procedures (copy as override into a patch plugin, batch ESL flagging with the SetESL script)
      but execute none of them and cannot write plugin records ourselves.
  package_inspection:
    status: supported
    note: >-
      Reads the TES4 header record only: master list (MAST), ESM/ESL/localised flags, author,
      description and HEDR counts (header version, record count, next object id). It does not read
      records or fields below the header, does not check whether the masters are installed or
      compatible, and does not look at .ba2 contents, scripts or precombine data. A clean
      inspection is not a clean plugin. Record-level facts come from the separate optional esplugin
      integration, not from this inspector.
    implemented_by:
      - src/modcheck/inspect/bethesda.py
    tests:
      - tests/test_inspect.py::test_bethesda_masters_and_light_flag
      - tests/test_inspect.py::test_bethesda_game_inferred_per_master
  dependency_analysis:
    status: partial
    note: >-
      Master dependency edges are extracted from the TES4 header and resolved against a supplied
      configuration, so a missing master is reported as dependency.missing. Limits: masters are
      matched by filename only; a MAST entry carries no version, so "present" never means
      "compatible"; the header's master order is not compared with the real load order; and on a
      configuration that is not a complete file listing an absence is not evidence (the report says
      so with coverage.partial_file_view).
    implemented_by:
      - src/modcheck/inspect/bethesda.py
      - src/modcheck/analyze/requirements.py
    tests:
      - tests/test_inspect.py::test_bethesda_game_inferred_per_master
      - tests/test_analysis.py::test_detects_missing_dependency
  interaction_analysis:
    status: supported
    note: >-
      Two separate things, with separate limits. (1) The LOOT-backed part covers LOOT-recorded rules
      only, applied to a specific configuration: requirements, incompatibilities, load-order rules,
      dirty/clean records matched by exact CRC, and messages whose conditions we can decide. It does
      NOT do record-level conflict detection, a plugin with no masterlist entry yields no findings,
      and the absence of a rule is not evidence of safety; undecidable conditions are reported as
      unresolved rather than assumed. (2) With --deep, an optional helper around esplugin reports
      which pairs of plugins touch at least one of the same records, plus override counts and
      light-plugin FormID validity. That is overlap, not conflict: the later plugin wins for a shared
      record and that is usually deliberate, the finding names no record and compares no field
      values, and when the helper is not built the report says record-level analysis was unavailable
      rather than quietly skipping it. Deciding whether an overlap is harmful is still xEdit's job.
    implemented_by:
      - src/modcheck/integrations/loot.py
      - src/modcheck/integrations/esplugin.py
    tests:
      - tests/test_loot.py::test_detects_a_real_recorded_incompatibility
      - tests/test_loot.py::test_detects_dirty_edits_only_for_the_exact_matching_copy
      - tests/test_loot.py::test_control_unrelated_plugins_produce_nothing
      - tests/test_esplugin.py::test_analysis_reports_overlap_as_a_place_to_look_not_a_conflict
  build_execution:
    status: blocked
    note: >-
      Nothing here builds a Fallout 4 artifact: plugins come out of the Creation Kit or FO4Edit,
      F4SE plugins need MSVC, Synthesis patchers need the .NET SDK.
    blocker: >-
      No Windows runtime, no MSVC, no .NET SDK (dotnet absent) and no Creation Kit or xEdit binary
      in this environment.
  runtime_testing:
    status: blocked
    note: >-
      Precombine/previs breakage, dialogue audio loss and script behaviour can only be established
      by running the retail game with the plugin installed.
    blocker: The retail Fallout 4 installation is not present and cannot be obtained here.
  release_maintenance:
    status: documented_only
    note: >-
      We hold F4SE's runtime-to-build table and its no-redistribution rule, and Wrye Bash's plugin
      status semantics, but implement no release check for this game. Nexus Mods answers 403, so no
      version history or file list can be read from where releases actually live.

toolchain:
  - id: loot_masterlist
    name: LOOT masterlist (fallout4)
    url: https://raw.githubusercontent.com/loot/fallout4/master/masterlist.yaml
    purpose: Hand-curated requirements, incompatibilities, load-order rules and dirty-edit records.
    status: integrated
    runs_on: [any]
    license: CC0-1.0
    integration: data_only
    note: >-
      Fetched with provenance and read from the evidence cache by src/modcheck/integrations/loot.py;
      not redistributed. Licence verified from the repository LICENSE file.
    source: loot_masterlist_fallout4
  - id: xedit
    name: xEdit / FO4Edit
    url: https://tes5edit.github.io/docs/
    purpose: Conflict detection, patch plugins, cleaning, ESL flagging (-PseudoESL, SetESL script).
    status: unavailable_here
    runs_on: [windows]
    license: MPL-1.1
    integration: reference_only
    note: >-
      Windows GUI application, not present and not runnable here. Licence from the repository
      LICENSE.txt; the documentation site carries no licence statement.
    source: xedit_license
  - id: f4se
    name: Fallout 4 Script Extender
    url: https://f4se.silverlock.org/
    purpose: Loads C++ plugin DLLs and extends Papyrus at runtime.
    status: unavailable_here
    runs_on: [windows]
    license: proprietary
    integration: reference_only
    note: >-
      Locked to the game runtime version. The readme states redistribution and modified versions are
      not permitted, and that plugins must have their source publicly available.
    source: f4se_readme
  - id: mutagen
    name: Mutagen (Mutagen.Bethesda)
    url: https://mutagen-modding.github.io/Mutagen/
    purpose: C# library reading and writing Fallout 4 records with winning-override resolution.
    status: unavailable_here
    runs_on: [windows, linux]
    license: GPL-3.0
    integration: reference_only
    note: dotnet is absent here, so nothing Mutagen-based was run. GPL-3.0 constrains any integration.
    source: mutagen_license
  - id: synthesis
    name: Synthesis
    url: https://mutagen-modding.github.io/Synthesis/
    purpose: Patcher pipeline; documents AddPatch<IFallout4Mod, IFallout4ModGetter> for this game.
    status: unavailable_here
    runs_on: [windows, linux]
    license: GPL-3.0
    integration: reference_only
    note: Same blocker as Mutagen - no .NET SDK here. Licence verified from the repository LICENSE.md.
    source: synthesis_supporting_multiple_games
  - id: esplugin
    name: esplugin
    url: https://raw.githubusercontent.com/Ortham/esplugin/master/README.md
    purpose: Rust plugin parser used by LOOT; parses Fallout 4 (including VR) beyond the header.
    status: integrated
    runs_on: [windows, linux, macos]
    license: GPL-3.0
    integration: subprocess
    note: >-
      Integrated through an optional helper binary (helpers/esplugin-cli) that ModCheck invokes as a
      subprocess; it is built in this environment, so its tests run and --deep record-level analysis
      works. The subprocess boundary is deliberate: esplugin is GPL-3.0, so linking it would make
      ModCheck copyleft, and shipping the helper would carry GPL obligations of its own.
    source: esplugin_readme
  - id: wrye_bash
    name: Wrye Bash
    url: https://wrye-bash.github.io/docs/Wrye%20Bash%20General%20Readme.html
    purpose: Load-order management, plugin status checks, Bashed Patch.
    status: unavailable_here
    runs_on: [windows, linux]
    license: GPL-3.0
    integration: reference_only
    note: >-
      Cited as documentation for missing-master status and ESL semantics. Its supported-games table
      lists Fallout 4 for GOG, Steam and the Windows Store.
    source: wrye_bash_readme

gaps:
  - what: Fallout 4 Creation Kit documentation of any kind.
    why: >-
      creationkit.com/fallout4 returns HTTP 200 but the body is only "This wiki is currently down
      for backend maintenance. Any news will be posted in the official Bethesda Game Studios discord
      , in the #modding-news channel."
    unblocks: Papyrus recipes, precombine/previs generation workflow, Creation Kit behaviour claims.
  - what: >-
      What the records and fields below the TES4 header mean. esplugin gives us record identity and
      overlap between plugins; it does not tell us what a field is or which value is preferable.
    why: UESP answers 403 at the origin.
    unblocks: >-
      Field-level conflict reporting - which field two plugins disagree about, rather than only that
      they touch the same record.
  - what: Precombine and previs mechanics beyond the single sentence a community guide gives us.
    why: >-
      The only statement we hold is The Midnight Ride's "Cells originating in a light plugin cannot
      use the PreVis/Precombine system ."; the Creation Kit documentation that would explain the
      system is unavailable.
    unblocks: A failure record for broken precombines, which is one of this game's best-known problems.
  - what: Mod-level metadata for released mods (versions, requirements, file lists).
    why: nexusmods.com answers 403 to us.
    unblocks: Checking a real mod's declared requirements against what is installed.
  - what: Everything about in-game behaviour.
    why: No retail game installation here.
    unblocks: Any game_tested verification state.

