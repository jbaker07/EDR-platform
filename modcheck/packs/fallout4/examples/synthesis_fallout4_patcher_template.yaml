id: synthesis_fallout4_patcher_template
game: fallout4
title: Synthesis patcher targeting Fallout 4 - generated project template
url: https://mutagen-modding.github.io/Synthesis/devs/Supporting-Multiple-Games/
kind: template
demonstrates:
  - Registering a Fallout 4 patch entry point with AddPatch<IFallout4Mod, IFallout4ModGetter>
  - Supporting more than one game from one patcher by adding a second AddPatch call and RunPatch overload
  - Generating a patch plugin against the player's own load order instead of shipping a fixed patch
license: GPL-3.0-only
reuse:
  integration: vendored
  constraints: >-
    The template is generated into your own solution, so your patcher is a derivative of Synthesis and
    Mutagen, both GPL-3.0-only per the NuGet package metadata we fetched. It needs the .NET SDK,
    which is absent here, so nothing was generated or built.
