- id: event:net.fabricmc.fabric.api.event.player.UseBlockCallback.EVENT
  kind: event
  asserted:
  - claim: Two publication sites -- @Inject at HEAD of ServerPlayerGameMode.useItemOn (server) and @Inject into
      MultiPlayerGameMode.useItemOn before startPrediction (client) -- so the same listener runs on both sides in
      single-player and multiplayer alike.
    basis: static_inference
    evidence:
    - extracted:edges.json#publishes_event
    - extracted:edges.json#injects_into
  - claim: The callback returns InteractionResult; returning anything other than PASS stops vanilla's own use logic
      at that site, which on the client also prevents the packet from being sent.
    basis: analyst_inference
    evidence:
    - extracted:edges.json#callback_of
    - extracted:edges.json#injects_into
  - claim: Because the server site is at HEAD, a listener that returns a non-PASS result suppresses every other
      mod's block-use handling that vanilla would have invoked.
    basis: analyst_inference
    evidence:
    - extracted:edges.json#injects_into
  not_established:
  - Which result values the client site treats as consumed versus failed (the redirected call's semantics are not
    extracted; question:q.injection_points_not_resolved).
  evidence:
  - extracted:edges.json#publishes_event
  questions:
  - question:q.contested_method_policy
  provenance:
    author: analyst
    added: '2026-09-20'
- id: event:net.fabricmc.fabric.api.event.player.PlayerBlockBreakEvents.BEFORE
  kind: event
  asserted:
  - claim: Fired from an @Inject into ServerPlayerGameMode.destroyBlock at the INVOKE of Block.playerWillDestroy,
      so it runs on the server after the block has been resolved but before it is removed.
    basis: static_inference
    evidence:
    - extracted:edges.json#publishes_event
    - extracted:edges.json#injects_into
  - claim: Callback returns boolean and receives (Level, Player, BlockPos, BlockState, BlockEntity); returning false
      is the cancel path (the CANCELED event exists alongside).
    basis: declared
    evidence:
    - extracted:edges.json#callback_of
  not_established:
  - Whether creative-mode breaks pass through the same site.
  evidence:
  - extracted:edges.json#publishes_event
  provenance:
    author: analyst
    added: '2026-09-20'
- id: event:net.fabricmc.fabric.api.entity.event.v1.ServerLivingEntityEvents.ALLOW_DEATH
  kind: event
  asserted:
  - claim: Implemented as a @Redirect of LivingEntity.isDeadOrDying inside LivingEntity.hurtServer, so the listener's
      boolean stands in for the vanilla death check at that call site only.
    basis: static_inference
    evidence:
    - extracted:edges.json#publishes_event
    - extracted:edges.json#wraps
  - claim: 'A mod that @Redirects the same isDeadOrDying call site cannot coexist with this event''s redirect: the
      second redirect finds no target and, with a required config, fails at transformation (scenario:C).'
    basis: executed_transformation
    evidence:
    - scenario:C
    - extracted:edges.json#wraps
  not_established:
  - Whether other death paths (void, /kill) reach hurtServer at all.
  evidence:
  - extracted:edges.json#wraps
  questions:
  - question:q.mixin_docs_application_order
  provenance:
    author: analyst
    added: '2026-09-20'
