- id: event:net.fabricmc.fabric.api.event.player.UseBlockCallback.EVENT
  kind: event
  asserted:
    - claim: Two publication sites -- @Inject at HEAD of ServerPlayerGameMode.useItemOn (server) and @Inject into MultiPlayerGameMode.useItemOn before startPrediction (client) -- so the same listener runs on both sides in single-player and multiplayer alike.
      basis: static_inference
      evidence: [extracted:edges.json#publishes_event, extracted:edges.json#injects_into]
    - claim: The callback returns InteractionResult; returning anything other than PASS stops vanilla's own use logic at that site, which on the client also prevents the packet from being sent.
      basis: analyst_inference
      evidence: [extracted:edges.json#callback_of, extracted:edges.json#injects_into]
    - claim: Because the server site is at HEAD, a listener that returns a non-PASS result suppresses every other mod's block-use handling that vanilla would have invoked.
      basis: analyst_inference
      evidence: [extracted:edges.json#injects_into]
  not_established:
    - Which result values the client site treats as consumed versus failed (the redirected call's semantics are not extracted; question:q.injection_points_not_resolved).
  evidence: [extracted:edges.json#publishes_event]
  questions: [question:q.contested_method_policy]
  provenance: {author: analyst, added: '2026-09-20'}

- id: event:net.fabricmc.fabric.api.event.player.PlayerBlockBreakEvents.BEFORE
  kind: event
  asserted:
    - claim: Fired from an @Inject into ServerPlayerGameMode.destroyBlock at the INVOKE of Block.playerWillDestroy, so it runs on the server after the block has been resolved but before it is removed.
      basis: static_inference
      evidence: [extracted:edges.json#publishes_event, extracted:edges.json#injects_into]
    - claim: Callback returns boolean and receives (Level, Player, BlockPos, BlockState, BlockEntity); returning false is the cancel path (the CANCELED event exists alongside).
      basis: declared
      evidence: [extracted:edges.json#callback_of]
  not_established:
    - Whether creative-mode breaks pass through the same site.
  evidence: [extracted:edges.json#publishes_event]
  provenance: {author: analyst, added: '2026-09-20'}

- id: event:net.fabricmc.fabric.api.entity.event.v1.ServerLivingEntityEvents.ALLOW_DEATH
  kind: event
  asserted:
    - claim: Implemented as a @Redirect of LivingEntity.isDeadOrDying inside LivingEntity.hurtServer, so the listener's boolean stands in for the vanilla death check at that call site only.
      basis: static_inference
      evidence: [extracted:edges.json#publishes_event, extracted:edges.json#wraps]
    - claim: A mod that redirects the same call site cannot coexist with this event (one redirect per call site).
      basis: analyst_inference
      evidence: [mechanism:Mixin, extracted:edges.json#wraps]
  not_established:
    - Whether other death paths (void, /kill) reach hurtServer at all.
  evidence: [extracted:edges.json#wraps]
  questions: [question:q.mixin_docs_application_order]
  provenance: {author: analyst, added: '2026-09-20'}

- id: event:net.fabricmc.fabric.api.entity.event.v1.ServerPlayerEvents.JOIN
  kind: event
  asserted:
    - claim: Fired from an @Inject at RETURN of PlayerList.placeNewPlayer, so the ServerPlayer is already in its level and the player list when the listener runs.
      basis: static_inference
      evidence: [extracted:edges.json#publishes_event, extracted:edges.json#injects_into]
    - claim: Server thread, both environments.
      basis: analyst_inference
      evidence: [extracted:fabric_api.json#fabric-entity-events-v1]
  not_established:
    - Whether the player's client has completed the play-phase handshake (ServerPlayConnectionEvents.JOIN is the networking-ready signal).
  evidence: [extracted:edges.json#publishes_event]
  provenance: {author: analyst, added: '2026-09-20'}

- id: event:net.fabricmc.fabric.api.networking.v1.ServerPlayConnectionEvents.JOIN
  kind: event
  asserted:
    - claim: Published from ServerPlayNetworkAddon.onClientReady in the networking module's impl code, not from a mixin; the extraction therefore does not place it in the vanilla call graph.
      basis: static_inference
      evidence: [extracted:edges.json#publishes_event]
    - claim: Callback onPlayReady(ServerGamePacketListenerImpl, PacketSender, MinecraftServer) hands a sender, which is the intended way to push initial state to a client that has just become able to receive custom payloads.
      basis: declared
      evidence: [extracted:edges.json#callback_of, record:capability/sync_state.fabric_custom_payload]
  not_established:
    - The vanilla method from which onClientReady is reached, and its thread (question:q.payload_receiver_thread, question:q.event_publishers_missing).
  evidence: [extracted:edges.json#publishes_event]
  questions: [question:q.payload_receiver_thread]
  provenance: {author: analyst, added: '2026-09-20'}

- id: event:net.fabricmc.fabric.api.client.event.lifecycle.v1.ClientTickEvents.END_CLIENT_TICK
  kind: event
  asserted:
    - claim: Fired from MinecraftMixin.onEndTick, an @Inject at RETURN of Minecraft.tick; client environment only.
      basis: static_inference
      evidence: [extracted:edges.json#publishes_event, extracted:edges.json#injects_into]
    - claim: A dedicated server never loads this class; referencing it from a common entrypoint is a class-loading failure on the server.
      basis: declared
      evidence: [extracted:fabric_api.json#fabric-lifecycle-events-v1]
  not_established:
    - Thread identity of Minecraft.tick beyond "the client's main thread" by convention.
  evidence: [extracted:edges.json#publishes_event]
  provenance: {author: analyst, added: '2026-09-20'}

- id: mechanism:Mixin
  kind: hook
  asserted:
    - claim: Mixin priority defaults to 1000 and the target list to empty; a mod that leaves priority at default has no ordering relationship with Fabric API's own mixins.
      basis: direct_reference
      evidence: [extracted:corpus.json, mechanism:Mixin]
    - claim: Fabric API 0.161.0+26.3 uses no @Overwrite; a mod's @Overwrite of any of the 479 injected methods removes Fabric's injection and the events it fires.
      basis: direct_reference
      evidence: [extracted:edges.json#injects_into, extracted:fabric_api.json]
  not_established:
    - Application order between equal-priority mixins from different mods (question:q.mixin_docs_application_order).
    - Whether any given mixin applies at runtime (question:q.runtime_mixin_application).
  evidence: [extracted:corpus.json, extracted:edges.json#injects_into]
  questions: [question:q.mixin_docs_application_order, question:q.runtime_mixin_application]
  provenance: {author: analyst, added: '2026-09-20'}
