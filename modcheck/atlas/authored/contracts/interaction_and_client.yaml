  provenance:
    author: analyst
    added: '2026-09-20'
- id: event:net.fabricmc.fabric.api.networking.v1.ServerPlayConnectionEvents.JOIN
  kind: event
  asserted:
  - claim: Published from ServerPlayNetworkAddon.onClientReady in the networking module's impl code, not from a
      mixin; the extraction therefore does not place it in the vanilla call graph.
    basis: static_inference
    evidence:
    - extracted:edges.json#publishes_event
  - claim: Callback onPlayReady(ServerGamePacketListenerImpl, PacketSender, MinecraftServer) hands a sender, which
      is the intended way to push initial state to a client that has just become able to receive custom payloads.
    basis: declared
    evidence:
    - extracted:edges.json#callback_of
    - record:capability/sync_state.fabric_custom_payload
  not_established:
  - The vanilla method from which onClientReady is reached, and its thread (question:q.payload_receiver_thread,
    question:q.event_publishers_missing).
  evidence:
  - extracted:edges.json#publishes_event
  questions:
  - question:q.payload_receiver_thread
  provenance:
    author: analyst
    added: '2026-09-20'
- id: event:net.fabricmc.fabric.api.client.event.lifecycle.v1.ClientTickEvents.END_CLIENT_TICK
  kind: event
  asserted:
  - claim: Fired from MinecraftMixin.onEndTick, an @Inject at RETURN of Minecraft.tick; client environment only.
    basis: static_inference
    evidence:
    - extracted:edges.json#publishes_event
    - extracted:edges.json#injects_into
  - claim: A dedicated server never loads this class; referencing it from a common entrypoint is a class-loading
      failure on the server.
    basis: declared
    evidence:
    - extracted:fabric_api.json#fabric-lifecycle-events-v1
  not_established:
  - Thread identity of Minecraft.tick beyond "the client's main thread" by convention.
  evidence:
  - extracted:edges.json#publishes_event
  provenance:
    author: analyst
    added: '2026-09-20'
- id: mechanism:Mixin
  kind: hook
  asserted:
  - claim: Mixin priority defaults to 1000 and the target list to empty (annotation defaults read from the pinned
      jar).
    basis: direct_reference
    evidence:
    - extracted:fabric_api.json
    - mechanism:Mixin
  - claim: Fabric API 0.161.0+26.3 carries exactly one @Overwrite (fabric-renderer-api-v1 BlockStateModelWrapperMixin.update,
      client) and 199 MixinExtras injections; the earlier 'zero overwrites' figure came from a parser that could
      not see marker annotations.
    basis: direct_reference
    evidence:
    - extracted:edges.json#replaces
    - extracted:fabric_api.json
  - claim: 'An @Overwrite does NOT remove another mixin''s HEAD, TAIL or RETURN injections into the same method:
      they apply to the overwritten body, at any priority (scenario:A, scenario:L, scenario:N).'
    basis: executed_transformation
    evidence:
    - extracted:mixin_transformation_tests.json
    - scenario:A
    - scenario:L
    - scenario:N
  - claim: 'An INVOKE-point @Inject or a @Redirect into a method overwritten by a mixin of equal or higher priority
      is refused at transformation time (''cannot inject into ... merged by ... with priority''), which with a required
      config is a startup failure, not a silent removal (scenario:B, scenario:B2, scenario:J). The rule is InjectionPoint.checkPriority:
      MethodHead, BeforeReturn and BeforeFinalReturn override it to true; BeforeInvoke and the other points do not.'
    basis: executed_transformation
    evidence:
    - extracted:mixin_transformation_tests.json
    - scenario:B
    - scenario:B2
    - scenario:J
  - claim: With a HIGHER priority than the overwrite, an INVOKE-point injection applies to the overwritten body
      and fires if the body still contains the call (scenario:K); if the overwritten body no longer contains the
      call it fails the injection count check with require=1 (scenario:M).
    basis: executed_transformation
    evidence:
    - scenario:K
    - scenario:M
  - claim: 'Two @Redirects of one call site from two mods do not both apply: the second finds no target and fails
      with require=1 (scenario:C). A MixinExtras @WrapOperation over a @Redirect composes: the wrapper runs around
      the redirect handler (scenario:D).'
    basis: executed_transformation
    evidence:
    - scenario:C
    - scenario:D
  - claim: 'Two @Overwrites of one method at equal priority: no error; the first configuration''s body is what runs
      (scenario:F). Lower priority is applied first and its HEAD injection runs first (scenario:G); at equal priority,
      configuration order decides (scenario:E).'
    basis: executed_transformation
    evidence:
    - scenario:F
    - scenario:G
    - scenario:E
  - claim: A cancelling HEAD injection suppresses every later injection in that method, including another mod's
      TAIL and RETURN (scenario:H).
    basis: executed_transformation
    evidence:
    - scenario:H
  not_established:
  - 'That any of this holds inside a running Minecraft with fabric-loader''s Knot classloader: the tests ran the
    transformer alone (question:q.runtime_mixin_application).'
  - The documented rule for equal-priority ordering across mods (question:q.mixin_docs_application_order).
  - Same-point versus same-method overlap for the 34 shared targets (question:q.injection_points_not_resolved).
  evidence:
  - extracted:mixin_transformation_tests.json
  - extracted:edges.json#shared_targets
  - extracted:fabric_api.json
  questions:
  - question:q.mixin_docs_application_order
  - question:q.runtime_mixin_application
  - question:q.injection_points_not_resolved
  provenance:
    author: analyst
    added: '2026-09-20'
