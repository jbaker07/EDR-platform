- id: q.runtime_mixin_application
  kind: unavailable_runtime_observation
  status: open
  question: When the 26.3 client or dedicated server starts with Fabric loader 0.19.5 and a given set of mods, which
    mixins actually apply, in what order, and which fail with a target-not-found or conflict error?
  affects:
  - workflow:wf.integration.mixin_coexistence
  - workflow:wf.engineering.testing
  - request:request.rain_lantern
  why_it_matters: Every injects_into edge names a target; none establishes the injection applied. Fabric loader
    logs mixin application and failures at startup, which is the only ground truth for "these mods coexist".
  evidence_available:
  - extracted:edges.json#injects_into
  - record:capability/build_and_test.fabric_project_setup_current_version
  best_remaining_source: A headless dedicated-server run of 26.3 with the mod set under test, with the Mixin debug
    flags enabled, capturing the log.
  procedure: Provision a dedicated server run in a sandbox (no user install touched), start it with `-Dmixin.debug.export=true`
    and the mods, capture the log, and ingest it with `modcheck runtime observe` so each edge can be promoted to
    `observed` with the run id as provenance.
  completion_condition: edges.json evidence_classes contains a nonzero `observed` count with run provenance.
  conclusions_affected_while_open:
  - Nothing in the atlas is observed. No compatibility verdict is game-tested.
  provenance:
    author: analyst
    added: '2026-09-20'
- id: q.runtime_event_delivery
  kind: unavailable_runtime_observation
  status: open
  question: Does each event fire when its analyst-stated contract says it does, on the thread the contract infers,
    and once per the unit the callback names (per tick, per level, per player)?
  affects:
  - workflow:wf.behaviour.lifecycle_events
  - request:request.rain_lantern
  - request:request.team_counter
  why_it_matters: The reference implementation subscribes to END_LEVEL_TICK and to a player join event; its JUnit
    tests exercise the handlers with fakes, not the game. Whether the game calls them is the single fact the tests
    cannot establish.
  evidence_available:
  - record:capability/subscribe_event.fabric_server_tick
  - extracted:edges.json#publishes_event
  best_remaining_source: The same headless run as q.runtime_mixin_application, with a probe mod that logs each callback
    with thread name and tick count.
  procedure: Build a probe mod from the atlas' event list that registers a logging listener for every server-side
    event; run headless; ingest the log; write `observed` edges of relation callback_of with thread and count fields.
  completion_condition: Each contract note has an "Observed" row or a recorded absence for the pinned versions.
  conclusions_affected_while_open:
  - All thread and frequency claims in _authored/contracts are inferences.
  provenance:
    author: analyst
    added: '2026-09-20'
- id: q.runtime_performance
