- id: q.lantern_rain_semantics
  kind: ambiguous_creator_intent
  status: resolved
  question: For the rain lantern, does "raining" mean the level's weather flag (Level.isRaining()), rain at the
    lantern's position (Level.isRainingAt(BlockPos), which accounts for biome and sky exposure), or precipitation
    of any kind including snow?
  affects:
  - request:request.rain_lantern
  why_it_matters: Both methods exist on the hooked Level type. A lantern under a roof, or in a desert, or in snow,
    behaves differently under each reading, and the difference is visible to players.
  evidence_available:
  - type:net.minecraft.world.level.Level
  - extracted:minecraft_surface.json.gz
  best_remaining_source: The creator.
  procedure: Ask, with the three readings and their visible consequences listed; record the answer in the request
    note's approved_behaviour.
  completion_condition: approved_behaviour names one method and the expected behaviour under a roof, in a dry biome,
    and in snow.
  conclusions_affected_while_open:
  - The reference implementation's choice is a default, not an approved behaviour.
  provenance:
    author: analyst
    added: '2026-09-20'
  resolved_by: 'The canonical record''s proposed contract (modcheck/evaluation/requests/rain_charged_lantern_v2.yaml,
    proposed_contract.exposure_test): Level.isRainingAt(pos.above()). That is a ModCheck proposal recorded as such,
    not a creator decision; the request''s acceptance criterion (an exposed lantern charges, a sheltered one does
    not) is what binds. Whether isRainingAt means that in every biome and weather state is question:q.lantern_runtime_gate.'
