- id: q.contested_method_policy
  kind: conflicting_requirements
  status: open
  question: 'When a creator''s mixin must target a vanilla method that Fabric API already injects into, which policy
    applies given what the transformer actually does: HEAD/TAIL/RETURN injections survive an @Overwrite of the method
    (scenario:A, scenario:L, scenario:N), INVOKE-point injections and Redirects into an overwritten method are refused
    unless the injecting mixin''s priority is higher (scenario:B, scenario:J, scenario:K), a second Redirect of
    the same call fails (scenario:C), a cancelling HEAD suppresses later TAIL/RETURN listeners (scenario:H)?'
  affects:
  - workflow:wf.behaviour.vanilla_modification
  - workflow:wf.integration.mixin_coexistence
  - request:request.villager_fear
  why_it_matters: A cancelling injection at HEAD of ServerPlayerGameMode.useItemOn, for example, would suppress
    UseBlockCallback for every other mod. The atlas can list the contested methods; it cannot decide the policy.
  evidence_available:
  - extracted:mixin_transformation_tests.json
  - extracted:edges.json#shared_targets
  - mechanism:Mixin
  best_remaining_source: A project policy decided by the founder, recorded as a store record.
  procedure: 'Propose: prefer the Fabric event; if a mixin is unavoidable, no @Overwrite of a method with a shared
    target entry, no cancel at HEAD of a shared target, no Redirect where another Redirect or WrapOperation exists
    (WrapOperation composes over a Redirect: scenario:D). Get it approved; encode it as a planner constraint that
    reads shared_targets and the composition table.'
  completion_condition: A policy record exists and the planner enforces it.
  conclusions_affected_while_open:
  - The planner may select a mixin recipe for a shared target without warning.
  provenance:
    author: analyst
    added: '2026-09-20'
