  provenance:
    author: analyst
    added: '2026-09-20'
- id: q.worldgen_threading
  kind: unmodeled_behaviour
  status: open
  question: Which thread executes a feature's place() call and the ServerChunkEvents CHUNK_GENERATE callback --
    the server thread, a chunk-generation worker, or either depending on chunk status -- and what state may a listener
    safely touch from there?
  affects:
  - workflow:wf.world.features_biomes
  - request:request.crystal_caves
  - workflow:wf.behaviour.lifecycle_events
  why_it_matters: CHUNK_GENERATE is published from ChunkStatusTasks.lambda$full$0 (an injection at TAIL of a lambda
    used in the chunk task pipeline). A listener that touches level state from a worker thread corrupts it; the
    atlas cannot yet say which thread that lambda runs on.
  evidence_available:
  - extracted:edges.json#publishes_event
  - extracted:minecraft_surface.json.gz
  best_remaining_source: The vanilla chunk task scheduler classes (net.minecraft.server.level and net.minecraft.world.level.chunk.status),
    extracted and read for the executor each status task is submitted to; then a runtime probe.
  procedure: Extract ChunkStatusTasks and its scheduler with vanilla_members.py (extra types), read which executor
    `full` is scheduled on, record a runs_on_thread edge with static_inference, and confirm with the probe from
    q.runtime_event_delivery.
  completion_condition: The CHUNK_GENERATE contract has a runs_on_thread row with evidence.
  conclusions_affected_while_open:
  - The crystal caves request cannot state where its post-generation logic may run.
  provenance:
    author: analyst
    added: '2026-09-20'
- id: q.payload_receiver_thread
  kind: unmodeled_behaviour
  status: open
  question: On which thread does a ServerPlayNetworking global receiver execute for a custom payload, and does the
    API re-schedule to the server thread before calling the handler?
  affects:
  - workflow:wf.multiplayer.networking
  - request:request.team_counter
  - request:request.rain_lantern
  why_it_matters: A handler that mutates level state from a netty thread is a data race. The reference implementation
    assumes the handler runs on the server thread; the corpus has the networking module's bytecode but the atlas
    has not traced the dispatch path.
  evidence_available:
  - mechanism:fabric-networking-api-v1
  - record:capability/sync_state.fabric_custom_payload
  - extracted:edges.json#calls
  best_remaining_source: fabric-networking-api-v1 impl classes (ServerPlayNetworkAddon and its handler dispatch),
    read with javap -c for an execute()/submit call on the server before the handler invocation.
  procedure: Trace the receive path in the module's impl classes; record a runs_on_thread edge with static_inference;
    then confirm at runtime.
  completion_condition: The networking workflow states the receiver thread with an edge id.
  conclusions_affected_while_open:
  - The generated sync_payload code's thread assumptions are unverified.
  provenance:
    author: analyst
    added: '2026-09-20'
- id: q.registry_freeze_timing
  kind: unmodeled_behaviour
  status: open
  question: Relative to ModInitializer.onInitialize and the DynamicRegistrySetupCallback, when are the built-in
    registries frozen in 26.3, and which registrations after that point fail?
  affects:
  - workflow:wf.content.block_item
  - workflow:wf.content.entity_type
  - workflow:wf.integration.registry_sync
  why_it_matters: Register-too-late is a classic startup crash. The atlas lists 97 built-in registries and the entrypoints,
    but no lifecycle_phase edge orders them.
  evidence_available:
  - mechanism:Registries
  - type:net.fabricmc.api.ModInitializer
  - event:net.fabricmc.fabric.api.event.registry.DynamicRegistrySetupCallback.EVENT
  best_remaining_source: net.minecraft.core.registries.BuiltInRegistries (freeze call sites) and fabric-loader's
    entrypoint invocation sites, read with javap -c.
  procedure: Extract the freeze call chain and the entrypoint invocation chain; emit orders_before edges between
    lifecycle phases with static_inference.
  completion_condition: A lifecycle note orders entrypoints, registry freeze and dynamic registry load with edge
    ids.
  conclusions_affected_while_open:
  - Content workflows say "register in onInitialize" by convention, not by extracted ordering.
  provenance:
    author: analyst
    added: '2026-09-20'
- id: q.datapack_load_order
  kind: unmodeled_behaviour
  status: open
  question: In what order are data packs (built-in, mod-provided via fabric-resource-loader, world) applied in 26.3,
    and how are placed-feature ordering conflicts within one generation step detected and reported?
  affects:
  - workflow:wf.world.features_biomes
  - workflow:wf.content.data_driven_content
  - request:request.crystal_caves
  why_it_matters: Two mods adding features to the same biome at the same step can produce a feature-order cycle
    that aborts world load; which pack wins for a same-named JSON decides what a creator sees.
  evidence_available:
  - mechanism:fabric-resource-loader-v0
  - mechanism:fabric-biome-api-v1
  - extracted:corpus.json
  best_remaining_source: The resource-loader module's pack ordering code and vanilla's feature-order validation
    in the world-generation packages, extracted.
  procedure: Extract the relevant classes as extra types; record orders_before edges; confirm with a headless world
    load.
  completion_condition: The world workflow states pack precedence and the cycle failure with evidence.
  conclusions_affected_while_open:
  - The crystal caves request cannot promise coexistence with another biome-modifying mod.
  provenance:
    author: analyst
    added: '2026-09-20'
