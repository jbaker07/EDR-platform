    author: analyst
    added: '2026-09-20'
- id: q.mod_data_migration_practice
  kind: missing_documentation
  status: open
  question: 'How do Fabric mods migrate their own persisted data across versions in practice: does Fabric expose
    a data-fixer hook, or do mods version their codecs and migrate on read?'
  affects:
  - workflow:wf.state.migration
  - request:request.port_1_21_mod
  - request:request.team_counter
  why_it_matters: The corpus shows vanilla's DataFixer package (444 classes in net.minecraft.util.datafix) and two
    Fabric hooks into it, but no API for mods to add fixers. Whether that is a gap or a deliberate practice determines
    the migration design in every state workflow.
  evidence_available:
  - extracted:corpus.json
  - extracted:edges.json
  - mechanism:fabric-data-attachment-api-v1
  best_remaining_source: Fabric documentation on persistent data and the data attachment API javadoc.
  procedure: Retrieve; if no hook exists, record the codec-versioning pattern as the documented practice.
  completion_condition: wf.state.migration cites a documented migration practice.
  conclusions_affected_while_open:
  - Migration designs in 70-Requests use codec versioning by analyst choice, not by documented practice.
  provenance:
    author: analyst
    added: '2026-09-20'
