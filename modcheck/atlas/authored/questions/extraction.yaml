- id: q.edge_targets_unresolved
  kind: incomplete_extraction
  status: resolved
  question: Which of the edge targets (75 at the time of writing; 90-Coverage carries the current count) that are
    neither declared on the hooked vanilla type nor on a superclass are (a) declared on an interface, (b) java.lang.Object
    methods, (c) wildcard targets such as <clinit>*, or (d) members Fabric adds by interface injection and that
    do not exist in the vanilla jar at all?
  affects:
  - workflow:wf.behaviour.vanilla_modification
  - workflow:wf.integration.mixin_coexistence
  why_it_matters: A calls edge whose target does not exist in vanilla is either an extraction artefact or a Fabric-injected
    member. Until each is classified, a mod author reading the interface note for that type may look for a method
    that is not there.
  evidence_available:
  - extracted:minecraft_surface.json.gz
  - extracted:edges.json#calls
  best_remaining_source: 'The same jars: walk `implements` chains with javap (interfaces were not walked), and read
    fabric-api''s interface-injection declarations from each module''s fabric.mod.json custom block.'
  procedure: Extend atlas/extract/vanilla_members.py to parse `implements` in javap headers and walk them; read
    `fabric-api:interface-injections` (or the equivalent custom key) from fabric_api.json declared.custom; re-run
    and expect the unresolved list to fall to zero with each item tagged by category.
  completion_condition: minecraft_members.json reports 0 unresolved edge targets, or every remaining one carries
    a category tag with evidence.
  conclusions_affected_while_open:
  - Interface notes under 40-Interfaces for the owners of unresolved targets may omit an inherited or injected member
    that an edge names.
  - The "targets resolved" count in 90-Coverage is a lower bound.
  provenance:
    author: analyst
    added: '2026-09-20'
  resolved_by: 'Exact resolution in atlas/extract/resolve.py against the processed compile jar, Minecraft''s own
    libraries and the JDK (extracted:edges.json#calls: 4373 exact + 715 inherited_exact, 0 unresolved; extracted:edges.json#reads:
    1422 exact + 9 inherited, 0 unresolved). The old 75 were an artefact of a javap name match that walked neither
    interfaces nor library jars. What remains is question:q.selector_ambiguity.'
- id: q.injection_points_not_resolved
  kind: incomplete_extraction
  status: in_progress
  question: For each injects_into and wraps edge, every @At now resolves to an exact member (332 exact, 49 inherited_exact,
    4 MixinExtras expression points unresolvable by construction); what remains is the instruction OFFSET inside
    the target method where each point applies, so that two injections into the same method can be told apart as
    same-point or different-point.
  affects:
  - workflow:wf.integration.mixin_coexistence
  - workflow:wf.behaviour.vanilla_modification
  - request:request.villager_fear
  why_it_matters: Two injections into one method only collide if they touch the same point. The atlas records the
    @At kind and target descriptor as a string, which is enough to say "same method", not "same point".
  evidence_available:
  - extracted:edges.json#injects_into
  - extracted:edges.json#wraps
  - extracted:minecraft_surface.json.gz
  best_remaining_source: The vanilla method bodies (javap -c on the hooked types) matched against each @At target
    descriptor; the sponge-mixin injection-point classes in the corpus.
  procedure: Decode the target method's Code attribute with atlas/extract/classfile.py, locate the instruction(s)
    matching each point (INVOKE/FIELD/NEW by resolved member, HEAD/TAIL/RETURN by position, ordinal applied), and
    attach the offset list to the edge's `points`.
  completion_condition: Every point on every injects_into/wraps edge carries offsets, or a recorded reason (expression
    point).
  conclusions_affected_while_open:
  - shared_targets in extracted:edges.json is a same-METHOD index; same-POINT overlap is not yet computed.
  provenance:
    author: analyst
    added: '2026-09-20'
- id: q.event_phase_ordering
  kind: incomplete_extraction
  status: open
  question: Which Fabric events define phases (Event.addPhaseOrdering / Identifier phases) and which Fabric API
    code registers listeners into non-default phases, so that the ordering of two subscribers to the same event
    can be stated?
  affects:
  - workflow:wf.behaviour.lifecycle_events
  - workflow:wf.integration.mixin_coexistence
  why_it_matters: Subscriber order within an event is the interaction most mods depend on without knowing it. The
    Event type's phase API is in the corpus but no edge records who uses it.
  evidence_available:
  - type:net.fabricmc.fabric.api.event.Event
  - extracted:fabric_api.json#fabric-api-base
  best_remaining_source: javap -c over every module class for invocations of Event.addPhaseOrdering and Event.register
    with a phase argument.
  procedure: Add an `orders_before` extractor to atlas/extract/edges.py that scans for addPhaseOrdering(Identifier,
    Identifier) call sites and register(Identifier, listener) call sites; emit orders_before edges with static_inference
    evidence.
  completion_condition: edges.json contains an orders_before count and each event note lists its phases.
  conclusions_affected_while_open:
  - The contracts under _authored/contracts cannot state any ordering between subscribers.
  provenance:
    author: analyst
    added: '2026-09-20'
- id: q.event_publishers_missing
  kind: incomplete_extraction
  status: in_progress
  question: 'Two events have no publisher found after scanning every class of every module: LevelRenderEvents.AFTER_BLOCK_OUTLINE_EXTRACTION
    and LevelRenderEvents.END_EXTRACTION. Are they deprecated aliases whose invoker is reached through another field,
    or fired only by mods?'
  affects:
  - workflow:wf.behaviour.lifecycle_events
  why_it_matters: An event with no known publisher cannot be placed in the vanilla call graph, so its contract (thread,
    side, timing) cannot even be inferred.
  evidence_available:
  - extracted:edges.json#publishes_event
  - extracted:edges.json#callback_of
  best_remaining_source: The module jars themselves, scanned for `invoker()` calls on any class rather than only
    the mixin and impl packages.
  procedure: Widen atlas/extract/run_hooks.py to run class_refs over every class in each module jar and record event_fires
    on all of them; compare the publisher count per event before and after.
  completion_condition: Both events have a publisher edge or a recorded 'declared, never fired by Fabric API' status.
  conclusions_affected_while_open:
  - The two event notes are silent about timing and side.
  provenance:
    author: analyst
    added: '2026-09-20'
- id: q.unhooked_vanilla_members
  kind: incomplete_extraction
  status: open
  question: What are the members of vanilla types that no Fabric API module hooks but that a request needs to reason
    about -- for example the villager AI classes, the world-generation feature classes, and the entity animation
    classes?
  affects:
  - request:request.villager_fear
  - request:request.crystal_caves
  - request:request.lantern_moth
  - workflow:wf.behaviour.entity_ai
  - workflow:wf.world.features_biomes
  why_it_matters: Member extraction was scoped to the 622 hooked types. A request that touches an unhooked type
    has only the package inventory to go on, so its candidate list names classes without confirming their signatures.
  evidence_available:
  - extracted:corpus.json
  - extracted:minecraft_surface.json.gz
  best_remaining_source: The merged 26.3 jar, already resolved and hashed.
  procedure: Give atlas/extract/vanilla_members.py an optional list of extra types (from the request notes' affected_systems),
    extract them the same way, and store them under a separate `requested_types` key so the hooked/unhooked distinction
    survives.
  completion_condition: Every type named in a request's candidates has an interface note with declared members.
  conclusions_affected_while_open:
  - Candidate designs in 70-Requests that name unhooked classes are unverified against 26.3 signatures.
  provenance:
    author: analyst
    added: '2026-09-20'
- id: q.field_read_write_direction
  kind: incomplete_extraction
  status: resolved
  question: Of the 168 `reads` edges, which are actually writes (putfield/putstatic) rather than reads (getfield/getstatic)?
  affects:
  - workflow:wf.integration.mixin_coexistence
  - workflow:wf.state.persistence
  why_it_matters: Shared mutable state between mods is a write, not a read. The Fieldref scan does not distinguish
    them, so the atlas cannot yet say which vanilla fields Fabric API mutates.
  evidence_available:
  - extracted:edges.json#reads
  best_remaining_source: The same javap -c output; the opcode precedes the Fieldref comment.
  procedure: In atlas/extract/jvm.py class_refs, keep the opcode with each Fieldref and emit `writes` edges for
    putfield/putstatic.
  completion_condition: edges.json counts contain both `reads` and `writes`.
  conclusions_affected_while_open:
  - No shares_mutable_state edge can be derived.
  provenance:
    author: analyst
    added: '2026-09-20'
  resolved_by: Opcodes are read from the Code attribute (atlas/extract/classfile.py); edges.json now separates extracted:edges.json#reads
    (get*) from extracted:edges.json#writes (put*), each with the caller method and instruction offset. Type references
    (new, anewarray, instanceof) are counted, not edges.
- id: q.selector_ambiguity
  kind: incomplete_extraction
  status: open
  question: Six injection selectors resolve to several overloads (ambiguous) and five are wildcard, quantified or
    regex selectors; Mixin picks among overloads by matching the handler's parameter types. Which exact member does
    each of the eleven apply to?
  affects:
  - workflow:wf.integration.mixin_coexistence
  why_it_matters: A shared-target entry whose selector is ambiguous cannot be compared for same-point overlap.
  evidence_available:
  - extracted:edges.json#injects_into
  - extracted:fabric_api.json
  best_remaining_source: Mixin's own selector matching (MemberInfo / TargetSelector in the pinned sponge-mixin jar),
    replayed statically or through the transformation harness.
  procedure: Implement handler-signature matching for name-only selectors (parameter types minus CallbackInfo must
    match the candidate's parameters); for quantified selectors expand against the target's member list and record
    every match; regex likewise.
  completion_condition: edges.json reports 0 ambiguous and every quantified selector expanded to its matches.
  conclusions_affected_while_open:
  - Six injects_into/wraps edges name a method by name only, with candidates listed.
  provenance:
    author: analyst
    added: '2026-09-20'
- id: q.processed_jar_change_provenance
  kind: incomplete_extraction
  status: open
  question: The jar a mod compiles against differs from Mojang's merged jar in 363 classes (771 member access changes,
    13 class access changes, 88 hierarchy changes); which Fabric API module's access widener or interface injection
    produced each change?
  affects:
  - workflow:wf.behaviour.vanilla_modification
  - workflow:wf.engineering.project_setup
  why_it_matters: A member that is public only because a Fabric module widened it disappears when that module is
    absent; a mod that calls it depends on the module without declaring it.
  evidence_available:
  - extracted:resolved_environment.json
  - extracted:minecraft_surface.json.gz
  - extracted:fabric_api.json
  best_remaining_source: Each module's declared accessWidener / classtweaker file and interface-injection custom
    values, all inside the corpus jars.
  procedure: Parse every module's access widener file and fabric-api:interface-injection custom block; attach the
    responsible module to each change in resolved_environment.json; emit a `derives_from` edge per change.
  completion_condition: Every processed-jar change names its module, or is recorded as produced by Loom itself.
  conclusions_affected_while_open:
  - Interface notes show widened access without saying which module a mod must depend on for it.
  provenance:
    author: analyst
    added: '2026-09-20'
