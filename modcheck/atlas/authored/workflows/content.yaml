- id: wf.content.block_item
  area: content
  title: Add a block and its item
  intent: 'A creator wants a new placeable block with a matching inventory item: it should look right in the world
    and in hand, drop something when broken, have a name in every language the mod ships, and behave like other
    blocks of its kind (light, hardness, sound, tool requirement).'
  preserve:
  - The creator's chosen id, namespace and display name exactly as given.
  - Vanilla behaviour of every other block; the new block must not alter defaults.
  mechanisms:
  - mechanism:Registries -- BLOCK and ITEM built-in registries are the registration targets.
  - mechanism:fabric-object-builder-api-v1 -- builders for block and item settings.
  - mechanism:fabric-data-generation-api-v1 -- generates blockstate, model, loot and language JSON at build time.
  - mechanism:fabric-creative-tab-api-v1 -- event:net.fabricmc.fabric.api.creativetab.v1.CreativeModeTabEvents.MODIFY_OUTPUT_ALL
    places the item in a creative tab.
  tools_today:
  - Fabric Loom project (source:fabric_example_mod_build_26_3, source:fabric_example_mod_versions_26_3) compiled
    with JDK 25 and Gradle 9.5.1 (record:capability/build_and_test.fabric_project_setup_current_version).
  - 'Hand-written or data-generated JSON under assets/<ns>/blockstates, models/block, models/item, lang and data/<ns>/loot_table
    (entry types present in the 26.3 jar itself: extracted:corpus.json).'
  - An image editor for the 16x16 texture (not in corpus; question:q.external_asset_tools).
  decisions:
  - Register in code (needed for any block) versus define appearance and drops in data (always data).
  - Which vanilla block's settings to copy, which decides sound, hardness and tool tags.
  - Whether the block needs a block entity (state beyond blockstate properties) -- if so, workflow:wf.content.block_entity.
  information_needed:
  - The exact registry field names and element types in 26.3 (extracted:minecraft_registries.json).
  - The current model and blockstate JSON shapes for resource pack format 97.1 (only the jar's own examples are
    in corpus; question:q.mojang_changelog_26_3).
  - Whether registration must happen before the registry freezes (question:q.registry_freeze_timing).
  automation_existing:
  - Data generation module generates the JSON from code (mechanically inspected; its API surface is in extracted:fabric_api.json#fabric-data-generation-api-v1).
  - The ModCheck scaffold produces a buildable project; it does not yet emit a block.
  remaining_manual:
  - Texture authoring.
  - Choosing block settings; there is no capability record for block registration yet.
  modcheck_contribution:
  - A capability record and deterministic generator for block+item registration with data-generated JSON, validated
    by compiling against the pinned corpus.
  - A check that the mod's pack.mcmeta format matches 97.1 / 121.0 from version.json.
  interactions_to_check:
  - Same namespaced id registered by two mods (hard failure at registration).
  - Creative tab ordering when several mods add to one vanilla tab.
  evidence:
  - extracted:minecraft_registries.json
  - extracted:corpus.json
  - extracted:fabric_api.json#fabric-object-builder-api-v1
  - record:capability/build_and_test.fabric_project_setup_current_version
  questions:
  - question:q.registry_freeze_timing
  - question:q.mojang_changelog_26_3
  status:
    inventoried: true
    mechanically_inspected: true
    contract_mapped: false
    interaction_analysed: false
    implemented_in_modcheck: false
    validated_scope: none
  provenance:
    author: analyst
    added: '2026-09-20'
- id: wf.content.entity_type
  area: content
  title: Add an entity type
  intent: 'A creator wants a new creature or object that exists in the world as an entity: it spawns, has attributes,
    moves, is saved with the chunk, and is rendered on the client with its own model.'
  preserve:
  - Vanilla spawn rules for every other entity.
  - 'Save compatibility: an entity type id, once shipped, is in players'' worlds.'
  mechanisms:
  - mechanism:Registries -- ENTITY_TYPE.
  - mechanism:fabric-object-builder-api-v1 -- default attributes through event:net.fabricmc.fabric.api.object.builder.v1.entity.FabricDefaultAttributeRegistry.MODIFY.
  - mechanism:fabric-rendering-v1 -- entity renderer and model layer registration on the client (workflow:wf.presentation.models_animation).
  - mechanism:fabric-biome-api-v1 -- spawn entries added to biomes.
  tools_today:
  - The same Loom project; an entity class extending a vanilla base in type:net.minecraft.world.entity.Mob or type:net.minecraft.world.entity.LivingEntity
    (members extracted).
  - A model and texture from an external tool (question:q.external_asset_tools).
  decisions:
  - Base class (Mob with goals, or a brain-driven base) -- decides how behaviour is added (workflow:wf.behaviour.entity_ai).
  - 'Spawn: natural in biomes, spawn egg only, or command only.'
  - 'Client rendering: reuse a vanilla model or ship a new one.'
  information_needed:
  - EntityType.Builder's 26.3 signature (not on a hooked type; question:q.unhooked_vanilla_members).
  - Which attributes a LivingEntity requires to construct without crashing.
  automation_existing:
  - None in ModCheck; the object-builder and rendering modules are inspected but no generator exists.
  remaining_manual:
  - Everything beyond project setup.
  modcheck_contribution:
  - A capability record for entity registration plus attributes, generated with a compile check; a companion client-side
    renderer capability.
  interactions_to_check:
  - Spawn weight competition in a biome with other mods' entities.
  - Entity load events firing for the new type in every mod that subscribes to ENTITY_LOAD.
  evidence:
  - extracted:minecraft_registries.json
  - extracted:minecraft_surface.json.gz
  - extracted:edges.json#callback_of
  questions:
  - question:q.unhooked_vanilla_members
  - question:q.villager_ai_architecture
  status:
    inventoried: true
    mechanically_inspected: true
    contract_mapped: false
    interaction_analysed: false
    implemented_in_modcheck: false
    validated_scope: none
  provenance:
    author: analyst
    added: '2026-09-20'
- id: wf.content.block_entity
  area: content
  title: Add a block with state (block entity)
  intent: The creator's block must remember something -- an inventory, a timer, an owner -- and often show it. The
    state must survive save/load and reach the client when it matters for rendering.
  preserve:
  - Existing block entities of other mods and vanilla.
  - Data shape stability once shipped (workflow:wf.state.migration).
  mechanisms:
  - mechanism:Registries -- BLOCK_ENTITY_TYPE.
  - mechanism:fabric-data-attachment-api-v1 -- an alternative to a block entity when only extra data, not ticking,
    is needed (record:capability/persist_state.fabric_attachment).
  - mechanism:fabric-rendering-v1 -- block entity renderer registration on the client.
  tools_today:
  - 'A BlockEntity subclass with load/save via the 26.3 ValueInput/ValueOutput API and a BlockEntityTicker installed
    from the block''s getTicker: the reference lantern''s hand-authored path (reference/rainlantern, request:request.rain_lantern).'
  decisions:
  - Block entity (ticking, rendered) versus attachment (data only) versus SavedData at level scope (record:capability/persist_state.fabric_saveddata).
  - What subset of state the client needs, sent as the block entity's update tag.
  information_needed:
  - The block entity save/load method signatures in 26.3 (BlockEntity is in the world.level package; its members
    are extracted only if hooked -- check extracted:minecraft_surface.json.gz).
  - Whether the reference lantern's approach (SavedData at level scope) or a per-block entity fits the request.
  automation_existing:
  - ModCheck generates SavedData and attachment code (record:capability/persist_state.fabric_saveddata, record:capability/persist_state.fabric_attachment);
    no block-entity generator. The reference lantern was not generated.
  remaining_manual:
  - Block entity class, renderer, update packet.
  modcheck_contribution:
  - A block-entity capability with the update-tag path and a compile check; a planner rule choosing between the
    three persistence shapes from the request's stated scope.
  interactions_to_check:
  - Another mod's mixin into BlockEntity.saveAdditional or the block entity type registry.
  evidence:
  - record:capability/persist_state.fabric_saveddata
  - record:capability/persist_state.fabric_attachment
  - extracted:minecraft_registries.json
  status:
    inventoried: true
    mechanically_inspected: true
    contract_mapped: false
    interaction_analysed: true
    implemented_in_modcheck: true
    validated_scope: the hand-authored reference lantern compiles and passes 40 JUnit tests with fakes (charging
      rules, serialization contract, HUD cache, resources and wiring); the SavedData and attachment generators compile;
      nothing observed in a game
  provenance:
    author: analyst
    added: '2026-09-20'
- id: wf.content.data_driven_content
  area: content
  title: Add recipes, loot, advancements and tags with data
  intent: 'Most content additions are data, not code: a recipe, a loot table, an advancement, a tag membership,
    a worldgen definition. The creator wants the JSON right for 26.3 and loaded in the right order relative to other
    packs.'
  preserve:
  - Vanilla data the mod does not override; overriding a vanilla file replaces it for every player.
  mechanisms:
  - 'Data packs: the 44 data entry types the jar itself ships (extracted:corpus.json), each a directory the loader
    reads.'
  - mechanism:fabric-resource-loader-v0 -- mod resources become built-in packs.
  - mechanism:fabric-resource-conditions-api-v1 -- conditional loading of a JSON.
  - mechanism:fabric-loot-api-v3 -- event:net.fabricmc.fabric.api.loot.v3.LootTableEvents.MODIFY edits vanilla loot
    without replacing the file.
  - mechanism:fabric-recipe-api-v1, mechanism:fabric-tag-api-v1, mechanism:fabric-convention-tags-v2.
  - mechanism:fabric-data-generation-api-v1 -- generates all of it from code.
  tools_today:
  - Data generation run in the Loom project; or hand-written JSON checked by loading a world.
  decisions:
  - Replace a vanilla file (simple, hostile to other mods) or modify through an event (composable).
  - Hand-written or generated JSON.
  information_needed:
  - The data pack format 121.0 JSON shapes; the jar's own 1866 advancements and other entries are the only in-corpus
    examples (extracted:corpus.json).
  - Pack precedence (question:q.datapack_load_order).
  automation_existing:
  - Data generation (mechanically inspected).
  remaining_manual:
  - Choosing the modify-versus-replace policy per file.
  modcheck_contribution:
  - A check that flags a mod data file whose path shadows a vanilla one and suggests the event-based alternative.
  interactions_to_check:
  - Two mods shadowing the same vanilla path; last pack wins silently.
  evidence:
  - extracted:corpus.json
  - extracted:fabric_api.json#fabric-resource-loader-v0
  - extracted:edges.json#callback_of
  questions:
  - question:q.datapack_load_order
  - question:q.mojang_changelog_26_3
  status:
    inventoried: true
    mechanically_inspected: true
    contract_mapped: false
    interaction_analysed: false
    implemented_in_modcheck: false
    validated_scope: none
  provenance:
    author: analyst
    added: '2026-09-20'
