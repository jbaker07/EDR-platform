    mechanically_inspected: true
    contract_mapped: false
    interaction_analysed: false
    implemented_in_modcheck: false
    validated_scope: none
  provenance:
    author: analyst
    added: '2026-09-20'
- id: wf.presentation.world_rendering
  area: presentation
  title: Custom world rendering
  intent: 'Draw something in the world that is not a block or entity: outlines, overlays, effects tied to the level
    render passes.'
  preserve:
  - Frame time; these hooks run every frame.
  mechanisms:
  - mechanism:fabric-rendering-v1 -- level render pass events (for example event:net.fabricmc.fabric.api.client.rendering.v1.level.LevelRenderEvents.AFTER_TRANSLUCENT_TERRAIN),
    14 pass events in extracted:edges.json#callback_of.
  - mechanism:fabric-renderer-api-v1 / mechanism:fabric-renderer-indigo for custom block model quads.
  tools_today:
  - A listener on the pass event using the render state handed in.
  decisions:
  - Which pass; whether extraction (state capture) or submission (draw) is the right phase in the 26.x split renderer.
  information_needed:
  - 'The extraction/render split semantics in 26.3 (LevelExtractionEvents versus LevelRenderEvents both exist; no
    documentation cached: question:q.fabric_docs_module_pages).'
  automation_existing:
  - None.
  remaining_manual:
  - All.
  modcheck_contribution:
  - Not yet planned.
  evidence:
  - extracted:edges.json#callback_of
  - extracted:fabric_api.json#fabric-rendering-v1
  questions:
  - question:q.fabric_docs_module_pages
  status:
    inventoried: true
    mechanically_inspected: true
    contract_mapped: false
    interaction_analysed: false
    implemented_in_modcheck: false
    validated_scope: none
  provenance:
    author: analyst
    added: '2026-09-20'
