- id: witness_skyrimse_light_plugin_formid_overflow
  game: skyrimse
  kind: witness
  witness_for: light_plugin_formid_overflow
  description: >-
    A light-flagged plugin containing a record whose object index is outside the
    range a light plugin may use
  measures: >-
    that esplugin.invalid_light_plugin is emitted about that specific plugin.
    Needs a built artifact and record-level parsing, so it is skipped where
    either is unavailable rather than counted as a pass.
  configuration:
    files_known_complete: true
    deep: true
  artifacts:
    - builder: bethesda_plugin_with_record
      name: Overflowing.esp
      args: {light: true, object_index: 20480}
  expect:
    findings: [esplugin.invalid_light_plugin]
    subject: Overflowing.esp
    summary_contains: "outside the range"

- id: control_skyrimse_light_plugin_within_range
  game: skyrimse
  kind: control
  description: A light plugin whose record IS inside the permitted range
  measures: that a valid light plugin is not flagged
  configuration:
    files_known_complete: true
    deep: true
  artifacts:
    # The master is supplied so this control is about light-plugin validity and
    # nothing else; without it the (correct) missing-master finding fires.
    - builder: bethesda_plugin
      name: Skyrim.esm
      args: {masters: [], master_flag: true}
    - builder: bethesda_plugin_with_record
      name: Fine.esp
      args: {light: true, object_index: 291}
  expect:
    absent: [esplugin.invalid_light_plugin]
    max_errors: 0
