id: pb_crypto_miner_linux_pool_cpu_gpu
version: 0.4
name: "Cryptominer (Linux): Pool Connection + Sustained CPU or GPU"
severity: high
description: >
  Detects host-based cryptomining by correlating miner binaries, a connection to a mining pool port,
  and sustained compute pressure from the same process. Optional config/persistence artifacts increase confidence.
window_sec: 900
cooldown_sec: 3600

required:
  - slot_id: miner_exec
    slot_ttl_sec: 600
    fact: Exec
    where:
      - {field: exe_name, op: regex, value: '^(xmrig|xmr-stak|nanominer|lolminer|nbminer|bminer|t-rex|trex|ethminer|minerd|cpuminer|cgminer|sgminer|xmrig-nvidia|xmrig-amd)$'}
      - {field: cmd, op: regex, value: '(--url|--algo|-o\s+stratum\+(tcp|ssl)|stratum\+(tcp|ssl)://|--pool)'}
    derive_tags: ["T1496", "T1059"]

  # A connect to a common pool port, or a TLS hello naming a pool (stratum+ssl pools on
  # port 443 hide behind the web port, but the server name in the hello is in the clear).
  - slot_id: pool_comms
    slot_ttl_sec: 600
    fact: NetFlow
    where:
      - {field: op, op: in, value: [connect, tls_hello]}
      - {field: dst_private, op: eq, value: "false"}
      - {field: pid, op: in_slot, value: miner_exec}
      - any_of:
          - {field: dst_port, op: in, value: [3333, 3334, 4444, 5555, 7777, 14433, 14444, 45700, 1688]}
          - {field: sni, op: regex, value: '(^|\.)(pool|mine|mining|stratum|xmr|monero|nicehash|2miners|f2pool|ethermine)[a-z0-9-]*\.'}
    derive_tags: ["T1496", "T1071"]

  # One process using 85 percent of a core or more for 5 minutes without a break.
  - slot_id: sustained_compute
    slot_ttl_sec: 900
    fact: HostPerf
    where:
      - {field: scope, op: eq, value: process}
      - {field: cpu_pct, op: gte, value: 85}
      - {field: pid, op: in_slot, value: miner_exec}
      - {field: __agg.kind, op: eq, value: sustained}
      - {field: __agg.duration_sec, op: gte, value: 300}
    derive_tags: ["T1496"]

optional:
  # A GPU at 75 percent or more for 5 minutes without a break. GPU counters do not say
  # which process is busy, so this slot is host wide.
  - slot_id: gpu_pressure
    slot_ttl_sec: 900
    fact: HostPerf
    where:
      - {field: scope, op: eq, value: gpu}
      - {field: gpu_util_pct, op: gte, value: 75}
      - {field: __agg.kind, op: eq, value: sustained}
      - {field: __agg.duration_sec, op: gte, value: 300}
    derive_tags: ["T1496"]

  - slot_id: pool_flow_longlived
    slot_ttl_sec: 900
    fact: Net
    where:
      - {field: op, op: eq, value: open_flow}
      - {field: duration_sec, op: gte, value: 300}
      - {field: pid, op: in_slot, value: miner_exec}
    derive_tags: ["T1071"]

  - slot_id: config_artifacts
    slot_ttl_sec: 900
    fact: FileIO
    where:
      - {field: op, op: in, value: [write, rename]}
      - {field: path, op: regex, value: '(^/etc/|/\.config/|^/var/tmp/).*(miner.*\.json|config\.json|pools\.txt|wallet|\.cfg)$'}
    derive_tags: ["T1036"]

  - slot_id: persistence
    slot_ttl_sec: 1200
    fact: Exec
    where:
      - {field: cmd, op: regex, value: '(systemctl\s+enable|crontab\s+-e|echo\s+.+\s+>\s+/etc/cron\.d/)'}
    derive_tags: ["T1053", "T1543.002"]

forbidden:
  - slot_id: ml_training_job
    slot_ttl_sec: 1200
    fact: Exec
    where:
      - {field: exe_name, op: regex, value: '^(python|python3(\.\d+)?|torchrun|horovodrun)$'}
      - {field: cmd, op: regex, value: '(train|fit|epoch|pytorch|tensorflow)'}
    derive_tags: ["benign_ml_training"]

vendor_map:
  - {product: CrowdStrike, alert_type: "Cryptomining behavior", fills_slot: miner_exec}
  - {product: Elastic, alert_type: "Stratum protocol to mining pool", fills_slot: pool_comms}
  - {product: Datadog, alert_type: "High CPU usage sustained", fills_slot: sustained_compute}

explain:
  primary_ttp: T1496
  narrative: >
    A miner process connected to a mining pool port and kept a core busy for minutes. Optional
    config artifacts, persistence or a long-lived pool connection further increase confidence.
title: "Cryptominer (Linux): Pool Connection + Sustained CPU"
reason_code: CRYPTO_MINER_LINUX_POOL_CPU
rules: []
