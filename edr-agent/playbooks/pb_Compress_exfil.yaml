# Ported from the old steps schema (archive step, then a network step within 900 s).
id: pb_compress_then_exfil_linux
version: 2
name: "Exfiltration (Linux): Archive Staging then Outbound Transfer"
severity: medium
description: >
  Data staged in an archive (tar, zip, 7z, gzip, xz, zstd, gpg, openssl enc) followed by a
  transfer tool connecting to a public address.
window_sec: 1800
cooldown_sec: 600
# One chain per user, as key_by: [host, user] did in the old schema.
context_keys: [host, user]

required:
  - slot_id: stage_archive
    slot_ttl_sec: 1800
    fact: Exec
    where:
      - {field: exe_name, op: regex, value: '^(tar|zip|7z|7za|rar|gzip|pigz|xz|zstd|gpg|openssl)$'}
      # An extract or a list is not staging.
      - {field: cmd, op: not_regex, value: '(\s-[a-zA-Z]*[xt][a-zA-Z]*(\s|$)|\s--extract|\s--list|\s-d(\s|$)|\s--decompress|\s--decrypt)'}
    derive_tags: ["T1560"]    # Archive Collected Data

  - slot_id: outbound_transfer
    slot_ttl_sec: 900
    fact: NetFlow
    where:
      - {field: op, op: eq, value: connect}
      - {field: dst_private, op: eq, value: "false"}
      - {field: exe_name, op: regex, value: '^(curl|wget|scp|sftp|rsync|ssh|nc|ncat|socat|rclone|ftp|lftp)$'}
    derive_tags: ["T1041"]    # Exfiltration Over C2 Channel

explain:
  primary_ttp: [T1560, T1041]
  narrative: >
    An archive was created and a transfer tool then connected to a public address, the shape of
    staging followed by exfiltration.
title: "Exfiltration (Linux): Archive Staging then Outbound Transfer"
reason_code: COMPRESS_THEN_EXFIL
rules: []
