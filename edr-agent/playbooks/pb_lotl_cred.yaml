# Ported from the old steps schema, which described a Windows chain (LSASS, SAM). This is
# the Linux form: a credential dumping tool and a read of a credential store.
id: pb_lotl_cred_linux
version: 2
name: "Credential Access (Linux): Dump Tool + Credential Store Read"
severity: high
description: >
  A credential dumping tool or a process memory dump command, together with a read of
  /etc/shadow, another process's memory or a stored key.
window_sec: 900
cooldown_sec: 600
# One chain per user, as key_by: [host, user] did in the old schema.
context_keys: [host, user]

required:
  - slot_id: cred_tool_exec
    slot_ttl_sec: 900
    fact: Exec
    where:
      - any_of:
          - {field: exe_name, op: regex, value: '^(mimipenguin|mimipenguin\.py|lazagne|laZagne|pypykatz|unshadow|3snake|swap_digger)$'}
          - {field: cmd, op: regex, value: '(gcore\s+(-o\s+\S+\s+)?\d+|procdump\s+-p\s*\d+|gdb\s.*-p\s*\d+|dd\s+if=/proc/\d+/mem|(mimipenguin|lazagne|laZagne|pypykatz))'}
    derive_tags: ["T1003"]    # OS Credential Dumping

  - slot_id: cred_store_read
    slot_ttl_sec: 900
    fact: FileIO
    where:
      - {field: op, op: in, value: [open, open_fail]}
      - {field: path, op: regex, value: '^(/etc/shadow|/etc/gshadow|/etc/security/opasswd|/proc/\d+/mem|/var/lib/sss/db/|/etc/krb5\.keytab|/root/\.ssh/id_|/home/[^/]+/\.ssh/id_)'}
    derive_tags: ["T1003.008", "T1552.004"]    # /etc/passwd and /etc/shadow, Private Keys

optional:
  - slot_id: auth_use
    slot_ttl_sec: 1800
    fact: Auth
    where:
      - {field: result, op: eq, value: success}
    derive_tags: ["T1078"]

explain:
  primary_ttp: T1003
  narrative: >
    A credential dumping tool ran and a credential store was read. A login soon after suggests the
    material was used.
title: "Credential Access (Linux): Dump Tool + Credential Store Read"
reason_code: LOTL_CRED_LINUX
rules: []
