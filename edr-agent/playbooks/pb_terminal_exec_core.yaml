# Ported from the old match schema, which accepted several field names. The two branches
# are now one: a hands-on tool started from an interactive shell.
id: pb_terminal_exec_core
version: 2
name: "Terminal: interactive exec + common tooling"
severity: low
description: A network, scripting or encoding tool started directly by a shell.
window_sec: 300
cooldown_sec: 300

required:
  - slot_id: terminal_exec
    slot_ttl_sec: 300
    fact: Exec
    where:
      - {field: parent_name, op: regex, value: '^(bash|zsh|sh|dash|fish|ksh)$'}
      - {field: exe_name, op: regex, value: '^(curl|wget|nc|ncat|socat|openssl|scp|rsync|perl|base64|xxd)$'}
    derive_tags: ["T1059.004"]    # Unix Shell

explain:
  primary_ttp: T1059.004
  narrative: >
    A shell started a network or encoding tool. Low severity on its own, useful context for other
    detections on the host.
title: "Terminal: interactive exec + common tooling"
reason_code: TERMINAL_EXEC_CORE
rules: []
