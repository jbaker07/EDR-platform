# playbooks/pb_outage_ransomware_linux_cloud_store.yaml
id: pb_outage_ransomware_linux_cloud_store
version: 0.3
name: "Ransomware (Linux): Cloud Object Store Impact (rclone/azcopy/s3cmd)"
severity: high
description: >
  Detects a cloud CLI overwriting or deleting object store data: a destructive verb plus a large
  upload from the same tool to an object store, named by the server name in its TLS hello. The
  agent cannot see HTTP methods inside TLS, so a delete-only run that uploads little is not covered.
window_sec: 1800
cooldown_sec: 5400

required:
  - slot_id: cloud_cli_exec
    slot_ttl_sec: 900
    fact: Exec
    where:
      - {field: exe_name, op: regex, value: '^(rclone|s3cmd|aws|azcopy|gsutil)$'}
      - {field: cmd, op: regex, value: '\s(sync|copy|copyto|mv|move|rm|delete|del|purge|rb|cp)(\s|$)'}
    derive_tags: ["T1041", "T1567"]

  # Was an HTTP PUT and DELETE count. The object store comes from the server name in the
  # TLS hello (sni on each send to that destination). The methods themselves are
  # encrypted: reading them needs a hook inside each client's TLS library, and the cloud
  # CLIs ship their own (Go in rclone, a bundled OpenSSL in aws v2), often stripped, so
  # the bytes sent stand in for the PUT count.
  - slot_id: cloud_upload_burst
    slot_ttl_sec: 900
    fact: NetFlow
    where:
      - {field: exe_name, op: regex, value: '^(rclone|s3cmd|aws|azcopy|gsutil)$'}
      - {field: dst_private, op: eq, value: "false"}
      - {field: sni, op: regex, value: '(^|\.)(amazonaws\.com|storage\.googleapis\.com|blob\.core\.windows\.net|digitaloceanspaces\.com|r2\.cloudflarestorage\.com|backblazeb2\.com|wasabisys\.com)$'}
      - {field: __agg.kind, op: eq, value: egress_volume}
      - {field: __agg.bytes_out, op: gte, value: 200000000}
      - {field: __agg.window_sec, op: lte, value: 900}
    derive_tags: ["T1486"]

optional:
  - slot_id: rclone_conf_touch
    slot_ttl_sec: 900
    fact: FileIO
    where:
      - {field: path, op: regex, value: '/\.config/rclone/rclone\.conf$'}
      - {field: op, op: in, value: [write, rename]}

forbidden:
  # Was a code signer check. Linux binaries carry no signature, so this asks for a backup
  # tool installed by its package whose bytes still match the package checksum. A copy
  # or a look-alike named restic in /tmp does not veto.
  - slot_id: known_backup_tool
    slot_ttl_sec: 3600
    fact: Exec
    where:
      - {field: exe_package, op: in, value: [restic, borgbackup, duplicity, rdiff-backup, rsnapshot, bacula-client, bacula-fd, velero]}
      - {field: exe_pkg_verified, op: eq, value: "true"}

vendor_map:
  - {product: Microsoft Defender, alert_type: "Suspicious object store deletion", fills_slot: cloud_upload_burst}

explain:
  primary_ttp: T1486
  narrative: >
    A cloud CLI ran a destructive verb and pushed a large upload, consistent with overwriting
    object store data in place. Local file cryptography may be absent, the impact is on cloud data.
title: "Ransomware (Linux): Cloud Object Store Impact (rclone/azcopy/s3cmd)"
reason_code: OUTAGE_RANSOMWARE_LINUX_CLOUD_STORE
rules: []
