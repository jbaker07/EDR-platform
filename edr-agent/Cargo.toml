[package]
name = "forensic_hooks"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "forensic_hooks"
path = "src/main.rs"


[[bin]]
name = "fingerprint_gen"
path = "src/bin/fingerprint_gen.rs"

[dependencies]
hostname = "0.3"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.11", features = ["blocking", "json"] }
sysinfo = "0.29"
openssl = "0.10"
anyhow = "1.0"
ed25519-dalek = "1.0"
sha3 = "0.10"
hex = "0.4"
notify = "6.1"
lazy_static = "1.4"
aya = { version = "0.11", features = ["async_tokio"] }
aya-log = "0.2.1"
tokio = { version = "1", features = ["full"] }
hmac = "0.12"
base64 = "0.21"
walkdir = "2"
flate2 = "1"
regex = "1"
netlink-sys = "0.6"
log = "0.4.27"
simple_logger = "5.0.0"
glob = "0.3.2"
bytes = "1.6"
sha2 = "0.10"
tokio-stream = "0.1"
futures = "0.3"
futures-util = "0.3.31"
users = "0.11"
fs2 = "0.4"
entropy = "0.4"
geo = "0.30.0"
bincode = "2.0.1"
libc = "0.2"
num-traits = "0.2.19"
once_cell = "1.21.3"
mime_guess = "2.0"
nix = { version = "0.30.1", features = ["uio", "process"] }
dirs = "6.0.0"

