[package]
name = "forensic_hooks"
version = "0.1.0"
edition = "2021"
resolver = "2"

# make the library target explicit so the bin can import it as `forensic_hooks::...`
[lib]
name = "forensic_hooks"
path = "src/lib.rs"

[[bin]]
name = "forensic_hooks"
path = "src/main.rs"

[[bin]]
name = "fingerprint_gen"
path = "src/bin/fingerprint_gen.rs"

[features]
default = []
embed_bpf = []
ebpf = []
with-ebpf = []
with-ebpf-load = []

[dependencies]
# --- web / http ---
axum = "0.7"
tower-http = { version = "0.5", features = ["cors", "fs", "set-header"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "signal", "time"] }
futures-util = "0.3.31"
hyper = "1"

# --- serde / json ---
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"

# --- logging ---
log = "0.4.27"
env_logger = "0.11"
parking_lot = "0.12"
serde_yaml = "0.9"

# --- time / utils ---
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
once_cell = "1.19.0"
bytes = "1.6"
rand = "0.8"
walkdir = "2"
lazy_static = "1.4"
# --- crypto / hashing ---
sha1 = "0.10"
sha2 = "0.10"
openssl = "0.10"

# --- file/sys/comp ---
flate2 = "1"
fs2 = "0.4"
mime_guess = "2.0"
uzers = "0.12"
sysinfo = "0.29"
hostname = "0.3"
dirs = "6.0.0"
libc = "0.2"
nix = { version = "0.30.1", features = ["uio", "process"] }

# --- math / stats / geom ---
nalgebra = { version = "0.32", default-features = false, features = ["std"] }
num-traits = "0.2.19"

# --- misc ---
anyhow = "1.0"
hex = "0.4"
glob = "0.3.2"
entropy = "0.4"
reqwest = { version = "0.12", features = ["blocking", "json", "rustls-tls"] }
tracing = "0.1.41"

# eBPF loader (Linux only)
[target.'cfg(target_os = "linux")'.dependencies]
libbpf-rs = "0.21"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
