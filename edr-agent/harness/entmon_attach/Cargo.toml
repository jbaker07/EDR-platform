[package]
name = "entmon_attach"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
aya = { version = "0.13.1", features = ["async_tokio"] }
aya-log = "0.2.1"
bytes = "1"
env_logger = "0.11"
libc = "0.2"
log = "0.4"
tokio = { version = "1.38", features = ["rt-multi-thread","macros","signal","time"] }
